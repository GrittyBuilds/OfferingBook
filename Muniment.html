  /* ---- Party directory -------------------------------------------------- */
  // Issuers, escrow agents, counsel. Entered once; picked everywhere after.
  async listParties(role){return role?partiesByRole(role):db.parties.slice().sort((a,b)=>
    String(a.role||'').localeCompare(String(b.role||''))||String(a.name||'').localeCompare(String(b.name||'')));},
  async saveParty(b,id){
    const row=partyFromBody(b);
    if(!row.name)throw new Error('A name is required.');
    if(id){const e=partyById(id);if(!e)throw new Error('Party not found');
      Object.assign(e,row,{updated_at:nowISO()});await persist();return e;}
    const e={id:nextId('parties'),...row,created_at:nowISO(),updated_at:nowISO()};
    db.parties.push(e);await persist();return e;},
  async deleteParty(id){id=Number(id);
    const used=db.offerings.filter(o=>o.issuer_party_id===id||o.escrow_party_id===id);
    if(used.length)throw new Error(`${used.length} offering${used.length===1?' still refers':'s still refer'} to this party. Change ${used.length===1?'it':'them'} first.`);
    db.parties=db.parties.filter(x=>x.id!==id);await persist();return{ok:true};},

  /* ---- Suggestions ------------------------------------------------------ */
  // Reading is free of side effects; only accept() writes, and only when
  // somebody presses the button.
  async listSuggestions(offeringId){return computeSuggestions(offeringId);},
  async acceptSuggestion(s){
    if(!s||typeof s.apply!=='function')throw new Error('This one has nothing to apply — it needs a decision from you.');
    await s.apply();
    logActivity('accepted',s.title,s.offeringId,s.key);
    await persist();return{ok:true};},
  async dismissSuggestion(s){
    if(!db.dismissed)db.dismissed={};
    db.dismissed[s.key]=nowISO();
    logActivity('dismissed',s.title,s.offeringId,s.key);
    await persist();return{ok:true};},
  async restoreDismissed(){db.dismissed={};await persist();return{ok:true};},
  async listActivity(offeringId,limit=40){
    const rows=db.activity.filter(a=>offeringId==null||a.offering_id===Number(offeringId));
    return rows.slice(-limit).reverse();},
};
// `existing` supplies the values for fields the form did not render, so an
// edit narrows to what was on screen rather than blanking the rest.
function certFromBody(b,existing){const e=existing||{};return{
  cert_number:str(b.cert_number),investor_id:numOr(b.investor_id),
  holder_name:'holder_name'in b?str(b.holder_name):(e.holder_name??null),
  class_name:str(b.class_name),capital_cents:b.no_capital?null:dollarsToCents(b.capital),
  // pct_of_class: optional manual override of the holder's share WITHIN its class.
  pct_of_class:numOr(b.pct_of_class),
  // percent_interest: optional manual override of TOTAL % ownership (else computed).
  percent_interest:numOr(b.percent_interest),
  pref_return_rate:numOr(b.pref_return_rate),
  // accrued_cents: optional manual override (else auto-computed to today).
  accrued_cents:dollarsToCents(b.accrued),
  funded_date:str(b.funded_date),
  accrual_start:'accrual_start'in b?str(b.accrual_start):(e.accrual_start??null),
  closing_id:'closing_id'in b?numOr(b.closing_id):(e.closing_id??null),
  subscription_id:'subscription_id'in b?numOr(b.subscription_id):(e.subscription_id??null),
  sort_index:numOr(b.sort_index),no_capital:b.no_capital?1:0,
  issue_date:str(b.issue_date),notes:str(b.notes)};}

/* ============================================================================
   SUGGESTIONS — the record proposes what it can already prove.

   Nothing here writes anything. computeSuggestions returns descriptions of
   changes; a change happens only when a person presses Accept. That is a
   deliberate choice: this is a securities file, and a figure nobody assented
   to is worse than a figure typed twice.
   ========================================================================== */

// Checklist steps whose completion the record itself can evidence. The key is
// stored on the task as `proves`, so a renamed step keeps its proof and a
// hand-written step never acquires one.
const TASK_PROOFS={
  form_d:o=>o.form_d_filed_date&&`Form D is recorded as filed on ${fmtDate(o.form_d_filed_date)}.`,
  escrow_setup:o=>(o.escrow_agent||o.escrow_bank)&&`Escrow is recorded with ${[o.escrow_agent,o.escrow_bank].filter(Boolean).join(' at ')}.`,
  docs_sent:o=>{const s=db.subscriptions.filter(x=>x.offering_id===o.id&&x.status!=='Withdrawn');
    return s.length&&s.every(x=>x.sub_sent_date)&&`All ${s.length} subscription agreement${s.length===1?' has':'s have'} a sent date.`;},
  subs_collected:o=>{const s=db.subscriptions.filter(x=>x.offering_id===o.id&&x.status!=='Withdrawn');
    return s.length&&s.every(x=>x.sub_signed_date)&&`All ${s.length} subscription agreement${s.length===1?' is':'s are'} signed.`;},
  accreditation:o=>{const ids=[...new Set(db.subscriptions.filter(x=>x.offering_id===o.id&&x.status!=='Withdrawn').map(x=>x.investor_id))];
    const inv=ids.map(id=>db.investors.find(i=>i.id===id)).filter(Boolean);
    return inv.length&&inv.every(i=>i.accredited_status==='Verified')&&`All ${inv.length} subscriber${inv.length===1?' is':'s are'} verified accredited.`;},
  min_raise:o=>{const s=escrowSummary(o.id);
    return o.target_min_cents>0&&s.clearedNetDeposits>=o.target_min_cents&&
      `${money(s.clearedNetDeposits)} has cleared escrow against a ${money(o.target_min_cents)} minimum.`;},
  closing_held:o=>{const n=db.closings.filter(c=>c.offering_id===o.id).length;
    return n>0&&`${n} closing${n===1?' is':'s are'} on record.`;},
  escrow_released:o=>{const r=escrowSummary(o.id).releases;
    return r>0&&`${money(r)} has been released to the issuer.`;}
};
// Which default step proves which. Index-aligned with DEFAULT_CHECKLIST.
const DEFAULT_CHECKLIST_PROOFS={
  'Set up escrow account with escrow agent':'escrow_setup',
  'File Form D with the SEC':'form_d',
  'Distribute offering documents to investors':'docs_sent',
  'Collect signed subscription agreements':'subs_collected',
  'Verify accredited-investor status':'accreditation',
  'Confirm minimum raise satisfied':'min_raise',
  'Hold closing':'closing_held',
  'Release escrow funds to issuer':'escrow_released'
};

/* A suggestion:
   {key, kind, offeringId, title, detail, evidence, severity, apply}
   `key` is stable for the same fact and changes when the fact changes, so a
   dismissal sticks but a changed circumstance comes back. */
function sugg(key,offeringId,title,detail,evidence,apply,severity='info'){
  return{key,offeringId:offeringId??null,title,detail,evidence,apply,severity};
}
function dismissed(key){return!!(db.dismissed&&db.dismissed[key]);}

function computeSuggestions(offeringId){
  const out=[];
  if(settings().automation!=='propose')return out;
  const only=offeringId==null?null:Number(offeringId);
  const offerings=only==null?db.offerings:db.offerings.filter(o=>o.id===only);

  for(const o of offerings){
    const subs=db.subscriptions.filter(s=>s.offering_id===o.id);
    const tasks=db.tasks.filter(t=>t.offering_id===o.id);
    const es=escrowSummary(o.id);

    /* -- Money that arrived, against the subscription it answers ----------- */
    for(const s of subs){
      if(s.status==='Withdrawn')continue;
      const inv=db.investors.find(i=>i.id===s.investor_id);
      const who=inv?investorDisplayName(inv):'This subscriber';
      const esc=investorEscrow(o.id,s.investor_id,s.id);
      const due=subscriptionDue(s,o);

      // A cleared deposit dates the funding. Do not make anyone retype it.
      if(esc.fundedDate&&s.funded_date!==esc.fundedDate){
        out.push(sugg(`funded-date:${s.id}:${esc.fundedDate}`,o.id,
          `Set ${who}'s funded date to ${fmtDate(esc.fundedDate)}`,
          s.funded_date?`The subscription records ${fmtDate(s.funded_date)}, but the earliest cleared deposit is ${fmtDate(esc.fundedDate)}. Certificate numbering runs off this date.`
            :'The deposit has cleared escrow, so the funding date is already on record. Certificate numbering runs off this date.',
          `${money(esc.clearedDeposits)} cleared escrow`,
          async()=>{s.funded_date=esc.fundedDate;if(SUB_STATUS_RANK[s.status]<SUB_STATUS_RANK.Funded)s.status='Funded';
            s.updated_at=nowISO();await persist();}));
      }

      // Funding recorded on the subscription but nothing in the escrow ledger.
      // An unattributed deposit of exactly this amount is very likely this
      // money, recorded without the investor — propose nothing rather than a
      // double entry the reconciliation would then chase.
      const unattributed=db.escrow.some(e=>e.offering_id===o.id&&e.txn_type==='deposit'&&!e.investor_id&&e.amount_cents===due);
      if(s.funded_date&&!esc.rows.length&&due>0&&!unattributed){
        out.push(sugg(`deposit-missing:${s.id}:${s.funded_date}:${due}`,o.id,
          `Record ${who}'s ${money(due)} deposit in the escrow ledger`,
          `The subscription is funded as at ${fmtDate(s.funded_date)}, but no deposit appears in the escrow ledger, so the cleared balance understates what was received.`,
          `${money(s.amount_committed_cents)} committed${o.pass_through_costs&&s.costs_cents?` · ${money(s.costs_cents)} costs`:''}`,
          async()=>{db.escrow.push({id:nextId('escrow'),offering_id:o.id,investor_id:s.investor_id,subscription_id:s.id,
            txn_type:'deposit',amount_cents:due,txn_date:s.funded_date,method:null,reference:null,cleared:1,
            notes:'Recorded from the subscription.',source:'proposed',created_at:nowISO()});await persist();},
          'warn'));
      }

      // The label has fallen behind the dates underneath it.
      const derived=derivedSubStatus(s);
      if(!s.closing_id&&derived!==s.status&&(SUB_STATUS_RANK[derived]??0)>(SUB_STATUS_RANK[s.status]??0)){
        out.push(sugg(`sub-status:${s.id}:${derived}`,o.id,
          `Move ${who} to “${derived}”`,
          `The subscription is marked “${s.status}”, but its own dates put it at “${derived}”. Signed and funded totals on the printed summary are scored from this.`,
          derived==='Funded'?`Funded ${fmtDate(s.funded_date)}`:derived==='Sub signed'?`Signed ${fmtDate(s.sub_signed_date)}`:derived==='Sub sent'?`Sent ${fmtDate(s.sub_sent_date)}`:'Linked to a closing',
          // Re-derived at the moment it runs: an earlier accepted change may
          // already have moved this subscription further on, and a label must
          // only ever advance.
          async()=>{const d=derivedSubStatus(s);
            if(s.status!=='Withdrawn'&&(SUB_STATUS_RANK[d]??0)>(SUB_STATUS_RANK[s.status]??0)){s.status=d;s.updated_at=nowISO();await persist();}}));
      }

      // Units and the amount disagree with the price they are both drawn from.
      const scope=scopeFor({offering:o,subscription:s});
      const du=derivedUnits(s,scope);
      if(du!=null&&s.units!=null&&Math.abs(Number(s.units)-du)>1e-6){
        out.push(sugg(`units:${s.id}:${du}`,o.id,
          `Set ${who}'s units to ${du}`,
          `${money(s.amount_committed_cents)} at ${money(inherited(scope,'price_per_unit_cents'))} a unit is ${du} units; the subscription records ${s.units}.`,
          `${s.units} recorded · ${du} implied`,
          async()=>{s.units=du;s.updated_at=nowISO();await persist();},'warn'));
      }
      if(du!=null&&s.units==null){
        out.push(sugg(`units-blank:${s.id}:${du}`,o.id,
          `Record ${du} units for ${who}`,
          `The amount and the unit price already determine this. Units appear on the roster and the printed summary.`,
          `${money(s.amount_committed_cents)} ÷ ${money(inherited(scope,'price_per_unit_cents'))}`,
          async()=>{s.units=du;s.updated_at=nowISO();await persist();}));
      }

      // Closed against a closing but still labelled otherwise.
      if(s.closing_id&&s.status!=='Closed'&&s.status!=='Withdrawn'){
        out.push(sugg(`closed-label:${s.id}`,o.id,
          `Mark ${who} closed`,
          'The subscription is linked to a closing but is not labelled Closed.','Linked to a closing',
          async()=>{s.status='Closed';s.updated_at=nowISO();await persist();}));
      }
    }

    /* -- Money in the ledger with no subscription behind it ---------------- */
    const subInvestors=new Set(subs.map(s=>s.investor_id));
    // Grouped per depositor: two wires from one investor are one subscriber
    // to add, not two subscriptions.
    const strays=new Map();
    for(const e of db.escrow.filter(x=>x.offering_id===o.id&&x.txn_type==='deposit'&&x.investor_id)){
      if(subInvestors.has(e.investor_id))continue;
      if(!strays.has(e.investor_id))strays.set(e.investor_id,[]);
      strays.get(e.investor_id).push(e);
    }
    for(const[invId,rows]of strays){
      const inv=db.investors.find(i=>i.id===invId);
      const total=rows.reduce((a,e)=>a+(Number(e.amount_cents)||0),0);
      const firstCleared=rows.filter(e=>e.cleared).map(e=>e.txn_date).filter(Boolean).sort()[0]||null;
      out.push(sugg(`sub-missing:${o.id}:${invId}:${total}`,o.id,
        `Add ${inv?investorDisplayName(inv):'this depositor'} to the offering`,
        `${rows.length===1?'A deposit is':rows.length+' deposits are'} recorded against someone who is not a subscriber on this offering, so the money sits in escrow against nothing.`,
        `${money(total)} deposited`,
        async()=>{
          // Re-checked at apply time: an earlier accept may already have
          // added this depositor.
          if(db.subscriptions.some(x=>x.offering_id===o.id&&x.investor_id===invId))return;
          const sub={id:nextId('subscriptions'),offering_id:o.id,investor_id:invId,
            amount_committed_cents:total,units:null,costs_cents:null,tranche_id:null,
            funded_date:firstCleared,status:firstCleared?'Funded':'Prospect',
            sub_sent_date:null,sub_signed_date:null,notes:'Created from the escrow ledger.',closing_id:null,
            source:'proposed',created_at:nowISO(),updated_at:nowISO()};
          db.subscriptions.push(sub);
          rows.forEach(e=>{if(e.subscription_id==null)e.subscription_id=sub.id;});
          await persist();},
        'warn'));
    }

    /* -- Checklist steps the record already evidences ---------------------- */
    for(const t of tasks){
      if(t.done)continue;
      const proofKey=t.proves||DEFAULT_CHECKLIST_PROOFS[t.label];
      if(!proofKey||!TASK_PROOFS[proofKey])continue;
      const proof=TASK_PROOFS[proofKey](o);
      if(!proof)continue;
      out.push(sugg(`task:${t.id}`,o.id,`Mark “${t.label}” complete`,proof,'Proved by the record',
        async()=>{t.done=1;t.done_date=todayISO();await persist();}));
    }
    // The converse: a step ticked whose date the offering never got.
    const formD=tasks.find(t=>(t.proves||DEFAULT_CHECKLIST_PROOFS[t.label])==='form_d');
    if(formD&&formD.done&&!o.form_d_filed_date&&formD.done_date){
      out.push(sugg(`formd-date:${o.id}:${formD.done_date}`,o.id,
        `Record the Form D filing date as ${fmtDate(formD.done_date)}`,
        'The checklist step is complete but the offering has no filing date, so the printed summary shows a dash where the filing should be.',
        'From the checklist',
        async()=>{o.form_d_filed_date=formD.done_date;o.updated_at=nowISO();await persist();}));
    }

    /* -- The offering's own labels ---------------------------------------- */
    const days=daysUntil(o.final_close_date);
    if(days!==null&&days<0&&!['Closed','Terminated'].includes(o.status)){
      out.push(sugg(`past-deadline:${o.id}:${o.final_close_date}`,o.id,
        `${o.name} is past its final close deadline`,
        `The deadline was ${fmtDate(o.final_close_date)} and the offering is still ${o.status}. Either extend the deadline or move the offering on.`,
        relDays(days),null,'warn'));
    }
    if(o.status==='Drafting'&&(subs.length||es.deposits)){
      out.push(sugg(`status-open:${o.id}`,o.id,`Move ${o.name} to Open`,
        'The offering is still marked Drafting although subscribers and escrow activity are on record.',
        `${subs.length} subscriber${subs.length===1?'':'s'}`,
        async()=>{o.status='Open';o.updated_at=nowISO();await persist();}));
    }

    /* -- Ownership classes ------------------------------------------------- */
    const classes=Array.isArray(o.classes)?o.classes:[];
    if(classes.length){
      const sum=classes.reduce((a,c)=>a+(Number(c.total_percent)||0),0);
      if(Math.abs(sum-100)>0.0001){
        out.push(sugg(`class-sum:${o.id}:${sum}`,o.id,'The ownership classes do not total 100%',
          `The defined classes come to ${fmtPct(sum)} of the company. Every certificate's total percentage is scaled from these, so the cap table is wrong until they balance.`,
          fmtPct(sum),null,'warn'));
      }
      // A class name that exists only on a certificate is almost always a typo.
      const known=new Set(classes.map(c=>c.name));
      const stray=[...new Set(db.certificates.filter(c=>c.offering_id===o.id&&c.class_name&&!known.has(c.class_name)).map(c=>c.class_name))];
      for(const name of stray){
        out.push(sugg(`stray-class:${o.id}:${name}`,o.id,`“${name}” is not one of this offering's classes`,
          'Certificates carry a class name that the class structure does not define, so their share is pro-rated outside the defined split.',
          [...known].join(' · ')||'no classes defined',null,'warn'));
      }
    }

    /* -- Certificates against their subscriptions -------------------------- */
    for(const c of db.certificates.filter(x=>x.offering_id===o.id)){
      if(c.no_capital||!c.investor_id)continue;
      // The certificate's own link first; else the investor's single live
      // subscription. Two live subscriptions is ambiguous — say nothing
      // rather than compare against the wrong one.
      let s=c.subscription_id?subs.find(x=>x.id===c.subscription_id):null;
      if(!s){const live=subs.filter(x=>x.investor_id===c.investor_id&&x.status!=='Withdrawn');
        if(live.length!==1)continue;s=live[0];}
      if(!s||s.amount_committed_cents==null||c.capital_cents==null)continue;
      if(c.capital_cents!==s.amount_committed_cents){
        const inv=db.investors.find(i=>i.id===c.investor_id);
        out.push(sugg(`cert-capital:${c.id}:${s.amount_committed_cents}`,o.id,
          `Certificate ${c.cert_number} disagrees with the subscription`,
          `The certificate records ${money(c.capital_cents)} of capital for ${inv?investorDisplayName(inv):'this holder'}; the subscription records ${money(s.amount_committed_cents)}. Percentage interests are computed from capital.`,
          `${money(c.capital_cents)} on the certificate`,
          async()=>{c.capital_cents=s.amount_committed_cents;await persist();},'warn'));
      }
    }

    /* -- Reconciliation ---------------------------------------------------- */
    const recs=db.reconciliations.filter(r=>r.offering_id===o.id)
      .sort((a,b)=>(b.statement_date||b.created_at||'').localeCompare(a.statement_date||a.created_at||''));
    if(recs[0]&&recs[0].difference_cents){
      out.push(sugg(`recon:${recs[0].id}`,o.id,'The last reconciliation did not agree',
        `The statement of ${fmtDate(recs[0].statement_date)} differs from the app's cleared balance by ${money(Math.abs(recs[0].difference_cents))}. Pending deposits that have since cleared are the usual cause.`,
        (recs[0].difference_cents>0?'+':'−')+money(Math.abs(recs[0].difference_cents)),null,'warn'));
    }
    // Deposits sitting pending long after their date.
    const stale=db.escrow.filter(e=>e.offering_id===o.id&&e.txn_type==='deposit'&&!e.cleared&&e.txn_date&&daysUntil(e.txn_date)<-10);
    if(stale.length){
      const total=stale.reduce((a,e)=>a+(e.amount_cents||0),0);
      out.push(sugg(`stale-pending:${o.id}:${stale.length}:${total}`,o.id,
        `${stale.length} deposit${stale.length===1?'':'s'} still pending after ten days`,
        'Pending deposits are excluded from the cleared balance, so the minimum raise reads low until they are marked cleared.',
        `${money(total)} pending`,null,'warn'));
    }
  }

  /* -- Contact book and directory (not tied to one offering) --------------- */
  if(only==null){
    for(const i of db.investors){
      if(i.accredited_status==='Verified'&&!i.accredited_verified_date){
        out.push(sugg(`acc-date:${i.id}`,null,`Record when ${investorDisplayName(i)}'s accreditation was verified`,
          'The investor is marked Verified with no verification date. The date is the part that evidences the exemption.',
          'Verified, undated',null));
      }
    }
    // Two records for one person is the most expensive duplicate of all.
    const seen=new Map();
    for(const i of db.investors){
      for(const k of [i.email&&`e:${String(i.email).toLowerCase()}`,i.tax_id&&`t:${String(i.tax_id).replace(/\D/g,'')}`].filter(Boolean)){
        if(k==='t:')continue;
        if(seen.has(k)){
          const other=seen.get(k);
          out.push(sugg(`dup:${Math.min(other.id,i.id)}:${Math.max(other.id,i.id)}`,null,
            `${investorDisplayName(other)} and ${investorDisplayName(i)} share ${k.startsWith('e:')?'an email address':'a taxpayer ID'}`,
            'Two contact records for one holder split their subscriptions, their accreditation evidence and their certificates.',
            k.slice(2),null,'warn'));
        }else seen.set(k,i);
      }
    }
    if(!settings().firm_name&&db.offerings.length){
      out.push(sugg('settings-firm',null,'Set up your firm details',
        'The firm name, address and report footer appear on every printed summary, and the defaults you set there start every new offering.',
        'Entered once',null));
    }
  }

  return out.filter(s=>!dismissed(s.key));
}

// A new offering starts from the firm's own settings rather than from blank
// fields. Everything here is editable; none of it has to be typed again.
function newOfferingDefaults(){
  const cfg=settings();
  const escrow=cfg.default_escrow_party_id?partyById(cfg.default_escrow_party_id):null;
  return{status:'Drafting',
    exemption:cfg.default_exemption||'',
    security_type:cfg.default_security_type||'',
    default_return_rate:cfg.default_return_rate??'',
    min_investment:centsToInput(cfg.default_min_investment_cents),
    costs_label:cfg.default_costs_label||'',
    escrow_agent:escrow?escrow.name:'',
    escrow_bank:escrow?escrow.bank_name||'':'',
    escrow_party_id:escrow?escrow.id:null,
    launch_date:''};
}
// Fill a blank field from a directory entry, and never overwrite something the
// user has already put there.
function fillFrom(api,values,pairs){
  for(const[field,value]of pairs)
    if(value&&!values[field])api.setValue(field,value);
}

function openEscrowForm(offeringId,investors,existing,onDone){
  const isEdit=!!existing;

  // Subscribers on this offering are who a deposit almost always belongs to.
  const subscriberIds=db.subscriptions.filter(s=>s.offering_id===Number(offeringId)).map(s=>s.investor_id);
  // Live help under the Investor field: what this person subscribed for and
  // what has already come in, so the amount does not have to be looked up.
  const context=el('div',{class:'field-note'});
  function describe(investorId){
    clear(context);
    const sub=investorId?subscriptionFor(offeringId,investorId):null;
    if(!sub){if(investorId)context.appendChild(el('span',{},'Not a subscriber on this offering yet.'));return null;}
    const e=investorEscrow(offeringId,sub.investor_id,sub.id);
    const due=subscriptionDue(sub,o),got=e.deposits-e.refunds,left=Math.max(0,due-got);
    context.appendChild(el('span',{},
      `Subscribed ${money(due)}`,
      got?` · ${money(got)} received`:' · nothing received yet',
      left?` · ${money(left)} outstanding`:' · fully funded'));
    return{sub,left,due};
  }
  formModal({title:isEdit?'Edit escrow entry':'New escrow entry',submitLabel:isEdit?'Save changes':'Add entry',
    values:existing?{txn_type:existing.txn_type,investor_id:existing.investor_id??'',amount:centsToInput(existing.amount_cents),
      txn_date:existing.txn_date,method:existing.method,reference:existing.reference,cleared:existing.cleared?'yes':'no',notes:existing.notes}
      // A new entry opens as a deposit, dated today, by whatever method the
      // last deposit on this offering used.
      :{txn_type:'deposit',cleared:'no',txn_date:defaultDate(),method:lastEscrowMethod(offeringId)||''},
    fields:[
      {name:'txn_type',label:'Type',type:'select',options:TXN_TYPES,half:true},
      {name:'amount',label:'Amount',type:'money',required:true,half:true},
      {name:'investor_id',label:'Investor',type:'custom',half:true,
        build:val=>investorPicker(investors,val,{preferred:subscriberIds,allowCreate:true,
          onPick:i=>{
            const info=describe(i.id);
            // Fill a blank amount with what is still outstanding. An amount
            // already typed is left exactly as typed.
            const amt=document.getElementById('f_amount');
            if(info&&info.left&&amt&&!amt.value)amt.value=(info.left/100).toFixed(2);
          }}),
        help:'Deposits and refunds belong to an investor; releases and fees do not.'},
      {name:'txn_date',label:'Date',type:'date',half:true},
      {name:'method',label:'Method',type:'select',options:['',...PAYMENT_METHODS],half:true},
      {name:'cleared',label:'Cleared at bank?',type:'select',options:[{value:'no',label:'Pending'},{value:'yes',label:'Cleared'}],half:true,
        help:'Only cleared deposits count towards the minimum raise.'},
      {name:'reference',label:'Reference / check #',half:true,mono:true},
      {name:'notes',label:'Notes',type:'textarea'}],
    onSubmit:async v=>{
      const sub=v.investor_id?subscriptionFor(offeringId,v.investor_id):null;
      const payload={...v,cleared:v.cleared==='yes',subscription_id:sub?sub.id:null};
      if(isEdit)await api.updateEscrow(existing.id,payload);else await api.createEscrow(offeringId,payload);
      toast('Escrow entry saved.','success');onDone?.();}});
  // Place the running context under the investor row and prime it.
  const row=document.getElementById('f_amount');
  const invRow=document.querySelector('#modal-root .form-row .ac-wrap');
  if(invRow&&invRow.parentElement)invRow.parentElement.appendChild(context);
  if(existing&&existing.investor_id)describe(existing.investor_id);
}

      el('label',{class:'check-label'},el('input',{type:'checkbox',checked:!!t.done,onchange:async e=>{

  drawList(tasks);
  return el('section',{class:'panel'},el('div',{class:'section-head'},el('h2',{},'Process checklist'),countLabel),list,

function openClosingForm(offeringId,openSubs,existingCount,onDone){
  const o=db.offerings.find(x=>x.id===Number(offeringId))||{};
  const es=escrowSummary(offeringId);
  // What each selected subscriber has actually put into escrow, and what is
  // available to release. A closing releases money, not promises.
  const clearedFor=sub=>Math.max(0,investorEscrow(offeringId,sub.investor_id,sub.id).clearedNet);
  const labelInput=el('input',{type:'text',class:'inline-input',style:'width:100%',value:`Closing ${existingCount+1}`});
  const dateInput=el('input',{type:'date',class:'inline-input',style:'width:100%',value:defaultDate()});
  const amountInput=el('input',{type:'text',class:'inline-input money-input',placeholder:'0.00',inputmode:'decimal',style:'width:100%'});
  const feesInput=el('input',{type:'text',class:'inline-input money-input',placeholder:'0.00',inputmode:'decimal',style:'width:100%'});
  const notesInput=el('textarea',{rows:2,class:'inline-input',style:'width:100%'});
  const markClosed=el('input',{type:'checkbox',checked:true});
  const issueCerts=el('input',{type:'checkbox',checked:true});
  let amountEdited=false,feesEdited=false;
  amountInput.addEventListener('input',()=>{amountEdited=true;});
  feesInput.addEventListener('input',()=>{feesEdited=true;});
  const checks=[];
  // Two figures, always both on screen: what was promised, and what is there.
  const tally=el('div',{class:'field-note'});
  function recompute(){
    const picked=checks.filter(c=>c.cb.checked);
    const committed=picked.reduce((a,c)=>a+(c.sub.amount_committed_cents||0),0);
    const cleared=picked.reduce((a,c)=>a+clearedFor(c.sub),0);
    // Never propose releasing more than is in the account.
    const releasable=Math.min(cleared,Math.max(0,es.clearedBalance));
    if(!amountEdited)amountInput.value=releasable?(releasable/100).toFixed(2):'';
    if(!feesEdited&&o.pass_through_costs){
      const costs=picked.reduce((a,c)=>a+(c.sub.costs_cents||0),0);
      feesInput.value=costs?(costs/100).toFixed(2):'';
    }
    clear(tally);
    if(picked.length)tally.appendChild(el('span',{},
      `${picked.length} selected · ${money(committed)} committed · `,
      el('strong',{},`${money(cleared)} cleared in escrow`),
      cleared<committed?el('span',{class:'warn-text'},` · ${money(committed-cleared)} not yet received`):null));
    else tally.appendChild(el('span',{},`${money(es.clearedBalance)} is available in escrow.`));
  }
  // Funded subscribers first — they are who a closing is for.
  const ordered=openSubs.slice().sort((a,b)=>(clearedFor(b)>0)-(clearedFor(a)>0)||String(a.investor_name||'').localeCompare(String(b.investor_name||'')));
  const rows=ordered.map(sub=>{const cb=el('input',{type:'checkbox',onchange:recompute});checks.push({cb,sub});
    const got=clearedFor(sub);
    return el('label',{class:'pick-row'+(got?'':' unfunded')},cb,el('span',{class:'pick-name'},sub.investor_name,
      sub.status?el('span',{class:'pick-status'},sub.status):null),
      el('span',{class:'pick-amt'},money(sub.amount_committed_cents),
        el('span',{class:got?'pick-funded':'pick-pending'},got?`${money(got)} in escrow`:'nothing received')));});
  const selectAll=el('input',{type:'checkbox',onchange:e=>{checks.forEach(c=>c.cb.checked=e.target.checked);recompute();}});
  const picklist=openSubs.length
    ? el('div',{},el('label',{class:'pick-row pick-all'},selectAll,el('span',{class:'pick-name'},'Select all'),el('span',{})),
        el('div',{class:'closing-picklist'},...rows),tally)
    : el('p',{class:'field-help'},'No open investors to include. You can still record a release amount.');
  // The precondition that matters most in an escrowed offering, stated before
  // the form is filled in rather than discovered afterwards.
  const met=o.target_min_cents==null||es.clearedNetDeposits>=o.target_min_cents;
  const ackBox=el('input',{type:'checkbox'});
  const readiness=o.target_min_cents==null
    ? el('div',{class:'readiness-banner'},el('span',{},'No minimum raise is set on this offering.'))
    : el('div',{class:'readiness-banner '+(met?'met':'short')},
        el('span',{},met?'@icon:check':'@icon:warning'),
        el('div',{},
          el('strong',{},met?'Minimum raise satisfied':'Minimum raise not yet satisfied'),
          el('div',{class:'readiness-detail'},`${money(es.clearedNetDeposits)} cleared against a ${money(o.target_min_cents)} minimum`+
            (met?'.':` — ${money(o.target_min_cents-es.clearedNetDeposits)} short.`))),
        met?null:el('label',{class:'ack-row'},ackBox,el('span',{},'Close anyway — I have a reason on file')));
  const errorBox=el('div',{class:'form-error',style:'display:none'});
  const submitBtn=el('button',{class:'btn btn-primary',type:'submit'},'Record closing');
  function field(label,node,help){return el('div',{class:'form-row'},el('label',{},label),node,help?el('div',{class:'field-help'},help):null);}
  const form=el('form',{class:'modal-body',onsubmit:async e=>{
    e.preventDefault();errorBox.style.display='none';
    const selectedIds=checks.filter(c=>c.cb.checked).map(c=>c.sub.id);
    if(!amountInput.value.trim()&&!feesInput.value.trim()){errorBox.textContent='Enter the amount released to the issuer.';errorBox.style.display='block';return;}
    if(!met&&!ackBox.checked){
      errorBox.textContent=`Only ${money(es.clearedNetDeposits)} has cleared escrow against a ${money(o.target_min_cents)} minimum raise. Tick the acknowledgement to close anyway.`;
      errorBox.style.display='block';return;}
    const asked=dollarsToCents(amountInput.value)||0;
    const askedFees=dollarsToCents(feesInput.value)||0;
    // Fees leave escrow with the release; both together must fit.
    if(asked+askedFees>es.clearedBalance){
      errorBox.textContent=`Only ${money(es.clearedBalance)} has cleared escrow, so ${money(asked)}${askedFees?` plus ${money(askedFees)} in fees`:''} cannot come out of it.`;
      errorBox.style.display='block';return;}
    submitBtn.disabled=true;submitBtn.textContent='Saving…';
    try{
      const res=await api.createClosing(offeringId,{label:labelInput.value,closing_date:dateInput.value||null,
        amount_released:amountInput.value,fees:feesInput.value,investor_sub_ids:selectedIds,
        mark_closed:markClosed.checked,issue_certs:issueCerts.checked,notes:notesInput.value||null});
      const n=res&&res.certsIssued||0;
      toast(n?`Closing recorded — ${n} certificate${n===1?'':'s'} issued.`:'Closing recorded.','success');closeModal();onDone?.();
    }catch(err){errorBox.textContent=err.message;errorBox.style.display='block';submitBtn.disabled=false;submitBtn.textContent='Record closing';}
  }},
    readiness,
    field('Label',labelInput),
    el('div',{class:'form-grid',style:'gap:14px 16px'},
      el('div',{class:'form-row half'},el('label',{},'Closing date'),dateInput),
      el('div',{class:'form-row half'},el('label',{},'Amount released to issuer'),el('div',{class:'money-wrap'},el('span',{class:'money-prefix'},'$'),amountInput)),
      el('div',{class:'form-row half'},el('label',{},'Fees / costs deducted'),el('div',{class:'money-wrap'},el('span',{class:'money-prefix'},'$'),feesInput))),
    field('Investors included in this closing',picklist,'Selected investors are marked Closed and linked to this closing. The release and any fees are recorded in the escrow ledger.'),
    el('label',{class:'pick-row',style:'padding-left:0'},markClosed,el('span',{},'Mark selected investors as “Closed”')),
    el('label',{class:'pick-row',style:'padding-left:0'},issueCerts,el('span',{},'Issue certificates for the included investors'),
      el('span',{class:'field-help'},'Numbered by funding date; capital, % interest and accrued return auto-populate.')),
    field('Notes',notesInput),
    errorBox,
    el('div',{class:'modal-actions'},el('button',{class:'btn btn-ghost',type:'button',onclick:closeModal},'Cancel'),submitBtn));
  openShell('Conduct a closing',form,{wide:true});
  recompute();
  setTimeout(()=>labelInput.focus(),50);
}

function classStructurePanel(offering,classNames){
  const classes=Array.isArray(offering.classes)?offering.classes.map(c=>({...c})):[];
  const open=classes.length>0;
  const body=el('div',{style:open?'':'display:none'});
  const rowsWrap=el('div',{class:'class-rows'});
  function draw(){clear(rowsWrap);
    classes.forEach((c,idx)=>{
      const name=el('input',{class:'inline-input',value:c.name||'',placeholder:'Class name',oninput:e=>c.name=e.target.value});
      const pct=el('input',{class:'inline-input',type:'number',step:'any',style:'width:110px',value:c.total_percent??'',placeholder:'% of co.',oninput:e=>c.total_percent=e.target.value===''?null:Number(e.target.value)});
      const sponsor=el('input',{type:'checkbox',checked:!!c.sponsor,onchange:e=>c.sponsor=e.target.checked});
      rowsWrap.appendChild(el('div',{class:'class-row'},
        name,el('span',{class:'money-prefix',style:'padding:0'},''),pct,el('span',{class:'field-help'},'%'),
        el('label',{class:'form-check',style:'font-size:13px'},sponsor,el('span',{},'Sponsor / non-cash')),
        el('button',{class:'icon-btn danger',title:'Remove',onclick:()=>{classes.splice(idx,1);draw();}},'@icon:trash')));});
    const sum=classes.reduce((a,c)=>a+(Number(c.total_percent)||0),0);
    rowsWrap.appendChild(el('div',{class:'field-help',style:'margin-top:6px'},
      classes.length?`Defined classes total ${fmtRate(sum)} of the company.`:'No classes defined — % interest is pro-rated across all capital.'));
  }
  draw();
  const addRow=el('button',{class:'btn btn-ghost btn-sm',onclick:()=>{classes.push({name:'',total_percent:null,sponsor:false});draw();}},'@icon:plus','Add class');
  const saveBtn=el('button',{class:'btn btn-primary btn-sm',onclick:async()=>{
    await api.saveClasses(offering.id,classes);toast('Class structure saved.','success');refresh();}},'Save class structure');
  const toggle=el('button',{class:'btn btn-ghost btn-sm',onclick:()=>{body.style.display=body.style.display==='none'?'':'none';}},
    open?'Class structure':'Set up class ownership split…');
  return el('section',{class:'panel'},
    el('div',{class:'section-head',style:'margin:0'},el('h2',{style:'font-size:15px'},'Ownership classes (optional)'),toggle),
    body,
    (()=>{body.appendChild(el('p',{class:'field-help',style:'margin:4px 0 12px'},
      'Define classes that each represent a fixed share of the whole company — e.g. Common Units = 20% (held by the sponsor for putting on the offering), Class A Units = 80% (sold to investors). Mark a class “sponsor / non-cash” when it is taken for holding the offering rather than for cash. Leave this empty to pro-rate % interest across all capital.'));
      body.appendChild(rowsWrap);body.appendChild(el('div',{style:'display:flex;gap:8px;margin-top:12px'},addRow,saveBtn));return null;})());
}

function openCertificateForm(offering,investors,classNames,existing,onDone){
  const offeringId=typeof offering==='object'?offering.id:offering;
  const o=typeof offering==='object'?offering:(db.offerings.find(x=>x.id===Number(offeringId))||{});
  const isEdit=!!existing;
  const classOpts=[...new Set([...(o.classes||[]).map(c=>c.name),...(classNames||[])])];
  formModal({title:isEdit?'Edit certificate':'New certificate',wide:true,submitLabel:isEdit?'Save changes':'Add certificate',
    values:existing?{cert_number:existing.cert_number,investor_id:existing.investor_id??'',
      holder_name:existing.holder_name,class_name:existing.class_name,
      capital:centsToInput(existing.capital_cents),pct_of_class:existing.pct_of_class??'',percent_interest:existing.percent_interest??'',

      no_capital:existing.no_capital,notes:existing.notes}

      {name:'cert_number',label:'Certificate #',required:true,half:true,mono:true,help:'The next number in this offering. Change it if you number differently.'},
      {name:'class_name',label:'Class / series',half:true,datalist:classOpts,placeholder:'e.g. Class A Units'},
      {name:'investor_id',label:'Holder',type:'custom',
        build:val=>investorPicker(investors,val,{allowCreate:true,preferred:db.subscriptions.filter(s=>s.offering_id===Number(offeringId)).map(s=>s.investor_id),

      {name:'capital',label:'Capital contributed',type:'money',half:true,showIf:v=>!v.no_capital,help:'Fills from the subscription when you pick a holder.'},
      {name:'pct_of_class',label:'% of class (override)',type:'number',step:'any',half:true,help:'Leave blank to pro-rate within the class by capital.'},

function buildSummaryReport(o,subs,escrowData,reconData,closingsData,certsData){
  const s=o.summary,es=escrowData.summary;
  const cfg=settings();
  const closings=(closingsData&&closingsData.closings)||[];
  const certs=(certsData&&certsData.certificates)||[];
  // Withdrawn subscriptions appear on the roster — the record is the record —
  // but are struck through and count towards nothing.
  const live=subs.filter(x=>x.status!=='Withdrawn');
  const committed=live.reduce((a,x)=>a+(x.amount_committed_cents||0),0);
  const signedCount=live.filter(x=>['Sub signed','Funded','Closed'].includes(effectiveSubStatus(x))).length;
  const asOf=fmtDateLong(todayISO());
  const genDate=new Date().toLocaleString('en-US',{dateStyle:'long',timeStyle:'short'});
  const minMet=o.target_min_cents&&s.minRaiseMet;
  // The account number prints masked unless the firm has said otherwise.
  const acct=o.escrow_account_number
    ? (cfg.mask_account_numbers?fmtTaxId(o.escrow_account_number):o.escrow_account_number):null;

  const closingNodes=o.target_min_cents?[
    reportKV([
      ['Minimum raise (min-raise)',money(o.target_min_cents)],
      ['Subscriber funds cleared (net of refunds)',money(s.escrow.clearedNetDeposits)],
      ['Final close deadline',o.no_deadline?'Open-ended (no deadline)':(o.final_close_date?fmtDateLong(o.final_close_date):'—')],
      ['Amount still needed',minMet?'$0.00':money((o.target_min_cents||0)-s.escrow.clearedNetDeposits)],
    ]),
    el('p',{style:'margin:10px 0 0'},
      el('span',{class:'report-badge '+(minMet?'met':'no')},minMet?'MINIMUM RAISE MET — CLOSING MAY PROCEED':'MINIMUM RAISE NOT YET MET')),
  ]:[el('p',{class:'report-sub'},'No minimum raise is set for this offering.')];

  const showCosts=!!o.pass_through_costs;
  const totalCosts=live.reduce((a,x)=>a+(x.costs_cents||0),0);
  const investorTable=subs.length?el('table',{class:'report-table'},
    el('thead',{},el('tr',{},el('th',{},'Investor'),el('th',{},'Email'),el('th',{},'Accredited'),
      el('th',{class:'num'},'Committed'),showCosts?el('th',{class:'num'},'Costs'):null,showCosts?el('th',{class:'num'},'Total due'):null,
      el('th',{class:'num'},'Units'),el('th',{},'Sub status'),el('th',{},'Signed'))),
    el('tbody',{},...subs.map(x=>{const gone=x.status==='Withdrawn';
      return el('tr',{style:gone?'color:#999':''},
      el('td',{},el('strong',{style:gone?'text-decoration:line-through':''},x.investor_name||'—'),x.entity_type?el('div',{style:'color:#666;font-size:10px'},x.entity_type):null),
      el('td',{},x.email||'—'),el('td',{},x.accredited_status||'—'),
      el('td',{class:'num'},money(x.amount_committed_cents)),
      showCosts?el('td',{class:'num'},x.costs_cents?money(x.costs_cents):'—'):null,
      showCosts?el('td',{class:'num'},money((x.amount_committed_cents||0)+(x.costs_cents||0))):null,
      el('td',{class:'num'},x.units??'—'),
      el('td',{},gone?'Withdrawn':effectiveSubStatus(x)),el('td',{},fmtDate(x.sub_signed_date)));})),
    el('tfoot',{},el('tr',{},el('td',{colspan:'3'},`Total — ${live.length} investor${live.length===1?'':'s'} (${signedCount} signed/funded${subs.length>live.length?`; ${subs.length-live.length} withdrawn excluded`:''})`),
      el('td',{class:'num'},money(committed)),
      showCosts?el('td',{class:'num'},money(totalCosts)):null,
      showCosts?el('td',{class:'num'},money(committed+totalCosts)):null,
      el('td',{colspan:'3'},'')))
  ):el('p',{class:'report-sub'},'No investors recorded on this offering.');

  // Chronological, oldest first, with a running book balance: the order a
  // ledger is read in, and the column that lets its total be checked by eye.
  // Only the four movement types the balances are built from — a row with an
  // unknown type (a hand-edited file) must not appear in a ledger whose stated
  // totals exclude it.
  const txns=escrowData.transactions.filter(t=>['deposit','release','refund','fee'].includes(t.txn_type))
    .slice().sort((a,b)=>
    (a.txn_date||a.created_at||'').localeCompare(b.txn_date||b.created_at||'')||a.id-b.id);
  let running=0;
  const ledgerTable=txns.length?el('table',{class:'report-table'},
    el('thead',{},el('tr',{},el('th',{},'Date'),el('th',{},'Type'),el('th',{},'Investor'),el('th',{},'Method / ref'),
      el('th',{},'Cleared'),el('th',{class:'num'},'Amount'),el('th',{class:'num'},'Balance'))),
    el('tbody',{},...txns.map(t=>{const out=t.txn_type!=='deposit';
      running+=(out?-1:1)*(Number(t.amount_cents)||0);
      return el('tr',{},el('td',{},fmtDate(t.txn_date)),el('td',{},t.txn_type.charAt(0).toUpperCase()+t.txn_type.slice(1)),el('td',{},t.investor_name||'—'),
        el('td',{},[t.method,t.reference].filter(Boolean).join(' · ')||'—'),el('td',{},t.cleared?'Cleared':'Pending'),
        el('td',{class:'num'},(out?'−':'+')+money(t.amount_cents)),
        el('td',{class:'num'},money(running)));})),
    el('tfoot',{},el('tr',{},el('td',{colspan:'6'},'Book balance (all entries)'),el('td',{class:'num'},money(es.bookBalance))),
      el('tr',{},el('td',{colspan:'6'},'Cleared balance (cleared entries only)'),el('td',{class:'num'},money(es.clearedBalance))))
  ):el('p',{class:'report-sub'},'No escrow activity recorded.');

  const latestRecon=reconData.reconciliations[0];

  return el('div',{class:'report'},
    el('div',{class:'report-head'},
      el('div',{},
        el('div',{class:'report-lockup',html:REPORT_MARK+'<span class="rl-name">Muniment</span>'}),
        el('h1',{},o.name),
        el('div',{class:'report-sub'},[o.issuer_name,o.exemption,o.security_type].filter(Boolean).join(' · ')||'—')),

async function printOfferingSummary(offeringId){
  try{
    const[offering,subs,escrowData,reconData,closingsData,certsData]=await Promise.all([
      api.getOffering(offeringId),api.listSubscriptions(offeringId),api.listEscrow(offeringId),
      api.listReconciliations(offeringId),api.listClosings(offeringId),api.listCertificates(offeringId)]);
    const root=document.getElementById('print-root');clear(root);
    root.appendChild(buildSummaryReport(offering,subs,escrowData,reconData,closingsData,certsData));
    let done=false;
    const cleanup=()=>{if(done)return;done=true;clear(root);window.removeEventListener('afterprint',cleanup);};
    window.addEventListener('afterprint',cleanup);
    setTimeout(()=>{window.print();
      // iOS Safari never fires afterprint; clear on a timer so a later plain
      // Ctrl+P cannot print this report again by surprise.
      setTimeout(cleanup,1500);},60);
  }catch(e){toast('Could not build the summary: '+e.message,'error');}
}

function suggestionCard(s,onDone){
  const accept=s.apply?el('button',{class:'btn btn-primary btn-sm',type:'button',onclick:async()=>{
    try{await api.acceptSuggestion(s);toast('Recorded.','success');onDone();}
    catch(e){toast(e.message,'error');}}},'@icon:check','Accept'):null;
  const open=!s.apply&&s.offeringId?el('button',{class:'btn btn-ghost btn-sm',type:'button',
    onclick:()=>navigate(`/offerings/${s.offeringId}`)},'Open'):null;
  const dismiss=el('button',{class:'icon-btn',type:'button','aria-label':'Dismiss this suggestion',
    title:'Dismiss',onclick:async()=>{await api.dismissSuggestion(s);onDone();}},'@icon:close');
  return el('div',{class:'suggest-card'+(s.severity==='warn'?' warn':'')},
    el('span',{class:'suggest-mark'},s.severity==='warn'?'@icon:warning':'@icon:sparkle'),
    el('div',{class:'suggest-body'},
      el('div',{class:'suggest-title'},s.title),
      el('div',{class:'suggest-detail'},s.detail),
      s.evidence?el('span',{class:'suggest-evidence'},s.evidence):null),
    el('div',{class:'suggest-actions'},accept,open,dismiss));
}
// `scope` is an offering id, or null for everything.
function suggestionPanel(scope,onDone,{limit=6,heading='Suggested'}={}){
  const all=computeSuggestions(scope);
  if(!all.length)return null;
  const shown=all.slice(0,limit);
  const applicable=all.filter(s=>s.apply);
  const acceptAll=applicable.length>1?el('button',{class:'btn btn-ghost btn-sm',type:'button',onclick:async()=>{
    const ok=await confirmDialog(`Accept all ${applicable.length} suggestions? Each one writes the change it describes. You can review them afterwards under Settings.`,{confirmLabel:'Accept all'});
    if(!ok)return;
    // Recomputed between applies: an accepted change can retire or reshape
    // the ones after it, and a retired suggestion must not run stale.
    let done=0,failed=0;
    for(const key of applicable.map(s=>s.key)){
      const fresh=computeSuggestions(scope).find(x=>x.key===key&&x.apply);
      if(!fresh)continue;
      try{await fresh.apply();logActivity('accepted',fresh.title,fresh.offeringId,fresh.key);done++;}
      catch{failed++;}
    }
    await persist();
    toast(failed?`${done} recorded; ${failed} could not be applied.`:(done?`${done} change${done===1?'':'s'} recorded.`:'Nothing left to record.'),failed?'error':'success');
    onDone();
  }},`Accept all ${applicable.length}`):null;
  return el('section',{class:'panel suggest-panel'},
    el('div',{class:'suggest-head'},
      el('h2',{class:'panel-title',style:'margin:0;border:none;padding:0'},heading,
        el('span',{class:'muted-text',style:'font-weight:400;letter-spacing:0;text-transform:none;margin-left:8px'},
          `${all.length} thing${all.length===1?'':'s'} the record can already fill in`)),
      acceptAll),
    el('div',{class:'suggest'},...shown.map(s=>suggestionCard(s,onDone))),
    all.length>shown.length?el('p',{class:'field-help',style:'margin:10px 0 0'},
      `${all.length-shown.length} more not shown.`):null);
}

        el('span',{class:'qa-item-title'},'Settings'),
        el('span',{class:'qa-item-desc'},'Firm details, defaults, counterparties, checklist')),
      el('button',{class:'qa-item',type:'button',onclick:()=>{closeModal();importFile();}},
        el('span',{class:'qa-item-title'},'Import a data file'),
        el('span',{class:'qa-item-desc'},'Replace everything held here with a saved copy'))));
  openShell('More',body);
}


/* ============================================================================
   COMMAND PALETTE — Ctrl/Cmd-K. The whole record, one keystroke away.
   ========================================================================== */
let cmdOpen=false;
function paletteIndex(){
  const items=[];
  for(const o of db.offerings)items.push({group:'Offerings',icon:'file',label:o.name,
    sub:[o.issuer_name,o.status].filter(Boolean).join(' · '),
    text:`${o.name} ${o.issuer_name||''}`.toLowerCase(),
    run:()=>navigate(`/offerings/${o.id}`)});
  for(const i of db.investors)items.push({group:'Investors',icon:'file',label:investorListName(i),
    sub:i.entity_type||'',
    text:`${investorDisplayName(i)} ${investorListName(i)} ${i.email||''}`.toLowerCase(),
    run:()=>navigate(`/investors/${i.id}`)});
  items.push(
    {group:'Go to',icon:'chevron',label:'Dashboard',text:'dashboard home',run:()=>navigate('/')},
    {group:'Go to',icon:'chevron',label:'Offerings',text:'offerings deals raises',run:()=>navigate('/offerings')},
    {group:'Go to',icon:'chevron',label:'Investors',text:'investors contacts people',run:()=>navigate('/investors')},
    {group:'Go to',icon:'chevron',label:'Settings',text:'settings firm defaults counterparties checklist',run:()=>navigate('/settings')},
    {group:'Actions',icon:'plus',label:'New record',sub:'Offering, investor, deposit, closing…',
      text:'new record add create quick offering investor subscription escrow deposit closing certificate',run:()=>openQuickAdd()},
    {group:'Actions',icon:'download',label:'Save a copy of your data',text:'save copy backup download export',run:()=>downloadCopy()},
    {group:'Actions',icon:'swap',label:'Switch appearance',sub:'Light / dark',
      text:'theme dark light appearance mode switch',
      run:()=>applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark')});
  for(const o of db.offerings)items.push({group:'Actions',icon:'print',label:`Print summary — ${o.name}`,
    text:`print summary report ${o.name}`.toLowerCase(),run:()=>printOfferingSummary(o.id)});
  return items;
}
function closePalette(){const root=document.getElementById('cmd-root');clear(root);cmdOpen=false;}
function openPalette(){
  if(cmdOpen){closePalette();return;}
  cmdOpen=true;
  const items=paletteIndex();
  let active=0,shown=[];
  const input=el('input',{class:'cmd-input',type:'text',placeholder:'Search records, or type an action…',
    'aria-label':'Search records and actions',autocomplete:'off',spellcheck:'false'});
  const list=el('div',{class:'cmd-list',role:'listbox'});
  const run=item=>{closePalette();item.run();};
  function draw(){
    const q=input.value.trim().toLowerCase();
    // Every term must appear; order does not matter. "river closing" finds
    // "Print summary — Riverfront Partners Fund I".
    const terms=q.split(/\s+/).filter(Boolean);
    shown=(!terms.length?items.slice(0,14)
      :items.filter(x=>terms.every(t=>x.text.includes(t)||x.label.toLowerCase().includes(t))).slice(0,14));
    active=Math.min(active,Math.max(0,shown.length-1));
    clear(list);
    if(!shown.length){list.appendChild(el('div',{class:'cmd-empty'},'Nothing on record matches.'));return;}
    let lastGroup=null;
    shown.forEach((x,idx)=>{
      if(x.group!==lastGroup){lastGroup=x.group;list.appendChild(el('div',{class:'cmd-group'},x.group));}
      list.appendChild(el('button',{class:'cmd-item'+(idx===active?' active':''),type:'button',role:'option',
        'aria-selected':idx===active?'true':'false',
        onmousedown:e=>{e.preventDefault();run(x);},
        onmousemove:()=>{if(active!==idx){active=idx;draw();}}},
        el('span',{class:'ic'},'@icon:'+x.icon),
        el('span',{},x.label),
        x.sub?el('span',{class:'cmd-item-sub'},x.sub):null));
    });
    const el_=list.querySelector('.cmd-item.active');
    if(el_)el_.scrollIntoView({block:'nearest'});
  }
  input.addEventListener('input',()=>{active=0;draw();});
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();active=Math.min(active+1,shown.length-1);draw();}
    else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0);draw();}
    else if(e.key==='Enter'){e.preventDefault();if(shown[active])run(shown[active]);}
    else if(e.key==='Escape'){e.stopPropagation();closePalette();}
  });
  const root=document.getElementById('cmd-root');
  root.appendChild(el('div',{class:'cmd-backdrop',onclick:e=>{if(e.target===e.currentTarget)closePalette();}},
    el('div',{class:'cmd',role:'dialog','aria-modal':'true','aria-label':'Search and commands'},
      input,list,
      el('div',{class:'cmd-foot'},
        el('span',{},el('kbd',{},'↑'),' ',el('kbd',{},'↓'),' choose'),
        el('span',{},el('kbd',{},'Enter'),' open'),
        el('span',{},el('kbd',{},'Esc'),' close')))));
  draw();
  input.focus();
}
// The shortcut map. Nothing fires while a field, a dialog or the palette has
// the keyboard.
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){
    // Not over an open dialog: a form half filled in owns the keyboard, and
    // one Escape would otherwise close the palette and the form together.
    if(escHandler)return;
    e.preventDefault();openPalette();return;}
  if(cmdOpen||escHandler)return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable))return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const keys={'/':()=>openPalette(),n:()=>openQuickAdd(),
    g:null, d:()=>navigate('/'),o:()=>navigate('/offerings'),i:()=>navigate('/investors'),s:()=>navigate('/settings')};
  const fn=keys[e.key.toLowerCase()];
  if(fn){e.preventDefault();fn();}
});

/* ============================================================================
   ROUTER
   ========================================================================== */
const viewEl=document.getElementById('view');
const routes=[
  [/^\/?(?:\?.*)?$/,()=>renderDashboard(),'dashboard'],
  [/^\/offerings\/(\d+)(?:\?.*)?$/,m=>renderOffering(m[1]),'offerings'],
  [/^\/offerings(?:\?.*)?$/,()=>renderOfferings(),'offerings'],
  [/^\/investors\/(\d+)(?:\?.*)?$/,m=>renderInvestor(m[1]),'investors'],
  [/^\/investors(?:\?.*)?$/,()=>renderInvestors(),'investors'],
  [/^\/settings(?:\?.*)?$/,()=>renderSettings(),'settings'],
];
// What the app bar should say for a route, worked out from the record rather
// than from the URL, so a detail page names the thing you are looking at.
function routeTitle(navKey,hash){
  let m=hash.match(/^\/offerings\/(\d+)/);
  if(m){const o=db.offerings.find(x=>x.id===Number(m[1]));if(o)return o.name;}
  m=hash.match(/^\/investors\/(\d+)/);
  if(m){const i=db.investors.find(x=>x.id===Number(m[1]));if(i)return investorDisplayName(i);}
  return{dashboard:'Dashboard',offerings:'Offerings',investors:'Investors',settings:'Settings'}[navKey]||'Muniment';
}
async function router(){
  const hash=location.hash.replace(/^#/,'')||'/';
  const match=routes.find(([re])=>re.test(hash));
  const navKey=match?match[2]:'dashboard';
  // [data-nav] rather than `.nav a`: the sidebar and the bottom tab bar carry
  // the same keys, and one line lights whichever of them is on screen.
  document.querySelectorAll('[data-nav]').forEach(a=>{
    const on=a.dataset.nav===navKey;
    a.classList.toggle('active',on);
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});
  const bar=document.getElementById('app-bar-title');
  if(bar)bar.textContent=routeTitle(navKey,hash);
  document.title=(navKey==='dashboard'?'Muniment':routeTitle(navKey,hash)+' · Muniment');
  clear(viewEl);viewEl.appendChild(skeleton());
  try{
    // match[0] is the regex, match[1] the handler, match[2] the nav key.
    const node=match?await match[1](hash.match(match[0])):notFound();
    clear(viewEl);viewEl.appendChild(node);
    // The page scrolls, not the view element — resetting viewEl.scrollTop was
    // a no-op and every navigation landed you mid-page.
    window.scrollTo(0,0);
  }catch(err){clear(viewEl);viewEl.appendChild(el('div',{class:'error-state'},
    el('h2',{},'This page could not be built'),el('p',{},err.message),
    el('button',{class:'btn btn-ghost',onclick:()=>router()},'Try again')));}
}
function notFound(){return el('div',{class:'error-state'},el('h2',{},'Page not found'),el('a',{class:'btn btn-primary',onclick:()=>location.hash='#/'},'Back to dashboard'));}
function navigate(path){if(location.hash==='#'+path)router();else location.hash=path;}
function refresh(){router();}
window.addEventListener('hashchange',router);

const SUN='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-9.5a.7.7 0 0 1 .7.7v1a.7.7 0 0 1-1.4 0v-1a.7.7 0 0 1 .7-.7Zm0 11.6a.7.7 0 0 1 .7.7v1a.7.7 0 0 1-1.4 0v-1a.7.7 0 0 1 .7-.7ZM1.5 8a.7.7 0 0 1 .7-.7h1a.7.7 0 0 1 0 1.4h-1A.7.7 0 0 1 1.5 8Zm11.3 0a.7.7 0 0 1 .7-.7h1a.7.7 0 0 1 0 1.4h-1a.7.7 0 0 1-.7-.7ZM3.3 3.3a.7.7 0 0 1 1 0l.7.7a.7.7 0 1 1-1 1l-.7-.7a.7.7 0 0 1 0-1Zm7.7 7.7a.7.7 0 0 1 1 0l.7.7a.7.7 0 0 1-1 1l-.7-.7a.7.7 0 0 1 0-1Zm1.7-7.7a.7.7 0 0 1 0 1l-.7.7a.7.7 0 1 1-1-1l.7-.7a.7.7 0 0 1 1 0ZM5 11a.7.7 0 0 1 0 1l-.7.7a.7.7 0 0 1-1-1l.7-.7a.7.7 0 0 1 1 0Z"/></svg>';
const MOON='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a.6.6 0 0 0-.83-.7A6.9 6.9 0 1 0 14.1 10.4a.6.6 0 0 0-.7-.83Z"/></svg>';
function applyTheme(t){
  const theme=t==='dark'?'dark':'light';
  document.documentElement.setAttribute('data-theme',theme);
  try{localStorage.setItem(THEME_KEY,theme);}catch{}
  const b=document.getElementById('theme-toggle');
  if(b){
    b.innerHTML=(theme==='dark'?MOON:SUN)+'<span>'+(theme==='dark'?'Dark':'Light')+'</span>';
    b.setAttribute('aria-pressed',theme==='dark'?'true':'false');
    b.title=theme==='dark'?'Switch to light':'Switch to dark';
  }
}
function initTheme(){
  let t='light';
  try{t=localStorage.getItem(THEME_KEY)||'light';}catch{}
  applyTheme(t);
  const b=document.getElementById('theme-toggle');
  if(b)b.addEventListener('click',()=>applyTheme(
    document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
}

/* ============================================================================
   BOOT
   ========================================================================== */
async function boot(){
  initTheme();
  // Load the browser mirror, falling back to data saved under any previous app name.
  let raw=localStorage.getItem(LS_KEY);
  if(!raw){for(const k of LS_KEYS_OLD){const old=localStorage.getItem(k);if(old){raw=old;break;}}}
  if(raw){
    try{db=parseDB(raw);}
    catch(e){
      // Never overwrite data we failed to read. The unreadable copy is set
      // aside under its own key and saving is held until the user decides.
      const stash=`muniment:unreadable:${Date.now()}`;
      try{localStorage.setItem(stash,raw);}catch{}
      db=EMPTY();readOnly=true;
      setTimeout(()=>toast(`The saved data in this browser could not be read, so nothing has been loaded and nothing will be saved over it. A copy is held under ${stash}.`,'error'),400);
    }
  }
  // Try to remember a previously connected file (needs a click to re-grant).
  if(FSA){try{const h=await idbGet('fileHandle');if(h)pendingHandle=h;}catch{}}
  renderFileStatus();
  const addBtn=document.getElementById('global-add');if(addBtn)addBtn.addEventListener('click',openQuickAdd);
  // The phone chrome: centre add, More sheet, and the search button share the
  // same machinery the desktop reaches by keyboard.
  const bottomAdd=document.getElementById('bottom-add');if(bottomAdd)bottomAdd.addEventListener('click',openQuickAdd);
  const bottomMore=document.getElementById('bottom-more');if(bottomMore)bottomMore.addEventListener('click',openMoreSheet);
  const appMore=document.getElementById('app-more');if(appMore)appMore.addEventListener('click',openMoreSheet);
  const appSearch=document.getElementById('app-search');if(appSearch)appSearch.addEventListener('click',openPalette);
  router();
}
boot();
