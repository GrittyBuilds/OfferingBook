  /* ---- Distributions ------------------------------------------------------
     Money paid out to holders after a closing. Nothing here touches escrow:
     escrow is where money sits before a closing, and this is all after one. */
  async listDistributions(offeringId){offeringId=Number(offeringId);
    const rows=db.distributions.filter(d=>d.offering_id===offeringId)
      .sort((a,b)=>String(b.pay_date||'').localeCompare(String(a.pay_date||''))||b.id-a.id);
    const total=rows.reduce((a,d)=>a+(d.amount_cents||0),0);
    const pref=rows.reduce((a,d)=>a+(d.allocations||[]).reduce((n,x)=>n+(x.pref_cents||0),0),0);
    const capital=rows.reduce((a,d)=>a+(d.allocations||[]).reduce((n,x)=>n+(x.capital_cents||0),0),0);
    return{distributions:rows.map(d=>({...d,
      allocations:(d.allocations||[]).map(a=>{
        const c=db.certificates.find(x=>x.id===a.certificate_id);
        const i=db.investors.find(x=>x.id===a.investor_id);
        return{...a,cert_number:c?c.cert_number:null,
          holder:i?investorDisplayName(i):(c&&c.holder_name)||'—'};})})),
      total,pref,capital};},
  async createDistribution(offeringId,b){offeringId=Number(offeringId);
    if(!db.offerings.find(x=>x.id===offeringId))throw new Error('Offering not found');
    const amount=Math.abs(dollarsToCents(b.amount)||0);
    if(!amount)throw new Error('Enter the amount being distributed.');
    const allocations=(Array.isArray(b.allocations)?b.allocations:[])
      .map(a=>({certificate_id:Number(a.certificate_id),investor_id:a.investor_id==null?null:Number(a.investor_id),
        pref_cents:Math.max(0,Number(a.pref_cents)||0),capital_cents:Math.max(0,Number(a.capital_cents)||0)}))
      .filter(a=>a.pref_cents||a.capital_cents);
    const allocated=allocations.reduce((n,a)=>n+a.pref_cents+a.capital_cents,0);
    // A distribution whose parts do not come to the cheque is a distribution
    // somebody has to explain. Refuse it rather than record it.
    if(allocated!==amount)
      throw new Error(`The allocations come to ${money(allocated)} against ${money(amount)} distributed. They must agree before this can be recorded.`);
    const row={id:nextId('distributions'),offering_id:offeringId,
      label:str(b.label)||`Distribution ${db.distributions.filter(d=>d.offering_id===offeringId).length+1}`,
      pay_date:str(b.pay_date)||todayISO(),amount_cents:amount,basis:str(b.basis)||'pref-first',
      method:str(b.method),reference:str(b.reference),notes:str(b.notes),
      allocations,created_at:nowISO()};
    db.distributions.push(row);await persist();return row;},
  async deleteDistribution(id){id=Number(id);
    db.distributions=db.distributions.filter(d=>d.id!==id);await persist();return{ok:true};},
  proposeDistribution(offeringId,amountCents,basis,asOf){
    return proposeDistribution(Number(offeringId),amountCents,basis,asOf);},

  /* ---- Transfers and redemptions ------------------------------------------
     The chain of title. A certificate is never rewritten in place: it is
     cancelled, and a successor is issued pointing back at it. */
  async listTransfers(offeringId){offeringId=Number(offeringId);
    return db.transfers.filter(t=>t.offering_id===offeringId)
      .sort((a,b)=>String(b.transfer_date||'').localeCompare(String(a.transfer_date||''))||b.id-a.id)
      .map(t=>{
        const from=db.certificates.find(c=>c.id===t.from_certificate_id);
        const to=db.certificates.find(c=>c.id===t.to_certificate_id);
        const holder=c=>{if(!c)return null;const i=db.investors.find(x=>x.id===c.investor_id);
          return i?investorDisplayName(i):(c.holder_name||'—');};
        return{...t,from_number:from?from.cert_number:null,to_number:to?to.cert_number:null,
          from_holder:holder(from),to_holder:holder(to)};});},
  async createTransfer(offeringId,b){offeringId=Number(offeringId);
    const o=db.offerings.find(x=>x.id===offeringId);
    if(!o)throw new Error('Offering not found');
    const from=db.certificates.find(c=>c.id===Number(b.from_certificate_id)&&c.offering_id===offeringId);
    if(!from)throw new Error('Pick the certificate being transferred.');
    if(from.cancelled_date)throw new Error(`Certificate ${from.cert_number} has already been transferred or redeemed.`);
    const kind=b.kind==='redemption'?'redemption':'transfer';
    const date=str(b.transfer_date)||todayISO();
    const whole=b.whole!==false;
    const capital=from.capital_cents||0;
    const moving=whole?capital:Math.min(capital,Math.abs(dollarsToCents(b.capital)||0));
    if(!whole&&!moving)throw new Error('Enter how much capital is moving.');
    if(kind==='transfer'&&!b.to_investor_id&&!str(b.to_holder_name))
      throw new Error('Say who it is transferring to.');
    const transfer={id:nextId('transfers'),offering_id:offeringId,kind,
      from_certificate_id:from.id,to_certificate_id:null,
      to_investor_id:numOr(b.to_investor_id),to_holder_name:str(b.to_holder_name),
      transfer_date:date,capital_cents:moving,whole:whole?1:0,
      consideration_cents:dollarsToCents(b.consideration),
      notes:str(b.notes),created_at:nowISO()};

    if(whole){
      // The whole holding moves: the certificate is cancelled outright.
      from.cancelled_date=date;
      from.cancelled_by_transfer_id=transfer.id;
    }else{
      // Part of it moves: what is left stays on the original certificate.
      from.capital_cents=capital-moving;
    }
    if(kind==='transfer'){
      const maxSort=db.certificates.filter(c=>c.offering_id===offeringId)
        .reduce((m,c)=>Math.max(m,c.sort_index||0),0);
      const successor={id:nextId('certificates'),offering_id:offeringId,
        subscription_id:from.subscription_id??null,closing_id:from.closing_id??null,
        investor_id:numOr(b.to_investor_id),holder_name:str(b.to_holder_name),
        class_name:from.class_name,capital_cents:moving,
        pct_of_class:null,percent_interest:null,
        pref_return_rate:from.pref_return_rate,accrued_cents:null,
        // The successor takes the transferor's accrual start and convention:
        // a transfer moves a holding, it does not restart one.
        accrual_convention:from.accrual_convention||null,
        accrual_start:from.accrual_start||from.issue_date||null,
        funded_date:from.funded_date||null,
        issue_date:date,issued_by_transfer_date:date,
        cert_number:nextCertNumber(offeringId),sort_index:maxSort+1,
        no_capital:from.no_capital?1:0,
        transferred_from_certificate_id:from.id,
        notes:`Issued on the ${whole?'transfer':'part transfer'} of certificate ${from.cert_number}.`,
        created_at:nowISO()};
      db.certificates.push(successor);
      transfer.to_certificate_id=successor.id;
    }
    db.transfers.push(transfer);await persist();return transfer;},
  async deleteTransfer(id){id=Number(id);
    const t=db.transfers.find(x=>x.id===id);
    if(!t)throw new Error('Transfer not found');
    const from=db.certificates.find(c=>c.id===t.from_certificate_id);
    if(from){
      if(t.whole){from.cancelled_date=null;from.cancelled_by_transfer_id=null;}
      // A part transfer took capital off the original; give it back.
      else from.capital_cents=(from.capital_cents||0)+(t.capital_cents||0);
    }
    if(t.to_certificate_id)db.certificates=db.certificates.filter(c=>c.id!==t.to_certificate_id);
    db.transfers=db.transfers.filter(x=>x.id!==id);
    await persist();return{ok:true};},

  /* ---- Capital calls ------------------------------------------------------ */
  async listCapitalCalls(offeringId){offeringId=Number(offeringId);
    const calls=db.capital_calls.filter(c=>c.offering_id===offeringId)
      .sort((a,b)=>String(a.call_date||'').localeCompare(String(b.call_date||''))||a.id-b.id);
    return{calls:calls.map(c=>({...c,
      called:(c.allocations||[]).reduce((a,x)=>a+(x.amount_cents||0),0),
      allocations:(c.allocations||[]).map(a=>{
        const i=db.investors.find(x=>x.id===a.investor_id);
        return{...a,holder:i?investorDisplayName(i):'—'};})})),
      committed:db.subscriptions.filter(s=>s.offering_id===offeringId&&s.status!=='Withdrawn')
        .reduce((a,s)=>a+(s.amount_committed_cents||0),0)};},
  proposeCall(offeringId,percent){return proposeCall(offeringId,percent);},
  async createCapitalCall(offeringId,b){offeringId=Number(offeringId);
    if(!db.offerings.find(x=>x.id===offeringId))throw new Error('Offering not found');
    const allocations=(Array.isArray(b.allocations)?b.allocations:[])
      .map(a=>({subscription_id:Number(a.subscription_id),investor_id:a.investor_id==null?null:Number(a.investor_id),
        amount_cents:Math.max(0,Number(a.amount_cents)||0)}))
      .filter(a=>a.amount_cents);
    if(!allocations.length)throw new Error('This call asks nobody for anything.');
    const row={id:nextId('capital_calls'),offering_id:offeringId,
      label:str(b.label)||`Call ${db.capital_calls.filter(c=>c.offering_id===offeringId).length+1}`,
      call_date:str(b.call_date)||todayISO(),due_date:str(b.due_date),
      percent:numOr(b.percent),notes:str(b.notes),allocations,created_at:nowISO()};
    db.capital_calls.push(row);await persist();return row;},
  async deleteCapitalCall(id){id=Number(id);
    db.capital_calls=db.capital_calls.filter(c=>c.id!==id);await persist();return{ok:true};},

  /* ---- The offering that did not reach its minimum ------------------------
     Both facts needed for the escrow break were already tracked. What came
     next was a long stretch of manual ledger entry, undertaken at the one
     moment when everybody involved is under pressure and least able to check
     the arithmetic. This proposes the whole reversal, itemised, and writes
     nothing until it is accepted. */
  proposeBreak(offeringId){
    offeringId=Number(offeringId);
    const o=db.offerings.find(x=>x.id===offeringId);
    if(!o)throw new Error('Offering not found');
    const s=offeringSummary(o);
    const subs=db.subscriptions.filter(x=>x.offering_id===offeringId&&x.status!=='Withdrawn');
    const refunds=[];
    for(const sub of subs){
      const e=investorEscrow(offeringId,sub.investor_id,sub.id);
      const held=e.clearedNet;
      if(held>0){const inv=db.investors.find(i=>i.id===sub.investor_id);
        refunds.push({subscription_id:sub.id,investor_id:sub.investor_id,
          holder:inv?investorDisplayName(inv):'—',amount_cents:held});}
    }
    return{offering:o,
      minRaise:o.target_min_cents,cleared:s.escrow.clearedNetDeposits,
      minRaiseMet:s.minRaiseMet,deadline:o.final_close_date,
      daysPastDeadline:o.final_close_date?-daysUntil(o.final_close_date):null,
      refunds,
      totalRefund:refunds.reduce((a,r)=>a+r.amount_cents,0),
      subscriptions:subs.length,
      // Closings already held mean money has left escrow to the issuer. That
      // is not a break, and this is not the tool for it.
      closingsHeld:db.closings.filter(c=>c.offering_id===offeringId).length};},
  async breakOffering(offeringId,b){offeringId=Number(offeringId);
    const o=db.offerings.find(x=>x.id===offeringId);
    if(!o)throw new Error('Offering not found');
    const plan=api.proposeBreak(offeringId);
    if(plan.closingsHeld)throw new Error('This offering has already held a closing, so funds have left escrow. Undo the closing first if it should not stand.');
    const date=str(b&&b.refund_date)||todayISO();
    for(const r of plan.refunds){
      db.escrow.push({id:nextId('escrow'),offering_id:offeringId,investor_id:r.investor_id,
        subscription_id:r.subscription_id,txn_type:'refund',amount_cents:r.amount_cents,
        txn_date:date,method:null,reference:str(b&&b.reference)||null,cleared:1,
        notes:'Refunded — the minimum raise was not met.',source:'break',created_at:nowISO()});
      const sub=db.subscriptions.find(x=>x.id===r.subscription_id);
      if(sub){sub.status='Withdrawn';sub.updated_at=nowISO();}
    }
    // Subscribers who never funded are withdrawn too: the offering is over.
    for(const sub of db.subscriptions.filter(x=>x.offering_id===offeringId&&x.status!=='Withdrawn')){
      sub.status='Withdrawn';sub.updated_at=nowISO();
    }
    o.status='Terminated';o.updated_at=nowISO();
    await persist();
    return{refunded:plan.refunds.length,total:plan.totalRefund};},

  /* ---- Filings ------------------------------------------------------------
     Form D's position is computed rather than stored; the state notices are
     rows, because each one has its own date, fee and confirmation number. */
  async listFilings(offeringId){offeringId=Number(offeringId);
    const o=db.offerings.find(x=>x.id===offeringId);
    if(!o)throw new Error('Offering not found');
    const play=statesInPlay(offeringId);
    const rows=stateFilings(offeringId).map(f=>({...f,
      holders:(play.get(f.state)||[]).map(x=>x.investor?investorDisplayName(x.investor):'—'),
      // A row for a state nobody is in any more is not wrong, but it is worth
      // saying so rather than leaving it looking outstanding.
      inPlay:play.has(f.state)}));
    const known=new Set(rows.map(r=>r.state));
    return{formD:formDPosition(o),
      states:rows,
      // States the roster puts in play that have no row at all.
      missing:[...play.keys()].filter(c=>!known.has(c)).sort()
        .map(c=>({state:c,holders:(play.get(c)||[]).map(x=>x.investor?investorDisplayName(x.investor):'—')})),
      // Subscribers with no state recorded, who could be hiding a filing.
      unplaced:db.subscriptions.filter(s=>s.offering_id===offeringId&&s.status!=='Withdrawn')
        .map(s=>db.investors.find(i=>i.id===s.investor_id)).filter(i=>i&&!investorState(i))
        .map(i=>investorDisplayName(i))};},
  async saveStateFiling(offeringId,b,id){offeringId=Number(offeringId);
    const state=(str(b.state)||'').toUpperCase();
    if(!US_STATES.includes(state))throw new Error('Pick a state.');
    const row={state,filed_date:str(b.filed_date),fee_cents:dollarsToCents(b.fee),
      confirmation:str(b.confirmation),notes:str(b.notes)};
    if(id){const f=db.state_filings.find(x=>x.id===Number(id));
      if(!f)throw new Error('Filing not found');
      // One row per state per offering, or the outstanding list double-counts.
      if(db.state_filings.some(x=>x.offering_id===offeringId&&x.state===state&&x.id!==Number(id)))
        throw new Error(`${stateName(state)} already has a row on this offering.`);
      Object.assign(f,row);await persist();return f;}
    if(db.state_filings.some(x=>x.offering_id===offeringId&&x.state===state))
      throw new Error(`${stateName(state)} already has a row on this offering.`);
    const f={id:nextId('state_filings'),offering_id:offeringId,...row,created_at:nowISO()};
    db.state_filings.push(f);await persist();return f;},
  async deleteStateFiling(id){id=Number(id);
    db.state_filings=db.state_filings.filter(f=>f.id!==id);await persist();return{ok:true};},

  /* ---- Party directory -------------------------------------------------- */
  // Issuers, escrow agents, counsel. Entered once; picked everywhere after.
  async listParties(role){return role?partiesByRole(role):db.parties.slice().sort((a,b)=>
    String(a.role||'').localeCompare(String(b.role||''))||String(a.name||'').localeCompare(String(b.name||'')));},
  async saveParty(b,id){
    const row=partyFromBody(b);
    if(!row.name)throw new Error('A name is required.');
    if(id){const e=partyById(id);if(!e)throw new Error('Party not found');
      Object.assign(e,row,{updated_at:nowISO()});await persist();return e;}
    const e={id:nextId('parties'),...row,created_at:nowISO(),updated_at:nowISO()};
    db.parties.push(e);await persist();return e;},
  async deleteParty(id){id=Number(id);
    const used=db.offerings.filter(o=>o.issuer_party_id===id||o.escrow_party_id===id);
    if(used.length)throw new Error(`${used.length} offering${used.length===1?' still refers':'s still refer'} to this party. Change ${used.length===1?'it':'them'} first.`);
    db.parties=db.parties.filter(x=>x.id!==id);await persist();return{ok:true};},

  /* ---- Suggestions ------------------------------------------------------ */
  // Reading is free of side effects; only accept() writes, and only when
  // somebody presses the button.
  async listSuggestions(offeringId){return computeSuggestions(offeringId);},
  async acceptSuggestion(s){
    if(!s||typeof s.apply!=='function')throw new Error('This one has nothing to apply — it needs a decision from you.');
    await s.apply();
    logActivity('accepted',s.title,s.offeringId,s.key);
    await persist();return{ok:true};},
  async dismissSuggestion(s){
    if(!db.dismissed)db.dismissed={};
    db.dismissed[s.key]=nowISO();
    logActivity('dismissed',s.title,s.offeringId,s.key);
    await persist();return{ok:true};},
  async restoreDismissed(){db.dismissed={};await persist();return{ok:true};},
  async listActivity(offeringId,limit=40){
    const rows=db.activity.filter(a=>offeringId==null||a.offering_id===Number(offeringId));
    return rows.slice(-limit).reverse();},

  /* Passphrase protection. Setting one re-seals everything the app writes from
     the next save onward; the copies already on disk stay as they were until
     they are overwritten, which is why the UI says to save a fresh copy. */
  async setPassphrase(passphrase){
    if(!ENC_AVAILABLE)throw new Error('This browser does not offer the cryptography this needs.');
    if(!passphrase||passphrase.length<8)throw new Error('Use at least eight characters. This is the only thing standing between the file and whoever holds it.');
    const salt=crypto.getRandomValues(new Uint8Array(16));
    cryptoKey=await deriveKey(passphrase,salt,ENC_ITERATIONS);
    cryptoSalt=salt;cryptoIterations=ENC_ITERATIONS;
    logActivity('changed','Protected this data with a passphrase',null);
    await persist();return{ok:true};},
  async clearPassphrase(){
    cryptoKey=null;cryptoSalt=null;
    logActivity('changed','Removed the passphrase from this data',null);
    await persist();return{ok:true};},
  isProtected(){return isProtected();},

  /* Generations — the states this document passed through before the current
     one. Held in this browser, so not a backup; but the state before a wrong
     edit is exactly what a single-copy file cannot otherwise give back. */
  async listGenerations(){return ((await idbGet('generations'))||[]).slice().reverse();},
  async restoreGeneration(at){
    const text=await idbGet('gen:'+at);
    if(!text)throw new Error('That version is no longer held.');
    // Generations are held exactly as they were written, so a protected
    // document's earlier states are protected too and need unlocking.
    const parsed=await readDocument(text,'That saved version');
    // Restoring is itself an act worth being able to take back.
    captureUndo(`restoring the version saved at ${fmtDateTime(at)}`);
    const rev=Number(db.meta.rev)||0;
    adoptDocument(parsed);
    db.meta.rev=rev;
    logActivity('restored',`Restored the version saved at ${fmtDateTime(at)}`,null);
    await persist();return{ok:true};},
};

/* ============================================================================
   THE TRAIL — what changed, when, and what put it there.

   The trail used to record only what the app proposed and you accepted, which
   answers the easy half of the question. The hard half — "when did this figure
   change, and to what" — needs every edit and every deletion in it too.

   Every write goes through the API, so it is taken here rather than at forty
   call sites: one table, read alongside the methods it describes, instead of a
   logging line to forget inside each of them.
   ========================================================================== */
const oNameOf=id=>{const o=db.offerings.find(x=>x.id===Number(id));return o?o.name:'an offering';};
const iNameOf=id=>{const i=db.investors.find(x=>x.id===Number(id));return i?investorDisplayName(i):'an investor';};
const subWho=id=>{const s=db.subscriptions.find(x=>x.id===Number(id));return s?iNameOf(s.investor_id):'a subscriber';};
const subOff=id=>{const s=db.subscriptions.find(x=>x.id===Number(id));return s?s.offering_id:null;};

// name → (args) => [summary, offeringId] | null
// Evaluated BEFORE the call, while the record still holds what is about to be
// removed. Creations name themselves from the body they were handed.
const AUDIT={
  createOffering:b=>[`Created the offering “${str(b.name)||'untitled'}”`,null],
  updateOffering:(id,b)=>[`Edited the offering “${str(b.name)||oNameOf(id)}”`,Number(id)],
  deleteOffering:id=>[`Deleted the offering “${oNameOf(id)}” and everything recorded on it`,null],
  saveTranche:(offId,b,tid)=>[`${tid?'Edited':'Added'} the tranche “${str(b.name)||''}”`,Number(offId)],
  deleteTranche:(offId,tid)=>[`Deleted a tranche from “${oNameOf(offId)}”`,Number(offId)],
  saveClasses:(offId)=>[`Changed the ownership classes on “${oNameOf(offId)}”`,Number(offId)],

  createInvestor:b=>[`Added ${str(b.name)||[str(b.first_name),str(b.last_name)].filter(Boolean).join(' ')||'a contact'} to the contact book`,null],
  updateInvestor:id=>[`Edited the contact ${iNameOf(id)}`,null],
  deleteInvestor:id=>[`Deleted the contact ${iNameOf(id)}`,null],

  createSubscription:(offId,b)=>[`Added ${iNameOf(b.investor_id)} to “${oNameOf(offId)}”`,Number(offId)],
  updateSubscription:id=>[`Edited ${subWho(id)}'s subscription`,subOff(id)],
  deleteSubscription:id=>[`Removed ${subWho(id)} from the offering`,subOff(id)],

  createEscrow:(offId,b)=>[`Recorded a ${str(b.txn_type)||'escrow'} entry of ${money(dollarsToCents(b.amount))}`,Number(offId)],
  updateEscrow:id=>{const e=db.escrow.find(x=>x.id===Number(id));
    return[`Edited an escrow entry${e?` of ${money(e.amount_cents)}`:''}`,e?e.offering_id:null];},
  deleteEscrow:id=>{const e=db.escrow.find(x=>x.id===Number(id));
    return[`Deleted an escrow entry${e?` of ${money(e.amount_cents)}`:''}`,e?e.offering_id:null];},

  createTask:(offId,b)=>[`Added the checklist step “${str(b.label)||''}”`,Number(offId)],
  updateTask:(id,b)=>{const t=db.tasks.find(x=>x.id===Number(id));
    // Ticking a box is the commonest write in the app; say which way it went.
    const verb=b&&'done'in b?(b.done?'Completed':'Reopened'):'Edited';
    return[`${verb} the checklist step “${t?t.label:''}”`,t?t.offering_id:null];},
  deleteTask:id=>{const t=db.tasks.find(x=>x.id===Number(id));
    return[`Deleted the checklist step “${t?t.label:''}”`,t?t.offering_id:null];},

  createReconciliation:(offId,b)=>[`Reconciled “${oNameOf(offId)}” to a statement of ${money(dollarsToCents(b.statement_balance))}`,Number(offId)],
  deleteReconciliation:id=>{const r=db.reconciliations.find(x=>x.id===Number(id));
    return[`Deleted a reconciliation`,r?r.offering_id:null];},

  createClosing:(offId,b)=>[`Held a closing on “${oNameOf(offId)}”, releasing ${money(dollarsToCents(b.amount_released))}`,Number(offId)],
  deleteClosing:id=>{const c=db.closings.find(x=>x.id===Number(id));
    return[`Undid the closing “${c?c.label:''}” — its release, its certificates and its closed subscriptions`,c?c.offering_id:null];},

  createCertificate:(offId,b)=>[`Issued certificate ${str(b.cert_number)||''}`,Number(offId)],
  updateCertificate:id=>{const c=db.certificates.find(x=>x.id===Number(id));
    return[`Edited certificate ${c?c.cert_number:''}`,c?c.offering_id:null];},
  deleteCertificate:id=>{const c=db.certificates.find(x=>x.id===Number(id));
    return[`Deleted certificate ${c?c.cert_number:''}`,c?c.offering_id:null];},
  renumberCertificates:offId=>[`Renumbered the certificates on “${oNameOf(offId)}”`,Number(offId)],
  breakOffering:offId=>{const p=api.proposeBreak(offId);
    return[`Broke escrow on “${oNameOf(offId)}” — ${p.refunds.length} refund${p.refunds.length===1?'':'s'} totalling ${money(p.totalRefund)}, every subscription withdrawn, the offering terminated`,Number(offId)];},

  createDistribution:(offId,b)=>[`Recorded a distribution of ${money(dollarsToCents(b.amount))} on “${oNameOf(offId)}”`,Number(offId)],
  deleteDistribution:id=>{const d=db.distributions.find(x=>x.id===Number(id));
    return[`Deleted the distribution “${d?d.label:''}”`,d?d.offering_id:null];},
  createTransfer:(offId,b)=>{const c=db.certificates.find(x=>x.id===Number(b.from_certificate_id));
    return[`${b.kind==='redemption'?'Redeemed':'Transferred'} certificate ${c?c.cert_number:''}`,Number(offId)];},
  deleteTransfer:id=>{const t=db.transfers.find(x=>x.id===Number(id));
    const c=t&&db.certificates.find(x=>x.id===t.from_certificate_id);
    return[`Undid the ${t&&t.kind==='redemption'?'redemption':'transfer'} of certificate ${c?c.cert_number:''}`,t?t.offering_id:null];},
  createCapitalCall:(offId,b)=>[`Issued a capital call on “${oNameOf(offId)}”`,Number(offId)],
  deleteCapitalCall:id=>{const c=db.capital_calls.find(x=>x.id===Number(id));
    return[`Deleted the capital call “${c?c.label:''}”`,c?c.offering_id:null];},

  saveStateFiling:(offId,b,id)=>[`${id?'Edited':'Recorded'} the ${stateName((str(b.state)||'').toUpperCase())} notice filing`,Number(offId)],
  deleteStateFiling:id=>{const f=db.state_filings.find(x=>x.id===Number(id));
    return[`Deleted the ${f?stateName(f.state):''} notice filing`,f?f.offering_id:null];},

  saveSettings:()=>[`Changed the firm settings`,null],
  saveParty:(b,id)=>[`${id?'Edited':'Added'} ${str(b.name)||'a counterparty'} in the directory`,null],
  deleteParty:id=>{const p=db.parties.find(x=>x.id===Number(id));
    return[`Removed ${p?p.name:'a counterparty'} from the directory`,null];},
};
// acceptSuggestion / dismissSuggestion write their own, richer entries; the
// rest are reads. Named so the wrapper's completeness check stays honest.
// breakOffering reverses a whole offering; it is wrapped by name rather than
// by prefix, since "break" is not one of the verbs the loop looks for.
const AUDIT_EXTRA=new Set(['breakOffering']);
const AUDIT_EXEMPT=new Set(['acceptSuggestion','dismissSuggestion','restoreDismissed','unlockWithPassphrase','setPassphrase','clearPassphrase']);

// Actions the trail should carry but which do not pass through a single API
// method — accepting a whole strip of suggestions, restoring a generation.
function logChange(summary,offeringId){logActivity('changed',summary,offeringId??null);}

for(const name of Object.keys(api)){
  const fn=api[name];
  if(typeof fn!=='function')continue;
  if(!/^(create|update|delete|save|renumber|issue|record|cancel|reverse|refund)/.test(name)&&!AUDIT_EXTRA.has(name))continue;
  if(AUDIT_EXEMPT.has(name))continue;
  const describe=AUDIT[name];
  api[name]=async function(...args){
    // Described first: a deletion can only name what it removed while it is
    // still there. A describer that throws must never stop the write.
    let entry=null;
    if(describe){try{entry=describe(...args);}catch{entry=null;}}
    const out=await fn.apply(this,args);
    if(entry){logActivity('changed',entry[0],entry[1]??null);await persist();}
    // The first record is the moment the browser-only copy starts to matter.
    if(name.startsWith('create'))maybeOfferDataFile();
    return out;
  };
}

/* ---- Undo ----------------------------------------------------------------
   One level, and only over the acts that cannot otherwise be reversed by
   re-typing: the deletions that cascade. Enough to take back the click that
   was a mistake; not so much that the app starts claiming to be a history. */
let undoState=null;
function captureUndo(label){
  try{undoState={label,doc:JSON.parse(serialize()),at:Date.now()};}
  catch{undoState=null;}
}
async function undoLast(){
  if(!undoState)return false;
  const{doc,label}=undoState;undoState=null;
  // The revision must keep climbing across an undo, or the other-tab check
  // reads the restored document as the stale one.
  const rev=Number(db.meta.rev)||0;
  db=normalize(doc);
  db.meta.rev=rev;
  logActivity('undone',`Took back: ${label}`,null);
  await persist();refresh();
  toast('Taken back.','success');
  return true;
}
// Runs `act`, then offers to take it back for as long as the toast stands.
async function withUndo(label,act,doneMessage){
  captureUndo(label);
  await act();
  toast(doneMessage,'success',{label:'Undo',run:undoLast});
}

/* ---- Asking for a data file at the right moment --------------------------
   Until a file is connected the browser copy is the only copy — the default
   state for every new user, and the permanent state on an iPad. The welcome
   panel offers a file while the dashboard is empty, which is exactly when
   there is nothing to lose and no reason to say yes. So ask again at the first
   record, when the answer means something.

   A toast rather than a dialog, and the distinction matters: this fires on a
   create, and a create is very often made from inside an open form. A dialog
   would tear that form down mid-entry to ask a question about backups. It
   asks once a session, stops for good once a file is connected, and takes no
   answer for an answer. */
let fileNudged=false;
function maybeOfferDataFile(){
  if(fileNudged||fileHandle||pendingHandle||!FSA||readOnly)return;
  if(settings().file_prompt_answered)return;
  if(countRecords(db)<1)return;
  fileNudged=true;
  toast('This is held only inside this browser. Clearing browsing data would take it with it.','info',
    {label:'Store it in a file…',run:async()=>{
      db.settings={...db.settings,file_prompt_answered:1};
      await persist();
      await newDataFile();}});
}
// A copy that was never taken is not a backup. Said once per session, and only
// where the app cannot autosave to a file for you.
function backupStalenessNotice(){
  if(fileHandle||!hasData(db))return;
  const at=settings().last_copy_at;
  const days=at?Math.floor((Date.now()-new Date(at).getTime())/86400000):null;
  if(days!==null&&days<7)return;
  toast(days===null
    ?'No copy of this data has been saved yet. It exists in this browser and nowhere else.'
    :`The last copy of this data was saved ${days} days ago.`,
    'error',{label:'Save a copy now',run:downloadCopy});
}
// `existing` supplies the values for fields the form did not render, so an
// edit narrows to what was on screen rather than blanking the rest.
function certFromBody(b,existing){const e=existing||{};return{
  cert_number:str(b.cert_number),investor_id:numOr(b.investor_id),
  holder_name:'holder_name'in b?str(b.holder_name):(e.holder_name??null),
  class_name:str(b.class_name),capital_cents:b.no_capital?null:dollarsToCents(b.capital),
  // pct_of_class: optional manual override of the holder's share WITHIN its class.
  pct_of_class:numOr(b.pct_of_class),
  // percent_interest: optional manual override of TOTAL % ownership (else computed).
  percent_interest:numOr(b.percent_interest),
  pref_return_rate:numOr(b.pref_return_rate),
  // accrued_cents: optional manual override (else auto-computed to the as-of date).
  accrued_cents:dollarsToCents(b.accrued),
  // Written down on the certificate, so a convention changed on the offering
  // later never restates what this one was issued under.
  accrual_convention:'accrual_convention'in b?(str(b.accrual_convention)||null):(e.accrual_convention??null),
  funded_date:str(b.funded_date),
  accrual_start:'accrual_start'in b?str(b.accrual_start):(e.accrual_start??null),
  closing_id:'closing_id'in b?numOr(b.closing_id):(e.closing_id??null),
  subscription_id:'subscription_id'in b?numOr(b.subscription_id):(e.subscription_id??null),
  sort_index:numOr(b.sort_index),no_capital:b.no_capital?1:0,
  issue_date:str(b.issue_date),notes:str(b.notes)};}

/* ============================================================================
   SUGGESTIONS — the record proposes what it can already prove.

   Nothing here writes anything. computeSuggestions returns descriptions of
   changes; a change happens only when a person presses Accept. That is a
   deliberate choice: this is a securities file, and a figure nobody assented
   to is worse than a figure typed twice.
   ========================================================================== */

// Checklist steps whose completion the record itself can evidence. The key is
// stored on the task as `proves`, so a renamed step keeps its proof and a
// hand-written step never acquires one.
const TASK_PROOFS={
  form_d:o=>o.form_d_filed_date&&`Form D is recorded as filed on ${fmtDate(o.form_d_filed_date)}.`,
  escrow_setup:o=>(o.escrow_agent||o.escrow_bank)&&`Escrow is recorded with ${[o.escrow_agent,o.escrow_bank].filter(Boolean).join(' at ')}.`,
  docs_sent:o=>{const s=db.subscriptions.filter(x=>x.offering_id===o.id&&x.status!=='Withdrawn');
    return s.length&&s.every(x=>x.sub_sent_date)&&`All ${s.length} subscription agreement${s.length===1?' has':'s have'} a sent date.`;},
  subs_collected:o=>{const s=db.subscriptions.filter(x=>x.offering_id===o.id&&x.status!=='Withdrawn');
    return s.length&&s.every(x=>x.sub_signed_date)&&`All ${s.length} subscription agreement${s.length===1?' is':'s are'} signed.`;},
  accreditation:o=>{const ids=[...new Set(db.subscriptions.filter(x=>x.offering_id===o.id&&x.status!=='Withdrawn').map(x=>x.investor_id))];
    const inv=ids.map(id=>db.investors.find(i=>i.id===id)).filter(Boolean);
    return inv.length&&inv.every(i=>i.accredited_status==='Verified')&&`All ${inv.length} subscriber${inv.length===1?' is':'s are'} verified accredited.`;},
  min_raise:o=>{const s=escrowSummary(o.id);
    return o.target_min_cents>0&&s.clearedNetDeposits>=o.target_min_cents&&
      `${money(s.clearedNetDeposits)} has cleared escrow against a ${money(o.target_min_cents)} minimum.`;},
  closing_held:o=>{const n=db.closings.filter(c=>c.offering_id===o.id).length;
    return n>0&&`${n} closing${n===1?' is':'s are'} on record.`;},
  escrow_released:o=>{const r=escrowSummary(o.id).releases;
    return r>0&&`${money(r)} has been released to the issuer.`;},
  blue_sky:o=>{const play=[...statesInPlay(o.id).keys()];
    if(!play.length)return false;
    const filed=new Set(stateFilings(o.id).filter(f=>f.filed_date).map(f=>f.state));
    return play.every(c=>filed.has(c))&&
      `Notice filings are recorded for every state on the roster: ${play.map(stateName).join(', ')}.`;}
};
// Which default step proves which. Index-aligned with DEFAULT_CHECKLIST.
const DEFAULT_CHECKLIST_PROOFS={
  'Blue sky / state notice filings':'blue_sky',
  'Set up escrow account with escrow agent':'escrow_setup',
  'File Form D with the SEC':'form_d',
  'Distribute offering documents to investors':'docs_sent',
  'Collect signed subscription agreements':'subs_collected',
  'Verify accredited-investor status':'accreditation',
  'Confirm minimum raise satisfied':'min_raise',
  'Hold closing':'closing_held',
  'Release escrow funds to issuer':'escrow_released'
};

/* ---- Due dates the record already implies --------------------------------
   Checklist dates were typed by hand, while the deadlines that actually
   matter are all computable: Form D runs fifteen days from the first sale,
   the state notices run from the same date, and everything that must happen
   before a closing is due by the final close deadline.

   A step whose date the offering already implies should arrive carrying it,
   in the same way its completion is already proved by the record. Where a
   date has been typed, it stands — this only ever fills a blank. */
const CHECKLIST_DUE={
  form_d:o=>{const f=formDPosition(o);return f&&f.due?[f.due,`fifteen days after the first sale on ${fmtDate(f.firstSale)}`]:null;},
  blue_sky:o=>{const f=formDPosition(o);return f&&f.due?[f.due,'the state notices run from the first sale, as the Form D does']:null;},
  min_raise:o=>o.final_close_date?[o.final_close_date,'the final close deadline']:null,
  closing_held:o=>o.first_close_date?[o.first_close_date,'the first / interim close date']
    :(o.final_close_date?[o.final_close_date,'the final close deadline']:null),
  escrow_released:o=>o.first_close_date?[o.first_close_date,'the first / interim close date']:null,
  subs_collected:o=>o.first_close_date?[o.first_close_date,'the first / interim close date']:null,
  accreditation:o=>o.first_close_date?[o.first_close_date,'the first / interim close date']:null,
  escrow_setup:o=>o.launch_date?[o.launch_date,'the launch date']:null,
  docs_sent:o=>o.launch_date?[o.launch_date,'the launch date']:null,
};
// The proof key a step answers to, whether it came from the standard list or
// was written by hand.
function taskProof(t){return t.proves||DEFAULT_CHECKLIST_PROOFS[t.label]||null;}
function impliedDue(o,t){
  const key=taskProof(t);
  const fn=key&&CHECKLIST_DUE[key];
  return fn?fn(o):null;
}

/* A suggestion:
   {key, kind, offeringId, title, detail, evidence, severity, apply}
   `key` is stable for the same fact and changes when the fact changes, so a
   dismissal sticks but a changed circumstance comes back. */
function sugg(key,offeringId,title,detail,evidence,apply,severity='info'){
  return{key,offeringId:offeringId??null,title,detail,evidence,apply,severity};
}
function dismissed(key){return!!(db.dismissed&&db.dismissed[key]);}

function computeSuggestions(offeringId){
  const out=[];
  if(settings().automation!=='propose')return out;
  const only=offeringId==null?null:Number(offeringId);
  const offerings=only==null?db.offerings:db.offerings.filter(o=>o.id===only);

  for(const o of offerings){
    const subs=db.subscriptions.filter(s=>s.offering_id===o.id);
    const tasks=db.tasks.filter(t=>t.offering_id===o.id);
    const es=escrowSummary(o.id);

    /* ── The exemption ─────────────────────────────────────────────────────
       These read facts already in the file and say where they put the
       offering. Nothing here files anything or gives advice; each one names
       the fact it came from, and the ones with no `apply` are saying
       something that needs a decision rather than a keystroke. */

    // Form D. The app has always known the date of first sale and never once
    // mentioned that a filing falls due fifteen days after it.
    const fd=formDPosition(o);
    if(fd&&fd.firstSale&&!fd.filed){
      const late=fd.daysLeft<0;
      out.push(sugg(`formd-due:${o.id}:${fd.due}`,o.id,
        late?`Form D on ${o.name} was due ${fmtDate(fd.due)}`
            :`Form D on ${o.name} is due ${fmtDate(fd.due)}`,
        `First sale is ${fmtDate(fd.firstSale)}, taken from ${fd.from}. Rule 503 gives fifteen days from there, which ${late?'ran out':'runs out'} on ${fmtDate(fd.due)}. Record the filing date on the offering once it is filed.`,
        relDays(fd.daysLeft),null,late?'warn':'info'));
    }
    // The annual amendment, while the offering continues.
    if(fd&&fd.amendmentDue&&fd.amendmentDaysLeft!==null&&fd.amendmentDaysLeft<=30){
      out.push(sugg(`formd-amend:${o.id}:${fd.amendmentDue}`,o.id,
        `The Form D amendment on ${o.name} falls due ${fmtDate(fd.amendmentDue)}`,
        `The last filing recorded is ${fmtDate(fd.filed)} and the offering is still ${o.status}. An amendment falls due on or before the anniversary while it continues. Recording the new filing date here resets the year.`,
        relDays(fd.amendmentDaysLeft),null,fd.amendmentDaysLeft<0?'warn':'info'));
    }

    const standing=purchaserStanding(o.id);
    const is506b=o.exemption==='Reg D 506(b)';
    const is506c=o.exemption==='Reg D 506(c)';

    // 506(b): the thirty-five ceiling, and what the first non-accredited
    // purchaser brings with them.
    if(is506b&&standing.nonAccredited.length){
      const n=standing.nonAccredited.length;
      if(n>RULE_506B_LIMIT){
        out.push(sugg(`506b-over:${o.id}:${n}`,o.id,
          `${o.name} has ${n} non-accredited purchasers`,
          `Rule 506(b) allows no more than ${RULE_506B_LIMIT}. The exemption does not hold at ${n}, and the roster is the record of it.`,
          `${n} of ${RULE_506B_LIMIT}`,null,'warn'));
      }else if(n>=RULE_506B_LIMIT-5){
        out.push(sugg(`506b-near:${o.id}:${n}`,o.id,
          `${o.name} is ${RULE_506B_LIMIT-n} purchaser${RULE_506B_LIMIT-n===1?'':'s'} from the 506(b) ceiling`,
          `${n} of the ${RULE_506B_LIMIT} non-accredited purchasers Rule 506(b) allows are on the roster.`,
          `${n} of ${RULE_506B_LIMIT}`,null,'warn'));
      }
      out.push(sugg(`506b-info:${o.id}:${n}`,o.id,
        `${o.name} owes Rule 502(b) information to ${n} purchaser${n===1?'':'s'}`,
        `Admitting even one non-accredited purchaser under 506(b) brings the information-delivery requirement with it — the financial and non-financial disclosure the rule specifies, delivered a reasonable time before sale. The checklist has no step for it.`,
        standing.nonAccredited.map(r=>r.investor?investorDisplayName(r.investor):'—').slice(0,3).join(', ')
          +(n>3?` and ${n-3} more`:''),
        // The one thing the app can actually do about it: put the step on
        // this offering's checklist, where it will be seen again.
        async()=>{const label='Deliver Rule 502(b) information to non-accredited purchasers';
          if(db.tasks.some(t=>t.offering_id===o.id&&t.label===label))return;
          const max=db.tasks.filter(t=>t.offering_id===o.id).reduce((m,t)=>Math.max(m,t.sort_order||0),0);
          db.tasks.push({id:nextId('tasks'),offering_id:o.id,label,done:0,done_date:null,
            due_date:null,sort_order:max+1,created_at:nowISO()});
          await persist();},'warn'));
    }
    // 506(b) forbids general solicitation outright.
    if(is506b&&o.general_solicitation){
      out.push(sugg(`506b-solicit:${o.id}`,o.id,
        `${o.name} is marked as generally solicited under 506(b)`,
        'Rule 506(b) is unavailable where the offering is generally solicited or advertised. Either the flag is wrong, or the exemption is 506(c) — under which every purchaser must be verified.',
        o.exemption,null,'warn'));
    }
    // 506(c): self-certification is not enough, and that is the whole bargain.
    if(is506c){
      const short=[...standing.selfCertified,...standing.unestablished];
      if(short.length){
        out.push(sugg(`506c-verify:${o.id}:${short.length}`,o.id,
          `${short.length} purchaser${short.length===1?' on':'s on'} ${o.name} ${short.length===1?'is':'are'} not verified`,
          'Under 506(c) general solicitation is permitted because every purchaser is verified. Self-certification does not satisfy it, and neither does an unrecorded status. Record the verification, its basis and its date on each contact.',
          short.map(r=>r.investor?investorDisplayName(r.investor):'—').slice(0,3).join(', ')
            +(short.length>3?` and ${short.length-3} more`:''),
          null,'warn'));
      }
    }
    // Rule 506(d). Its absence from the file is the awkward part.
    if(/^Reg D 506/.test(String(o.exemption||''))&&!o.bad_actor_checked_date&&
       (subs.length||o.status!=='Drafting')){
      out.push(sugg(`bad-actor:${o.id}`,o.id,
        `No bad-actor inquiry is recorded for ${o.name}`,
        'Rule 506(d) disqualifies an offering where a covered person has a relevant order or conviction. The inquiry is routine; what is not routine is having no record that it was made. Edit the offering to record the date.',
        o.exemption,null,'warn'));
    }

    // Blue sky: which states the roster has put in play, and which of them
    // have no filing recorded.
    {
      const play=statesInPlay(o.id);
      const filed=new Set(stateFilings(o.id).filter(f=>f.filed_date).map(f=>f.state));
      const missing=[...play.keys()].filter(c=>!filed.has(c)).sort();
      if(missing.length){
        out.push(sugg(`blue-sky:${o.id}:${missing.join(',')}`,o.id,
          `${missing.length} state${missing.length===1?'' :'s'} on ${o.name} ${missing.length===1?'has':'have'} no notice filing recorded`,
          `Subscribers are resident in ${missing.map(stateName).join(', ')} and no filing is on record for ${missing.length===1?'it':'them'}. Most states want a notice within fifteen days of the first sale in the state, with a fee.`,
          missing.join(' · '),
          // Open a row per state, ready to be dated. Nothing is claimed as
          // filed — the rows are there to be filled in.
          async()=>{
            for(const code of missing){
              if(db.state_filings.some(f=>f.offering_id===o.id&&f.state===code))continue;
              db.state_filings.push({id:nextId('state_filings'),offering_id:o.id,state:code,
                filed_date:null,fee_cents:null,confirmation:null,notes:null,created_at:nowISO()});
            }
            await persist();},'warn'));
      }
    }

    /* -- Money that arrived, against the subscription it answers ----------- */
    for(const s of subs){
      if(s.status==='Withdrawn')continue;
      const inv=db.investors.find(i=>i.id===s.investor_id);
      const who=inv?investorDisplayName(inv):'This subscriber';
      const esc=investorEscrow(o.id,s.investor_id,s.id);
      const due=subscriptionDue(s,o);

      // A cleared deposit dates the funding. Do not make anyone retype it.
      if(esc.fundedDate&&s.funded_date!==esc.fundedDate){
        out.push(sugg(`funded-date:${s.id}:${esc.fundedDate}`,o.id,
          `Set ${who}'s funded date to ${fmtDate(esc.fundedDate)}`,
          s.funded_date?`The subscription records ${fmtDate(s.funded_date)}, but the earliest cleared deposit is ${fmtDate(esc.fundedDate)}. Certificate numbering runs off this date.`
            :'The deposit has cleared escrow, so the funding date is already on record. Certificate numbering runs off this date.',
          `${money(esc.clearedDeposits)} cleared escrow`,
          async()=>{s.funded_date=esc.fundedDate;if(SUB_STATUS_RANK[s.status]<SUB_STATUS_RANK.Funded)s.status='Funded';
            s.updated_at=nowISO();await persist();}));
      }

      // Funding recorded on the subscription but nothing in the escrow ledger.
      // An unattributed deposit of exactly this amount is very likely this
      // money, recorded without the investor — propose nothing rather than a
      // double entry the reconciliation would then chase.
      const unattributed=db.escrow.some(e=>e.offering_id===o.id&&e.txn_type==='deposit'&&!e.investor_id&&e.amount_cents===due);
      if(s.funded_date&&!esc.rows.length&&due>0&&!unattributed){
        out.push(sugg(`deposit-missing:${s.id}:${s.funded_date}:${due}`,o.id,
          `Record ${who}'s ${money(due)} deposit in the escrow ledger`,
          `The subscription is funded as at ${fmtDate(s.funded_date)}, but no deposit appears in the escrow ledger, so the cleared balance understates what was received.`,
          `${money(s.amount_committed_cents)} committed${o.pass_through_costs&&s.costs_cents?` · ${money(s.costs_cents)} costs`:''}`,
          async()=>{db.escrow.push({id:nextId('escrow'),offering_id:o.id,investor_id:s.investor_id,subscription_id:s.id,
            txn_type:'deposit',amount_cents:due,txn_date:s.funded_date,method:null,reference:null,cleared:1,
            notes:'Recorded from the subscription.',source:'proposed',created_at:nowISO()});await persist();},
          'warn'));
      }

      // The label has fallen behind the dates underneath it.
      const derived=derivedSubStatus(s);
      if(!s.closing_id&&derived!==s.status&&(SUB_STATUS_RANK[derived]??0)>(SUB_STATUS_RANK[s.status]??0)){
        out.push(sugg(`sub-status:${s.id}:${derived}`,o.id,
          `Move ${who} to “${derived}”`,
          `The subscription is marked “${s.status}”, but its own dates put it at “${derived}”. Signed and funded totals on the printed summary are scored from this.`,
          derived==='Funded'?`Funded ${fmtDate(s.funded_date)}`:derived==='Sub signed'?`Signed ${fmtDate(s.sub_signed_date)}`:derived==='Sub sent'?`Sent ${fmtDate(s.sub_sent_date)}`:'Linked to a closing',
          // Re-derived at the moment it runs: an earlier accepted change may
          // already have moved this subscription further on, and a label must
          // only ever advance.
          async()=>{const d=derivedSubStatus(s);
            if(s.status!=='Withdrawn'&&(SUB_STATUS_RANK[d]??0)>(SUB_STATUS_RANK[s.status]??0)){s.status=d;s.updated_at=nowISO();await persist();}}));
      }

      // Units and the amount disagree with the price they are both drawn from.
      const scope=scopeFor({offering:o,subscription:s});
      const du=derivedUnits(s,scope);
      if(du!=null&&s.units!=null&&Math.abs(Number(s.units)-du)>1e-6){
        out.push(sugg(`units:${s.id}:${du}`,o.id,
          `Set ${who}'s units to ${du}`,
          `${money(s.amount_committed_cents)} at ${money(inherited(scope,'price_per_unit_cents'))} a unit is ${du} units; the subscription records ${s.units}.`,
          `${s.units} recorded · ${du} implied`,
          async()=>{s.units=du;s.updated_at=nowISO();await persist();},'warn'));
      }
      if(du!=null&&s.units==null){
        out.push(sugg(`units-blank:${s.id}:${du}`,o.id,
          `Record ${du} units for ${who}`,
          `The amount and the unit price already determine this. Units appear on the roster and the printed summary.`,
          `${money(s.amount_committed_cents)} ÷ ${money(inherited(scope,'price_per_unit_cents'))}`,
          async()=>{s.units=du;s.updated_at=nowISO();await persist();}));
      }

      // Closed against a closing but still labelled otherwise.
      if(s.closing_id&&s.status!=='Closed'&&s.status!=='Withdrawn'){
        out.push(sugg(`closed-label:${s.id}`,o.id,
          `Mark ${who} closed`,
          'The subscription is linked to a closing but is not labelled Closed.','Linked to a closing',
          async()=>{s.status='Closed';s.updated_at=nowISO();await persist();}));
      }
    }

    /* -- Money in the ledger with no subscription behind it ---------------- */
    const subInvestors=new Set(subs.map(s=>s.investor_id));
    // Grouped per depositor: two wires from one investor are one subscriber
    // to add, not two subscriptions.
    const strays=new Map();
    for(const e of db.escrow.filter(x=>x.offering_id===o.id&&x.txn_type==='deposit'&&x.investor_id)){
      if(subInvestors.has(e.investor_id))continue;
      if(!strays.has(e.investor_id))strays.set(e.investor_id,[]);
      strays.get(e.investor_id).push(e);
    }
    for(const[invId,rows]of strays){
      const inv=db.investors.find(i=>i.id===invId);
      const total=rows.reduce((a,e)=>a+(Number(e.amount_cents)||0),0);
      const firstCleared=rows.filter(e=>e.cleared).map(e=>e.txn_date).filter(Boolean).sort()[0]||null;
      out.push(sugg(`sub-missing:${o.id}:${invId}:${total}`,o.id,
        `Add ${inv?investorDisplayName(inv):'this depositor'} to the offering`,
        `${rows.length===1?'A deposit is':rows.length+' deposits are'} recorded against someone who is not a subscriber on this offering, so the money sits in escrow against nothing.`,
        `${money(total)} deposited`,
        async()=>{
          // Re-checked at apply time: an earlier accept may already have
          // added this depositor.
          if(db.subscriptions.some(x=>x.offering_id===o.id&&x.investor_id===invId))return;
          const sub={id:nextId('subscriptions'),offering_id:o.id,investor_id:invId,
            amount_committed_cents:total,units:null,costs_cents:null,tranche_id:null,
            funded_date:firstCleared,status:firstCleared?'Funded':'Prospect',
            sub_sent_date:null,sub_signed_date:null,notes:'Created from the escrow ledger.',closing_id:null,
            source:'proposed',created_at:nowISO(),updated_at:nowISO()};
          db.subscriptions.push(sub);
          rows.forEach(e=>{if(e.subscription_id==null)e.subscription_id=sub.id;});
          await persist();},
        'warn'));
    }

    /* -- Checklist steps the record already evidences ---------------------- */
    for(const t of tasks){
      if(t.done)continue;
      const proofKey=t.proves||DEFAULT_CHECKLIST_PROOFS[t.label];
      if(!proofKey||!TASK_PROOFS[proofKey])continue;
      const proof=TASK_PROOFS[proofKey](o);
      if(!proof)continue;
      out.push(sugg(`task:${t.id}`,o.id,`Mark “${t.label}” complete`,proof,'Proved by the record',
        async()=>{t.done=1;t.done_date=todayISO();await persist();}));
    }
    // The converse: a step ticked whose date the offering never got.
    const formD=tasks.find(t=>(t.proves||DEFAULT_CHECKLIST_PROOFS[t.label])==='form_d');
    if(formD&&formD.done&&!o.form_d_filed_date&&formD.done_date){
      out.push(sugg(`formd-date:${o.id}:${formD.done_date}`,o.id,
        `Record the Form D filing date as ${fmtDate(formD.done_date)}`,
        'The checklist step is complete but the offering has no filing date, so the printed summary shows a dash where the filing should be.',
        'From the checklist',
        async()=>{o.form_d_filed_date=formD.done_date;o.updated_at=nowISO();await persist();}));
    }

    /* -- The offering's own labels ---------------------------------------- */
    const days=daysUntil(o.final_close_date);
    if(days!==null&&days<0&&!['Closed','Terminated'].includes(o.status)){
      out.push(sugg(`past-deadline:${o.id}:${o.final_close_date}`,o.id,
        `${o.name} is past its final close deadline`,
        `The deadline was ${fmtDate(o.final_close_date)} and the offering is still ${o.status}. Either extend the deadline or move the offering on.`,
        relDays(days),null,'warn'));
    }
    // The deadline passed and the minimum was never reached. This is the one
    // suggestion that proposes an ending rather than a correction, so it
    // carries no `apply` — it points at the screen that itemises it first.
    if(days!==null&&days<0&&o.target_min_cents&&!['Closed','Terminated'].includes(o.status)
       &&!db.closings.some(c=>c.offering_id===o.id)){
      const sum=offeringSummary(o);
      if(!sum.minRaiseMet){
        out.push(sugg(`break-escrow:${o.id}:${o.final_close_date}`,o.id,
          `${o.name} closed short of its minimum`,
          `${money(sum.escrow.clearedNetDeposits)} cleared against a ${money(o.target_min_cents)} minimum, and the deadline was ${fmtDate(o.final_close_date)}. Either the deadline moves, or escrow breaks: the Closings tab will itemise the refunds before writing any of them.`,
          `${money(o.target_min_cents-sum.escrow.clearedNetDeposits)} short`,null,'warn'));
      }
    }
    if(o.status==='Drafting'&&(subs.length||es.deposits)){
      out.push(sugg(`status-open:${o.id}`,o.id,`Move ${o.name} to Open`,
        'The offering is still marked Drafting although subscribers and escrow activity are on record.',
        `${subs.length} subscriber${subs.length===1?'':'s'}`,
        async()=>{o.status='Open';o.updated_at=nowISO();await persist();}));
    }

    /* -- Ownership classes ------------------------------------------------- */
    const classes=Array.isArray(o.classes)?o.classes:[];
    if(classes.length){
      const sum=classes.reduce((a,c)=>a+(Number(c.total_percent)||0),0);
      if(Math.abs(sum-100)>0.0001){
        out.push(sugg(`class-sum:${o.id}:${sum}`,o.id,'The ownership classes do not total 100%',
          `The defined classes come to ${fmtPct(sum)} of the company. Every certificate's total percentage is scaled from these, so the cap table is wrong until they balance.`,
          fmtPct(sum),null,'warn'));
      }
      // A class name that exists only on a certificate is almost always a typo.
      const known=new Set(classes.map(c=>c.name));
      const stray=[...new Set(db.certificates.filter(c=>c.offering_id===o.id&&c.class_name&&!known.has(c.class_name)).map(c=>c.class_name))];
      for(const name of stray){
        out.push(sugg(`stray-class:${o.id}:${name}`,o.id,`“${name}” is not one of this offering's classes`,
          'Certificates carry a class name that the class structure does not define, so their share is pro-rated outside the defined split.',
          [...known].join(' · ')||'no classes defined',null,'warn'));
      }
    }

    /* -- Certificates against their subscriptions -------------------------- */
    for(const c of db.certificates.filter(x=>x.offering_id===o.id)){
      if(c.no_capital||!c.investor_id)continue;
      // The certificate's own link first; else the investor's single live
      // subscription. Two live subscriptions is ambiguous — say nothing
      // rather than compare against the wrong one.
      let s=c.subscription_id?subs.find(x=>x.id===c.subscription_id):null;
      if(!s){const live=subs.filter(x=>x.investor_id===c.investor_id&&x.status!=='Withdrawn');
        if(live.length!==1)continue;s=live[0];}
      if(!s||s.amount_committed_cents==null||c.capital_cents==null)continue;
      if(c.capital_cents!==s.amount_committed_cents){
        const inv=db.investors.find(i=>i.id===c.investor_id);
        out.push(sugg(`cert-capital:${c.id}:${s.amount_committed_cents}`,o.id,
          `Certificate ${c.cert_number} disagrees with the subscription`,
          `The certificate records ${money(c.capital_cents)} of capital for ${inv?investorDisplayName(inv):'this holder'}; the subscription records ${money(s.amount_committed_cents)}. Percentage interests are computed from capital.`,
          `${money(c.capital_cents)} on the certificate`,
          async()=>{c.capital_cents=s.amount_committed_cents;await persist();},'warn'));
      }
    }

    /* -- Reconciliation ---------------------------------------------------- */
    const recs=db.reconciliations.filter(r=>r.offering_id===o.id)
      .sort((a,b)=>(b.statement_date||b.created_at||'').localeCompare(a.statement_date||a.created_at||''));
    if(recs[0]&&recs[0].difference_cents){
      out.push(sugg(`recon:${recs[0].id}`,o.id,'The last reconciliation did not agree',
        `The statement of ${fmtDate(recs[0].statement_date)} differs from the app's cleared balance by ${money(Math.abs(recs[0].difference_cents))}. Pending deposits that have since cleared are the usual cause.`,
        (recs[0].difference_cents>0?'+':'−')+money(Math.abs(recs[0].difference_cents)),null,'warn'));
    }
    // Deposits sitting pending long after their date.
    const stale=db.escrow.filter(e=>e.offering_id===o.id&&e.txn_type==='deposit'&&!e.cleared&&e.txn_date&&daysUntil(e.txn_date)<-10);
    if(stale.length){
      const total=stale.reduce((a,e)=>a+(e.amount_cents||0),0);
      out.push(sugg(`stale-pending:${o.id}:${stale.length}:${total}`,o.id,
        `${stale.length} deposit${stale.length===1?'':'s'} still pending after ten days`,
        'Pending deposits are excluded from the cleared balance, so the minimum raise reads low until they are marked cleared.',
        `${money(total)} pending`,null,'warn'));
    }
  }

  /* -- Contact book and directory (not tied to one offering) --------------- */
  if(only==null){
    for(const i of db.investors){
      if(i.accredited_status==='Verified'&&!i.accredited_verified_date){
        out.push(sugg(`acc-date:${i.id}`,null,`Record when ${investorDisplayName(i)}'s accreditation was verified`,
          'The investor is marked Verified with no verification date. The date is the part that evidences the exemption.',
          'Verified, undated',null));
      }
      // The status says whether; nothing said how, which is the half a file
      // is actually read for.
      if(i.accredited_status==='Verified'&&i.accredited_verified_date&&!i.accreditation_basis){
        out.push(sugg(`acc-basis:${i.id}`,null,`Record how ${investorDisplayName(i)}'s accreditation was established`,
          'Verified on a date, but the file does not say on what — income, net worth, a professional licence, a letter from counsel. The basis is what the evidence consists of.',
          `Verified ${fmtDate(i.accredited_verified_date)}`,null));
      }
      // Evidence goes stale. Not a rule in Reg D — a house standard, and said
      // as one rather than dressed up as the regulation.
      const stale=accreditationStaleness(i);
      if(stale){
        const live=db.subscriptions.some(s=>s.investor_id===i.id&&s.status!=='Withdrawn'&&!s.closing_id);
        if(live)out.push(sugg(`acc-stale:${i.id}:${i.accredited_evidence_date||i.accredited_verified_date}`,null,
          `${investorDisplayName(i)}'s accreditation evidence is ${stale} days old`,
          `The evidence relied on is dated ${fmtDate(i.accredited_evidence_date||i.accredited_verified_date)} and there is an open subscription. A firm taking ${ACCREDITATION_STALE_DAYS} days as its limit would re-verify before the next sale.`,
          `${stale} days`,null,'warn'));
      }
      // A holder with no state is a state notice filing nobody can see is due.
      if(!str(i.state)){
        const guess=investorState(i);
        const onDeals=db.subscriptions.some(s=>s.investor_id===i.id&&s.status!=='Withdrawn');
        if(guess&&onDeals)out.push(sugg(`inv-state:${i.id}:${guess}`,null,
          `Record ${investorDisplayName(i)} as resident in ${stateName(guess)}`,
          'The address ends in this state and the contact has no state recorded. State notice filings are worked out from this field, so a blank one hides a filing that may be due.',
          guess,
          async()=>{const inv=db.investors.find(x=>x.id===i.id);
            if(inv&&!str(inv.state)){inv.state=guess;inv.updated_at=nowISO();await persist();}}));
      }
    }
    // Two records for one person is the most expensive duplicate of all.
    const seen=new Map();
    for(const i of db.investors){
      for(const k of [i.email&&`e:${String(i.email).toLowerCase()}`,i.tax_id&&`t:${String(i.tax_id).replace(/\D/g,'')}`].filter(Boolean)){
        if(k==='t:')continue;
        if(seen.has(k)){
          const other=seen.get(k);
          out.push(sugg(`dup:${Math.min(other.id,i.id)}:${Math.max(other.id,i.id)}`,null,
            `${investorDisplayName(other)} and ${investorDisplayName(i)} share ${k.startsWith('e:')?'an email address':'a taxpayer ID'}`,
            'Two contact records for one holder split their subscriptions, their accreditation evidence and their certificates.',
            k.slice(2),null,'warn'));
        }else seen.set(k,i);
      }
    }
    if(!settings().firm_name&&db.offerings.length){
      out.push(sugg('settings-firm',null,'Set up your firm details',
        'The firm name, address and report footer appear on every printed summary, and the defaults you set there start every new offering.',
        'Entered once',null));
    }
  }

  return out.filter(s=>!dismissed(s.key));
}

function openEscrowForm(offeringId,investors,existing,onDone){
  const isEdit=!!existing;
  const o=db.offerings.find(x=>x.id===Number(offeringId))||{};
  // Subscribers on this offering are who a deposit almost always belongs to.
  const subscriberIds=db.subscriptions.filter(s=>s.offering_id===Number(offeringId)).map(s=>s.investor_id);
  // Live help under the Investor field: what this person subscribed for and
  // what has already come in, so the amount does not have to be looked up.
  const context=el('div',{class:'field-note'});
  function describe(investorId){
    clear(context);
    const sub=investorId?subscriptionFor(offeringId,investorId):null;
    if(!sub){if(investorId)context.appendChild(el('span',{},'Not a subscriber on this offering yet.'));return null;}
    const e=investorEscrow(offeringId,sub.investor_id,sub.id);
    const due=subscriptionDue(sub,o),got=e.deposits-e.refunds,left=Math.max(0,due-got);
    context.appendChild(el('span',{},
      `Subscribed ${money(due)}`,
      got?` · ${money(got)} received`:' · nothing received yet',
      left?` · ${money(left)} outstanding`:' · fully funded'));
    return{sub,left,due};
  }
  formModal({title:isEdit?'Edit escrow entry':'New escrow entry',submitLabel:isEdit?'Save changes':'Add entry',
    values:existing?{txn_type:existing.txn_type,investor_id:existing.investor_id??'',amount:centsToInput(existing.amount_cents),
      txn_date:existing.txn_date,method:existing.method,reference:existing.reference,cleared:existing.cleared?'yes':'no',notes:existing.notes}
      // A new entry opens as a deposit, dated today, by whatever method the
      // last deposit on this offering used.
      :{txn_type:'deposit',cleared:'no',txn_date:defaultDate(),method:lastEscrowMethod(offeringId)||''},
    fields:[
      {name:'txn_type',label:'Type',type:'select',options:TXN_TYPES,half:true},
      {name:'amount',label:'Amount',type:'money',required:true,half:true},
      {name:'investor_id',label:'Investor',type:'custom',half:true,
        build:val=>investorPicker(investors,val,{preferred:subscriberIds,allowCreate:true,
          onPick:i=>{
            const info=describe(i.id);
            // Fill a blank amount with what is still outstanding. An amount
            // already typed is left exactly as typed.
            const amt=document.getElementById('f_amount');
            if(info&&info.left&&amt&&!amt.value)amt.value=(info.left/100).toFixed(2);
          }}),
        help:'Deposits and refunds belong to an investor; releases and fees do not.'},
      {name:'txn_date',label:'Date',type:'date',half:true},
      {name:'method',label:'Method',type:'select',options:['',...PAYMENT_METHODS],half:true},
      {name:'cleared',label:'Cleared at bank?',type:'select',options:[{value:'no',label:'Pending'},{value:'yes',label:'Cleared'}],half:true,
        help:'Only cleared deposits count towards the minimum raise.'},
      {name:'reference',label:'Reference / check #',half:true,mono:true},
      {name:'notes',label:'Notes',type:'textarea'}],
    onSubmit:async v=>{
      const sub=v.investor_id?subscriptionFor(offeringId,v.investor_id):null;
      const payload={...v,cleared:v.cleared==='yes',subscription_id:sub?sub.id:null};
      if(isEdit)await api.updateEscrow(existing.id,payload);else await api.createEscrow(offeringId,payload);
      toast('Escrow entry saved.','success');onDone?.();}});
  // Place the running context under the investor row and prime it.
  const row=document.getElementById('f_amount');
  const invRow=document.querySelector('#modal-root .form-row .ac-wrap');
  if(invRow&&invRow.parentElement)invRow.parentElement.appendChild(context);
  if(existing&&existing.investor_id)describe(existing.investor_id);
}

  /* A ledger long enough to be worth keeping is too long to read.
     The structural filters — type, cleared, date range — redraw the table,
     because they change what the totals underneath are totals of. The text

     does: a redraw on every keystroke takes the cursor with it.

    if(f.cleared==='pending'&&t.cleared)return false;
    if(f.from&&(!t.txn_date||t.txn_date<f.from))return false;
    if(f.to&&(!t.txn_date||t.txn_date>f.to))return false;

      el('input',{type:'date',class:'inline-input date',value:f.from,onchange:e=>set('from',e.target.value)}),
      el('span',{},'to'),
      el('input',{type:'date',class:'inline-input date',value:f.to,onchange:e=>set('to',e.target.value)})),
    anyFilter()?el('button',{class:'btn btn-ghost btn-sm',onclick:clearAll},'Clear'):null):null;

  const view=el('div',{class:'escrow-wrap'},
    el('div',{class:'stat-row'},statCard('Cleared balance',money(summary.clearedBalance),{kind:'accent',sub:'settled at bank'}),

    el('div',{class:'section-head'},el('h2',{},'Escrow ledger'),

        shown.length?el('button',{class:'btn btn-ghost btn-sm',onclick:()=>exportEscrow(state.offering,shown)},'@icon:download','CSV'):null,

  if(shown.length){

      {label:'Entry',primary:true,sort:t=>t.investor_name,render:t=>[
        el('span',{},t.investor_name||(t.txn_type==='release'?'Release to issuer':t.txn_type==='fee'?'Fee or expense':'—')),

      {label:'Cleared',render:t=>el('button',{class:`clear-toggle ${t.cleared?'on':''}`,type:'button',
        'aria-pressed':t.cleared?'true':'false',
        'aria-label':`${t.cleared?'Cleared':'Pending'} — press to mark ${t.cleared?'pending':'cleared'}`,
        onclick:async()=>{
          await api.updateEscrow(t.id,{txn_type:t.txn_type,investor_id:t.investor_id,subscription_id:t.subscription_id,
            amount:(t.amount_cents/100).toFixed(2),txn_date:t.txn_date,method:t.method,reference:t.reference,
            cleared:!t.cleared,notes:t.notes});
          await reloadOffering();drawTab();}},t.cleared?'Cleared':'Pending')},
      // Sorted by what the entry does to the balance, so the biggest movements
      // gather at one end rather than deposits and refunds interleaving.
      {label:'Amount',num:true,sort:t=>(SIGN[t.txn_type]||0)*(t.amount_cents||0),

      {label:'',cls:'row-actions',render:t=>rowActions(
        iconButton('edit','Edit this entry',()=>openEscrowForm(state.offering.id,state.investors,t,async()=>{await reloadOffering();drawTab();})),
        iconButton('trash','Delete this entry',async()=>{const ok=await confirmDialog('Delete this escrow entry?',{danger:true,confirmLabel:'Delete'});
          if(!ok)return;await api.deleteEscrow(t.id);toast('Deleted.','success');await reloadOffering();drawTab();},{danger:true}))}

      el('p',{},'Nothing in this selection matches what you typed.')));

async function checklistTab(state,drawTab,reloadOffering){
  const tasks=await api.listTasks(state.offering.id);
  const list=el('ul',{class:'checklist'});
  const countLabel=el('span',{class:'count-label'},`${tasks.filter(t=>t.done).length}/${tasks.length} complete`);
  function updateCount(items){countLabel.textContent=`${items.filter(x=>x.done).length}/${items.length} complete`;}
  function drawList(items){clear(list);items.forEach(t=>list.appendChild(taskRow(t,items)));}
  function taskRow(t,items){
    // Resolved at read time, exactly as the inheritance cascade resolves
    // everything else: a date the offering implies is not copied onto the
    // step, so moving the close date moves every step that followed from it.
    const implied=!t.due_date&&!t.done?impliedDue(state.offering,t):null;
    const overdue=d=>d&&daysUntil(d)<0;
    return el('li',{class:'check-item'+(t.done?' done':'')},
      el('label',{class:'check-label'},el('input',{type:'checkbox',checked:!!t.done,onchange:async e=>{
        await api.updateTask(t.id,{done:e.target.checked,done_date:e.target.checked?todayISO():null});t.done=e.target.checked?1:0;
        e.target.closest('.check-item').classList.toggle('done',!!t.done);updateCount(items);}}),el('span',{class:'check-text'},t.label)),
      el('div',{class:'check-right'},
        t.done&&t.done_date?el('span',{class:'check-due'},'Done '+fmtDate(t.done_date)):null,
        t.due_date&&!t.done?el('span',{class:'check-due'+(overdue(t.due_date)?' overdue':'')},'Due '+fmtDate(t.due_date)):null,
        implied?el('span',{class:'check-due implied'+(overdue(implied[0])?' overdue':''),
          title:`Worked out from ${implied[1]}. Type a date to override it.`},
          'Due '+fmtDate(implied[0])):null,
        el('button',{class:'icon-btn danger',title:'Delete step',onclick:async()=>{await api.deleteTask(t.id);const i=items.indexOf(t);if(i>=0)items.splice(i,1);drawList(items);updateCount(items);}},'@icon:trash')));
  }
  const newInput=el('input',{class:'inline-input',placeholder:'Add a step…',type:'text'});
  const dueInput=el('input',{class:'inline-input date',type:'date',title:'Optional due date'});
  async function addTask(){const label=newInput.value.trim();if(!label)return;
    const created=await api.createTask(state.offering.id,{label,due_date:dueInput.value||null});tasks.push(created);
    newInput.value='';dueInput.value='';drawList(tasks);updateCount(tasks);newInput.focus();}
  newInput.addEventListener('keydown',e=>{if(e.key==='Enter')addTask();});
  drawList(tasks);
  return el('section',{class:'panel'},el('div',{class:'section-head'},el('h2',{},'Process checklist'),countLabel),list,
    el('p',{class:'field-help',style:'margin:12px 0 0'},
      'A date in lighter type is one the offering already implies — the Form D window, the close dates — and it moves when the offering does. Type a date on a step to fix it instead.'),
    el('div',{class:'add-task-row'},newInput,dueInput,el('button',{class:'btn btn-primary btn-sm',onclick:addTask},'Add step')));
}

function openDistributionForm(offering,onDone){
  const amountInput=el('input',{type:'text',class:'inline-input money-input',placeholder:'0.00',inputmode:'decimal'});
  const dateInput=el('input',{type:'date',class:'inline-input date',value:defaultDate()||todayISO()});
  const labelInput=el('input',{type:'text',class:'inline-input grow',
    placeholder:`Distribution ${db.distributions.filter(d=>d.offering_id===offering.id).length+1}`});
  const basisSelect=el('select',{class:'inline-input'},
    ...DISTRIBUTION_BASES.map(b=>el('option',{value:b.value},b.label)));
  const methodInput=el('input',{type:'text',class:'inline-input',placeholder:'Wire, check…'});
  const refInput=el('input',{type:'text',class:'inline-input',placeholder:'Reference'});
  const notesInput=el('input',{type:'text',class:'inline-input grow',placeholder:'Notes (optional)'});
  const basisHelp=el('p',{class:'field-help',style:'margin:6px 0 0'});
  const tableWrap=el('div',{});
  const errorBox=el('div',{class:'form-error',style:'display:none'});
  // The proposal is a starting point, not an answer: every cell is editable,
  // and nothing is written until the parts come to the whole.
  let rows=[];
  function recompute({keepEdits=false}={}){
    const amount=Math.abs(dollarsToCents(amountInput.value)||0);
    const basis=basisSelect.value;
    basisHelp.textContent=(DISTRIBUTION_BASES.find(b=>b.value===basis)||{}).help||'';
    if(!keepEdits){
      const p=proposeDistribution(offering.id,amount,basis,dateInput.value||todayISO());
      rows=p.rows;
    }
    draw(amount);
  }
  // The table is rebuilt when the amount or the basis changes, and only then.
  // Editing a cell updates that row's total and the banner in place — a table
  // that redraws under the cursor loses focus on the way to the next field.
  const totalCells=new Map();
  const bannerWrap=el('div',{});
  function updateTotals(amount){
    for(const[r,node]of totalCells)node.textContent=money(r.pref_cents+r.capital_cents);
    const allocated=rows.reduce((a,r)=>a+r.pref_cents+r.capital_cents,0);
    const diff=amount-allocated;
    clear(bannerWrap);
    bannerWrap.appendChild(el('div',{class:'banner'+(diff?' banner-warn':'')},
      el('div',{},
        el('strong',{},money(allocated)),' allocated of ',el('strong',{},money(amount)),
        diff?el('span',{},` — ${money(Math.abs(diff))} ${diff>0?'still to allocate':'over-allocated'}`)
          :el('span',{},' — these agree.')),
      diff&&amount?el('button',{class:'btn btn-sm',type:'button',onclick:()=>recompute()},'Recalculate'):null));
  }
  function draw(amount){
    clear(tableWrap);totalCells.clear();
    if(!rows.length){tableWrap.appendChild(emptyState('No live certificates on this offering.'));return;}
    const cell=(r,key)=>el('input',{type:'text',class:'inline-input money-input',inputmode:'decimal',
      value:centsToInput(r[key]),'aria-label':`${key==='pref_cents'?'Preferred return':'Capital'} for ${r.holder}`,
      // Both, so a typed figure counts as it is typed and a pasted one counts
      // when the field is left.
      oninput:e=>{r[key]=Math.max(0,dollarsToCents(e.target.value)||0);updateTotals(amount);},
      onchange:e=>{r[key]=Math.max(0,dollarsToCents(e.target.value)||0);updateTotals(amount);}});
    tableWrap.appendChild(dataTable([
      {label:'Holder',primary:true,render:r=>[el('span',{},r.holder),
        el('div',{class:'cell-sub'},`Certificate ${r.cert_number} · ${fmtPct(r.ownership)} · ${money(r.owed)} owed`)]},
      {label:'Preferred return',num:true,render:r=>cell(r,'pref_cents')},
      {label:'Capital',num:true,render:r=>cell(r,'capital_cents')},
      {label:'Total',num:true,render:r=>{const n=el('span',{},money(r.pref_cents+r.capital_cents));
        totalCells.set(r,n);return n;}}
    ],rows,{caption:'What each holder receives'}));
    tableWrap.appendChild(bannerWrap);
    updateTotals(amount);
  }
  amountInput.addEventListener('input',()=>recompute());
  basisSelect.addEventListener('change',()=>recompute());
  dateInput.addEventListener('change',()=>recompute());
  recompute();

  const submit=el('button',{class:'btn btn-primary',type:'submit'},'Record distribution');
