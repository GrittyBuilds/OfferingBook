<style>
/* ══════════════════════════════════════════════════════════════════════════
   MUNIMENT — design tokens
   Light is the default. Dark is opt-in via html[data-theme="dark"].
   Legacy variable names (--navy, --accent) are kept as aliases so existing
   rules keep working; new work should use --brand and --brass.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* type */
  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-serif:'Newsreader','Iowan Old Style','Palatino Linotype',Palatino,"Book Antiqua",Georgia,serif;
  --font-mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;

  /* geometry */
  --radius:8px;--radius-sm:6px;

  /* ---- light theme ---- */
  --bg:#F6F5F1;--surface:#FFFFFF;--surface-2:#FAF9F6;
  --border:#E5E2DA;--border-strong:#D4D0C5;
  --text:#14181C;--text-soft:#4A535C;--muted:#646E78;

  --brand:#14453F;--brand-2:#1E635A;--brand-soft:#E7EFED;--brand-line:#C9D8D4;
  --brand-ring:rgba(20,69,63,.14);
  --sidebar:#14453F;--sidebar-text:#CFE0DC;--sidebar-dim:#A9C4BE;--sidebar-line:rgba(255,255,255,.10);

  --brass:#A8813C;--brass-2:#BE9450;--brass-text:#7A5C24;--brass-soft:#F7F1E4;--brass-line:#E8DCC0;
  --on-brass:#221803;

  --green:#16694F;--green-bg:#E6F2ED;
  --amber:#8A6410;--amber-bg:#F8F0DE;
  --red:#97302F;--red-2:#7E2524;--red-bg:#F9E9E8;--red-line:#E4C6C5;
  --blue:#1F5480;--blue-bg:#E7EFF7;

  --scrim:rgba(12,20,18,.52);
  --shadow:0 1px 2px rgba(20,30,26,.05),0 3px 10px rgba(20,30,26,.045);
  --shadow-lg:0 12px 40px rgba(12,20,18,.20);

  /* legacy aliases */
  --navy:var(--brand);--navy-2:var(--brand-2);
  --accent:var(--brass);--accent-dark:var(--brass-text);

  color-scheme:light;
  font-family:var(--font-sans);
}
html[data-theme="dark"]{
  --bg:#0F1416;--surface:#161C1F;--surface-2:#1D2427;
  --border:#2A3337;--border-strong:#3A4549;
  --text:#E7EBE9;--text-soft:#A8B3B1;--muted:#869390;

  --brand:#4FA396;--brand-2:#6BBDB0;--brand-soft:#16302C;--brand-line:#284944;
  --brand-ring:rgba(79,163,150,.22);
  --sidebar:#0B1113;--sidebar-text:#C2D2CE;--sidebar-dim:#8CA39E;--sidebar-line:rgba(255,255,255,.09);

  --brass:#C9A15C;--brass-2:#D9B978;--brass-text:#D9B978;--brass-soft:#2B2312;--brass-line:#4A3C1D;
  --on-brass:#1A1204;

  --green:#4FB48D;--green-bg:#122A22;
  --amber:#D2A544;--amber-bg:#2B2312;
  --red:#E08585;--red-2:#EFA3A3;--red-bg:#2C1817;--red-line:#4E2C2B;
  --blue:#6FA8DA;--blue-bg:#132433;

  --scrim:rgba(0,0,0,.66);
  --shadow:0 1px 2px rgba(0,0,0,.35),0 3px 12px rgba(0,0,0,.30);
  --shadow-lg:0 14px 44px rgba(0,0,0,.60);

  /* solid brand surfaces need a darker fill than the text tint */
  --navy:#1E635A;--navy-2:#26766B;
  --accent:var(--brass);--accent-dark:var(--brass-text);

  color-scheme:dark;
}
html,body{background:var(--bg)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
*{box-sizing:border-box}html,body{margin:0;height:100%}
::selection{background:var(--brand-soft);color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
body{background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
#app{display:flex;min-height:100vh}
.sidebar{width:236px;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-text);border-right:1px solid var(--sidebar-line);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:11px;padding:22px 18px 6px}
.brand-mark{width:24px;height:24px;flex-shrink:0;fill:#fff}
.brand-mark .base{fill:var(--brass-2)}
.brand-name{font-family:var(--font-serif);font-size:19px;font-weight:400;letter-spacing:.13em;text-transform:uppercase;color:#fff;line-height:1}
.brand-tag{padding:0 18px 16px;font-size:10.5px;letter-spacing:.08em;color:var(--sidebar-dim);text-transform:uppercase;font-weight:600}
.nav{display:flex;flex-direction:column;padding:8px 12px;gap:2px}
.nav a{position:relative;padding:10px 14px;border-radius:var(--radius-sm);color:var(--sidebar-dim);font-weight:500;transition:background .12s,color .12s;cursor:pointer}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{background:rgba(255,255,255,.11);color:#fff;font-weight:600}
.nav a.active::before{content:'';position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brass-2)}
.sidebar-footer{margin-top:auto;padding:12px 16px 14px;border-top:1px solid var(--sidebar-line)}
.theme-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-bottom:11px;margin-bottom:11px;border-bottom:1px solid var(--sidebar-line)}
.theme-lbl{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--sidebar-dim)}
.theme-btn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);color:var(--sidebar-text);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:4px 11px;font-size:11.5px;font-weight:600;font-family:inherit;cursor:pointer;transition:background .12s}
.theme-btn:hover{background:rgba(255,255,255,.17);color:#fff}
.theme-btn svg{width:12px;height:12px;fill:currentColor}
.file-status{font-size:12px;margin-bottom:10px}
.file-line{display:flex;align-items:center;gap:7px;color:var(--sidebar-dim)}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#8ea0b8}
.dot.saved{background:#5FBF9C}.dot.saving{background:var(--brass-2)}.dot.error{background:#E08585}.dot.local{background:var(--sidebar-dim)}
.file-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-sub{color:var(--sidebar-dim);opacity:.8;font-size:11px;margin-top:3px;line-height:1.35}
.file-btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.mini-btn{background:rgba(255,255,255,.08);color:var(--sidebar-text);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:5px 9px;font-size:11.5px;font-weight:600;cursor:pointer;font-family:inherit}
.mini-btn:hover{background:rgba(255,255,255,.16)}
.content{flex:1;padding:30px 40px 60px;max-width:1200px;width:100%}
.loading{color:var(--muted);padding:40px 0}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:24px}
.page-head h1{margin:0;font-size:26px;letter-spacing:-.02em;font-weight:600}
.page-sub{margin:4px 0 0;color:var(--text-soft)}
.page-actions{display:flex;gap:10px;flex-shrink:0}
.back-link{color:var(--text-soft);font-size:13px;display:inline-block;margin-bottom:6px;cursor:pointer}
.back-link:hover{color:var(--brand)}
.btn{border:1px solid transparent;border-radius:var(--radius-sm);padding:9px 16px;font-size:14px;font-weight:600;letter-spacing:.01em;cursor:pointer;font-family:inherit;transition:background .12s,border-color .12s;white-space:nowrap}
.btn-sm{padding:6px 12px;font-size:13px}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-2)}
.btn-primary:disabled{opacity:.6;cursor:default}
.btn-ghost{background:var(--surface);color:var(--text);border-color:var(--border-strong)}.btn-ghost:hover{background:var(--surface-2)}
.btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:var(--red-2)}
.btn-danger-ghost{background:var(--surface);color:var(--red);border-color:var(--red-line)}.btn-danger-ghost:hover{background:var(--red-bg)}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px}
.stat-row.compact{grid-template-columns:repeat(3,1fr);margin-bottom:16px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow)}
.stat-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700}
.stat-value{font-size:26px;font-weight:700;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat-sub{font-size:12.5px;color:var(--text-soft);margin-top:3px}
.stat-accent .stat-value{color:var(--accent-dark)}.stat-success .stat-value{color:var(--green)}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:18px}
.panel-title{margin:0 0 14px;font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:700}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
.section-head{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.section-head h2{margin:0;font-size:18px}
.detail-grid{display:grid;grid-template-columns:150px 1fr;gap:8px 16px;margin:0}
.detail-grid dt{color:var(--muted);font-size:13px}.detail-grid dd{margin:0;font-size:14px}
.notes-block{margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.notes-block h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;color:var(--muted)}
.notes-block p{margin:0;white-space:pre-wrap;color:var(--text-soft)}
.pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill-default{background:var(--surface-2);color:var(--text-soft);border:1px solid var(--border)}.pill-muted{background:var(--surface-2);color:var(--muted);border:1px solid var(--border)}
.pill-info{background:var(--blue-bg);color:var(--blue)}.pill-success{background:var(--green-bg);color:var(--green)}
.pill-warn{background:var(--amber-bg);color:var(--amber)}.pill-danger{background:var(--red-bg);color:var(--red)}
.tag{display:inline-block;padding:2px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border);font-size:12px;color:var(--text-soft)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.offering-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s,box-shadow .12s,border-color .12s}
.offering-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--border-strong)}
.oc-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.oc-name{margin:0;font-size:17px}.oc-issuer{color:var(--text-soft);font-size:13px;margin-top:2px}
.oc-tags{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.oc-escrow{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.oc-escrow-val{font-size:20px;font-weight:700;letter-spacing:-.4px}.oc-escrow-lbl{color:var(--muted);font-size:13px}
.oc-minraise{font-size:12.5px;font-weight:600;color:var(--amber)}.oc-minraise.met{color:var(--green)}
.oc-foot{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--text-soft)}
.urgent-text{color:var(--red)!important;font-weight:600}
.progress{height:7px;background:var(--border);border-radius:20px;overflow:hidden;margin:8px 0}
.progress-fill{height:100%;background:var(--accent);border-radius:20px;transition:width .3s}
.progress-fill.met{background:var(--green)}
.progress-inline{display:flex;align-items:center;gap:12px}.progress-inline .progress{flex:1;margin:0}
.progress-label{font-size:13px;color:var(--text-soft);white-space:nowrap}
.closing-list,.mini-list{list-style:none;margin:0;padding:0}
.closing-item,.mini-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);cursor:pointer;transition:background .1s}
.closing-item:hover,.mini-item:hover{background:var(--surface-2)}
.closing-item+.closing-item,.mini-item+.mini-item{border-top:1px solid var(--border)}
.closing-item.urgent{background:var(--brass-soft)}
.closing-main,.mini-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.closing-name,.mini-name{font-weight:600}.closing-date,.mini-meta{font-size:12.5px;color:var(--text-soft)}
.mini-right{display:flex;align-items:center;gap:10px}.mini-escrow{font-variant-numeric:tabular-nums;font-weight:600}
.offering-summary-row{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:-8px 0 20px;padding-bottom:18px;border-bottom:1px solid var(--border)}
.osr-item{font-size:14px}.muted-text{color:var(--muted)}
.readiness-figures{margin-bottom:4px}.readiness-note{margin-top:10px}
.tab-bar{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:22px;flex-wrap:wrap}
.tab{background:none;border:none;padding:10px 16px;font-size:14px;font-weight:600;color:var(--text-soft);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;font-family:inherit}
.tab:hover{color:var(--brand)}.tab.active{color:var(--brand);border-bottom-color:var(--brass)}
.data-table{width:100%;border-collapse:collapse;font-size:14px}
.data-table th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);font-weight:700;padding:9px 12px;border-bottom:1px solid var(--border-strong)}
.data-table td{padding:12px;border-bottom:1px solid var(--border);vertical-align:middle}
.data-table tbody tr:last-child td{border-bottom:none}
.data-table .num{text-align:right;font-variant-numeric:tabular-nums}
.data-table.hover tbody tr{cursor:pointer}.data-table.hover tbody tr:hover{background:var(--surface-2)}
.cell-sub{font-size:12px;color:var(--muted);margin-top:2px}
.num.pos{color:var(--green);font-weight:600}.num.neg{color:var(--red);font-weight:600}
.link{color:var(--blue);font-weight:600;cursor:pointer}.link:hover{text-decoration:underline}
.row-actions{text-align:right;white-space:nowrap}
.ic{display:inline-flex;align-items:center;justify-content:center}
.ic svg{width:1em;height:1em;fill:currentColor;display:block}
.btn .ic{margin-right:7px;font-size:14px}
.icon-btn{background:none;border:none;cursor:pointer;font-size:15px;padding:5px 6px;border-radius:5px;opacity:.6;color:var(--text-soft);line-height:0}
.icon-btn.danger{color:var(--red)}
.icon-btn:hover{opacity:1;background:var(--surface-2)}.icon-btn.danger:hover{opacity:1;background:var(--red-bg)}
.clear-toggle{border:1px solid var(--border-strong);background:var(--surface);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--text-soft)}
.clear-toggle.on{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.checklist{list-style:none;margin:0;padding:0}
.check-item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 4px;border-bottom:1px solid var(--border)}
.check-label{display:flex;align-items:center;gap:11px;cursor:pointer;flex:1}
.check-label input{width:17px;height:17px;accent-color:var(--green);cursor:pointer}
.check-item.done .check-text{text-decoration:line-through;color:var(--muted)}
.check-right{display:flex;align-items:center;gap:10px}.check-due{font-size:12px;color:var(--text-soft)}
.count-label{font-size:13px;color:var(--text-soft);font-weight:600}
.add-task-row{display:flex;gap:8px;margin-top:16px;align-items:center}
.inline-input{padding:8px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text)}
.inline-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
.inline-input.date{width:150px}.add-task-row .inline-input:first-child{flex:1}
.recon-form{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-top:14px}
.recon-field{display:flex;flex-direction:column;gap:5px}.recon-field.grow{flex:1;min-width:160px}
.recon-field label{font-size:12px;color:var(--muted);font-weight:600}
.recon-field .inline-input,.recon-field .money-wrap{width:100%}
.closing-panel{margin-bottom:14px}
.closing-chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:3px 6px 3px 11px;font-size:12.5px;font-weight:600}
.chip-amt{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1px 8px;font-weight:600;color:var(--text-soft);font-variant-numeric:tabular-nums}
.closing-picklist{max-height:230px;overflow:auto;border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px;margin-top:4px}
.pick-row{display:flex;align-items:center;gap:11px;padding:7px 9px;border-radius:6px;cursor:pointer}
.pick-row:hover{background:var(--surface-2)}
.pick-row.pick-all{font-weight:700;border-bottom:1px solid var(--border);border-radius:0;margin-bottom:2px}
.pick-row input[type=checkbox]{width:16px;height:16px;accent-color:var(--navy);cursor:pointer}
.pick-name{flex:1;display:flex;align-items:center;gap:8px}
.pick-status{font-size:11px;color:var(--muted);font-weight:600;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:0 7px}
.pick-amt{font-variant-numeric:tabular-nums;color:var(--text-soft)}
.toolbar{margin-bottom:14px}
.search-input{width:100%;max-width:340px;padding:9px 13px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text)}
.search-input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:14px}
.error-state{text-align:center;padding:60px 20px}.error-state h2{color:var(--red)}
.welcome{max-width:640px}
.welcome .panel h2{margin-top:0}
.welcome ul{color:var(--text-soft);padding-left:20px}
.welcome-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.browser-warn{background:var(--amber-bg);color:var(--amber);border:1px solid var(--brass-line);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;margin-bottom:16px}
#modal-root{display:none}#modal-root.open{display:block}
.modal-backdrop{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding:48px 20px;overflow-y:auto;z-index:100}
.modal{background:var(--surface);border-radius:12px;width:100%;max-width:480px;box-shadow:var(--shadow-lg);animation:pop .14s ease-out}
.modal-wide{max-width:680px}
@keyframes pop{from{transform:translateY(8px) scale(.99);opacity:0}to{transform:none;opacity:1}}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--border)}
.modal-head h2{margin:0;font-size:18px}
.modal-close{background:none;border:none;font-size:16px;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:5px}
.modal-close:hover{background:var(--surface-2);color:var(--text)}
.modal-body{padding:20px 22px}.confirm-text{margin:0 0 8px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}
.form-row{display:flex;flex-direction:column;gap:5px;grid-column:1/-1}
.form-row.half{grid-column:span 1}
.form-row label{font-size:13px;font-weight:600;color:var(--text-soft)}.form-row label .req{color:var(--red)}
.form-row input,.form-row textarea,.form-row select{padding:9px 11px;border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:var(--surface);color:var(--text);width:100%}

<script type="module">
/* ============================================================================
   Muniment — the system of record for private offerings.
   Single-file, no-install web app. Formerly CapitalVault.
   Data is held in memory, mirrored to localStorage (crash safety), and
   autosaved to a real file you choose via the File System Access API.
   ========================================================================== */

/* ---- Constants ---------------------------------------------------------- */
const OFFERING_STATUSES=['Drafting','Filed','Open','Closing','Closed','Terminated'];
const OFFERING_STATUS_KIND={Drafting:'default',Filed:'info',Open:'success',Closing:'warn',Closed:'muted',Terminated:'danger'};
const EXEMPTIONS=['Reg D 506(b)','Reg D 506(c)','Reg D 504','Reg A+ Tier 1','Reg A+ Tier 2','Reg CF','Reg S','Section 4(a)(2)','Intrastate','Other'];
const SECURITY_TYPES=['Common Equity','Preferred Equity','LLC Units','LP Interests','Promissory Note','Convertible Note','SAFE','Revenue Share','Other'];
const ENTITY_TYPES=['Individual','Entity','Trust','Joint','IRA / Retirement'];
// Types whose name is entered as first / middle / last (a natural person).
const PERSON_TYPES=['Individual','Joint','IRA / Retirement'];
// Order the Investors contact book groups appear in.
const ENTITY_TYPE_ORDER=['Individual','Joint','IRA / Retirement','Trust','Entity'];
function isPersonType(t){return PERSON_TYPES.includes(t);}
const ACCREDITED_STATUSES=['Unknown','Self-certified','Verified','Not accredited'];
const ACCREDITED_KIND={Unknown:'muted','Self-certified':'info',Verified:'success','Not accredited':'danger'};
const SUBSCRIPTION_STATUSES=['Prospect','Sub sent','Sub signed','Funded','Closed','Withdrawn'];
const SUBSCRIPTION_KIND={Prospect:'muted','Sub sent':'info','Sub signed':'warn',Funded:'success',Closed:'success',Withdrawn:'danger'};
const TXN_TYPES=[{value:'deposit',label:'Deposit — investor to escrow'},{value:'release',label:'Release — escrow to issuer'},{value:'refund',label:'Refund — escrow to investor'},{value:'fee',label:'Fee or expense — out of escrow'}];
const TXN_KIND={deposit:'success',release:'info',refund:'warn',fee:'muted'};
const PAYMENT_METHODS=['Wire','Check','ACH','Other'];
const DEFAULT_CHECKLIST=['Engagement letter signed','Draft Private Placement Memorandum','Draft subscription agreement','Prepare accredited-investor questionnaire','Set up escrow account with escrow agent','Blue sky / state notice filings','File Form D with the SEC','Distribute offering documents to investors','Collect signed subscription agreements','Verify accredited-investor status','Confirm minimum raise satisfied','Hold closing','Release escrow funds to issuer','Post-closing filings / amendments'];

/* ---- Icons — drawn, never typed. Currency of the brand: no emoji. ------- */
const ICONS={
  trash:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.2 1.5h3.6a.7.7 0 0 1 .7.7v.9h3a.65.65 0 0 1 0 1.3h-.55l-.62 8.4a2 2 0 0 1-2 1.85H5.67a2 2 0 0 1-2-1.85l-.62-8.4H2.5a.65.65 0 0 1 0-1.3h3v-.9a.7.7 0 0 1 .7-.7Zm.6 1.6h2.4v-.3H6.8v.3ZM4.36 4.4l.6 8.3a.7.7 0 0 0 .71.65h4.66a.7.7 0 0 0 .7-.65l.61-8.3H4.36Zm2.29 1.5a.6.6 0 0 1 .6.6v5a.6.6 0 1 1-1.2 0v-5a.6.6 0 0 1 .6-.6Zm2.7 0a.6.6 0 0 1 .6.6v5a.6.6 0 1 1-1.2 0v-5a.6.6 0 0 1 .6-.6Z"/></svg>',
  print:'<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 1.6h7a.7.7 0 0 1 .7.7v2.2h1.1a1.7 1.7 0 0 1 1.7 1.7v3.6a1.7 1.7 0 0 1-1.7 1.7h-1.1v2a.7.7 0 0 1-.7.7h-7a.7.7 0 0 1-.7-.7v-2H2.7A1.7 1.7 0 0 1 1 9.8V6.2a1.7 1.7 0 0 1 1.7-1.7h1.1V2.3a.7.7 0 0 1 .7-.7Zm.7 2.9h5.6V2.9H5.2v1.6Zm0 8.5h5.6V9.6H5.2V13Zm7-6.6a.75.75 0 1 0 0 1.5.75.75 0 0 0 0-1.5Z"/></svg>'
};

/* ---- DOM + format helpers ----------------------------------------------- */
function el(tag,props={},...children){
  const node=document.createElement(tag);
  for(const[k,v]of Object.entries(props||{})){
    if(v===null||v===undefined||v===false)continue;
    if(k==='class')node.className=v;
    else if(k==='html')node.innerHTML=v;
    else if(k==='dataset')Object.assign(node.dataset,v);
    else if(k.startsWith('on')&&typeof v==='function')node.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k in node&&k!=='list'){try{node[k]=v;}catch{node.setAttribute(k,v);}}
    else node.setAttribute(k,v);
  }
  for(const c of children.flat()){
    if(c===null||c===undefined||c===false)continue;
    // '@icon:name' renders a drawn glyph — the brand forbids emoji in the product.
    if(typeof c==='string'&&c.startsWith('@icon:')){
      const svg=ICONS[c.slice(6)];
      if(svg){const w=document.createElement('span');w.className='ic';w.innerHTML=svg;node.appendChild(w);continue;}
    }
    node.appendChild(c instanceof Node?c:document.createTextNode(String(c)));
  }
  return node;
}
function clear(n){while(n.firstChild)n.removeChild(n.firstChild);return n;}
const usd=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const usd0=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0});
// U+2212 MINUS SIGN, not a hyphen: it is figure-width and aligns in a column.
function money(c){return c===null||c===undefined?'—':usd.format(c/100).replace('-','\u2212');}
function moneyShort(c){return c===null||c===undefined?'—':usd0.format(c/100).replace('-','\u2212');}
function centsToInput(c){return c===null||c===undefined?'':(c/100).toFixed(2);}
function fmtPct(n){if(n===null||n===undefined||n==='')return'—';const v=Number(n);return isFinite(v)?(v%1===0?v:+v.toFixed(6))+'%':'—';}
function fmtDate(s){if(!s)return'—';const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});}
function relDays(d){if(d===null||d===undefined)return'';if(d===0)return'today';return d>0?`in ${d} day${d===1?'':'s'}`:`${-d} day${d===-1?'':'s'} ago`;}
function pill(t,k='default'){return el('span',{class:`pill pill-${k}`},t);}
function toast(msg,kind='info'){
  const root=document.getElementById('toast-root');
  const t=el('div',{class:`toast toast-${kind}`},msg);root.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300);},3200);
}
function dollarsToCents(v){if(v===null||v===undefined||v==='')return null;const n=typeof v==='number'?v:Number(String(v).replace(/[$,\s]/g,''));return isFinite(n)?Math.round(n*100):null;}
function str(v){if(v===null||v===undefined)return null;const s=String(v).trim();return s===''?null:s;}
function numOr(v,d=null){if(v===null||v===undefined||v==='')return d;const n=Number(v);return isFinite(n)?n:d;}
function nowISO(){return new Date().toISOString();}
/* ---- Investor name helpers ---------------------------------------------- */
// Full display name, e.g. "Jane Q. Public" or the entity name.
function investorDisplayName(i){
  if(!i)return '—';
  if(isPersonType(i.entity_type)){
    const parts=[i.first_name,i.middle_name,i.last_name].filter(Boolean);
    if(parts.length)return parts.join(' ');
  }
  return i.name||[i.first_name,i.last_name].filter(Boolean).join(' ')||'(unnamed)';
}
// Listing name for individuals: "Last, First M." (sorts naturally by last name).
function investorListName(i){
  if(isPersonType(i.entity_type)&&(i.last_name||i.first_name)){
    const mi=i.middle_name?` ${String(i.middle_name).trim()[0]}.`:'';
    const head=i.last_name||'';const tail=[i.first_name,mi].filter(Boolean).join('').trim();
    return head&&tail?`${head}, ${tail}`:(head||investorDisplayName(i));
  }
  return investorDisplayName(i);
}
// Sort key: individuals by last, first, middle; others by name.
function investorSortKey(i){
  if(isPersonType(i.entity_type))
    return [i.last_name||i.name||'',i.first_name||'',i.middle_name||''].map(s=>String(s).toLowerCase()).join('\u0000');
  return String(i.name||'').toLowerCase();
}
// Mask a stored SSN/EIN for display (show last 4 only).
function fmtTaxId(v){if(!v)return'—';const s=String(v).trim();if(s.length<=4)return s;return '•••'+s.slice(-4);}

/* ---- Components ---------------------------------------------------------- */
function pageHeader(title,{subtitle,actions,back}={}){
  return el('header',{class:'page-head'},
    el('div',{},
      back?el('a',{class:'back-link',onclick:()=>location.hash=back.href},'← '+back.label):null,
      el('h1',{},title),
      subtitle?el('p',{class:'page-sub'},subtitle):null),
    actions?el('div',{class:'page-actions'},...actions):null);
}
function statCard(label,value,{sub,kind}={}){
  return el('div',{class:`stat-card ${kind?'stat-'+kind:''}`},
    el('div',{class:'stat-label'},label),el('div',{class:'stat-value'},value),
    sub?el('div',{class:'stat-sub'},sub):null);
}
function progressBar(pct,{met=false}={}){
  const c=Math.max(0,Math.min(100,pct??0));
  return el('div',{class:'progress'},el('div',{class:`progress-fill ${met?'met':''}`,style:`width:${c}%`}));
}
function emptyState(msg,actionNode){return el('div',{class:'empty'},el('p',{},msg),actionNode||null);}
function detailGrid(pairs){
  return el('dl',{class:'detail-grid'},...pairs.filter(Boolean).flatMap(([k,v])=>[el('dt',{},k),el('dd',{},v??'—')]));
}

/* ---- Modal + forms ------------------------------------------------------ */
let escHandler=null;
function closeModal(){
  const root=document.getElementById('modal-root');clear(root);root.classList.remove('open');
  if(escHandler){document.removeEventListener('keydown',escHandler);escHandler=null;}
}
function openShell(title,contentNode,{wide=false}={}){
  const root=document.getElementById('modal-root');clear(root);
  const dialog=el('div',{class:`modal ${wide?'modal-wide':''}`},
    el('div',{class:'modal-head'},el('h2',{},title),el('button',{class:'modal-close',onclick:closeModal},'✕')),
    contentNode);
  root.appendChild(el('div',{class:'modal-backdrop',onclick:e=>{if(e.target===e.currentTarget)closeModal();}},dialog));
  root.classList.add('open');
  escHandler=e=>{if(e.key==='Escape')closeModal();};document.addEventListener('keydown',escHandler);
  return dialog;
}
function confirmDialog(message,{danger=false,confirmLabel='Confirm'}={}){
  return new Promise(resolve=>{
    const body=el('div',{class:'modal-body'},
      el('p',{class:'confirm-text'},message),
      el('div',{class:'modal-actions'},
        el('button',{class:'btn btn-ghost',onclick:()=>{closeModal();resolve(false);}},'Cancel'),
        el('button',{class:`btn ${danger?'btn-danger':'btn-primary'}`,onclick:()=>{closeModal();resolve(true);}},confirmLabel)));
    openShell(danger?'Please confirm':'Confirm',body);
  });
}
// Fields support: type text/textarea/select/checkbox/money/number/date/email/tel,
// plus type:'custom' (f.build(value) → {node, get value}) for widgets like the
// investor typeahead, an optional f.showIf(values)→bool to hide fields, an
// f.onChange(values,api) hook, and f.section headers to group fields.
function formModal({title,fields,values={},submitLabel='Save',onSubmit,wide=false}){
  const inputs={};   // name → element or custom controller ({node, value})
  const rowEls={};   // name → the .form-row wrapper (for showIf)
  const errorBox=el('div',{class:'form-error',style:'display:none'});
  const rows=[];
  for(const f of fields){
    if(f.type==='section'){rows.push(el('div',{class:'form-section-head'},f.label));continue;}
    let input,rowEl;const common={id:`f_${f.name}`,name:f.name,placeholder:f.placeholder||''};
    if(f.type==='custom'){
      const ctrl=f.build(values[f.name]);inputs[f.name]=ctrl;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{},f.label,f.required?el('span',{class:'req'},' *'):null),
        ctrl.node,f.help?el('div',{class:'field-help'},f.help):null);
    }else if(f.type==='checkbox'){
      input=el('input',{id:`f_${f.name}`,name:f.name,type:'checkbox',checked:!!values[f.name]});
      inputs[f.name]=input;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{class:'form-check'},input,el('span',{},f.label),
          f.help?el('span',{class:'field-help',style:'margin-left:6px'},f.help):null));
    }else{
      if(f.type==='textarea')input=el('textarea',{...common,rows:f.rows||3},values[f.name]??'');
      else if(f.type==='select')input=el('select',common,...(f.options||[]).map(o=>{
        const val=typeof o==='object'?o.value:o,label=typeof o==='object'?o.label:o;
        return el('option',{value:val,selected:String(values[f.name]??'')===String(val)},label);
      }));
      else{
        const type=f.type==='money'?'text':(f.type||'text');
        input=el('input',{...common,type,value:values[f.name]??'',min:f.min,step:f.step,
          inputmode:f.type==='money'||f.type==='number'?'decimal':undefined});
        if(f.type==='money')input.classList.add('money-input');
        if(f.datalist){const dlid=`dl_${f.name}`;input.setAttribute('list',dlid);
          input.__dl=el('datalist',{id:dlid},...f.datalist.map(v=>el('option',{value:v})));}
      }
      inputs[f.name]=input;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{for:`f_${f.name}`},f.label,f.required?el('span',{class:'req'},' *'):null),
        f.type==='money'?el('div',{class:'money-wrap'},el('span',{class:'money-prefix'},'$'),input):input,
        input.__dl||null,
        f.help?el('div',{class:'field-help'},f.help):null);
    }
    rowEls[f.name]=rowEl;rows.push(rowEl);
  }
  function readVal(f){const inp=inputs[f.name];if(!inp)return null;
    if(f.type==='checkbox')return inp.checked;
    let v=inp.value;if(typeof v==='string')v=v.trim();return v===''?null:v;}
  function currentValues(){const v={};for(const f of fields){if(f.type==='section')continue;v[f.name]=readVal(f);}return v;}
  function visible(f){return !f.showIf||f.showIf(currentValues());}
  function reflow(){for(const f of fields){if(f.type==='section'||!rowEls[f.name])continue;
    if(f.showIf)rowEls[f.name].style.display=f.showIf(currentValues())?'':'none';}
    for(const f of fields){if(f.onChange)f.onChange(currentValues(),{setValue,getValue});}}
  function getValue(name){const f=fields.find(x=>x.name===name);return f?readVal(f):null;}
  function setValue(name,val){const inp=inputs[name];if(!inp)return;
    const f=fields.find(x=>x.name===name);
    if(f&&f.type==='checkbox')inp.checked=!!val;else if('value'in inp)try{inp.value=val==null?'':val;}catch{}}
  for(const f of fields){const inp=inputs[f.name];if(!inp||f.type==='custom')continue;
    const node=inp;node.addEventListener('change',reflow);
    if(node.tagName==='INPUT'||node.tagName==='TEXTAREA')node.addEventListener('input',reflow);}
  const submitBtn=el('button',{class:'btn btn-primary',type:'submit'},submitLabel);
  const form=el('form',{class:'modal-body form-grid',onsubmit:async e=>{
    e.preventDefault();errorBox.style.display='none';
    const collected={};
    for(const f of fields){if(f.type==='section')continue;collected[f.name]=readVal(f);}
    const missing=fields.find(f=>f.required&&visible(f)&&!collected[f.name]);
    if(missing){errorBox.textContent=`${missing.label} is required.`;errorBox.style.display='block';
      const mi=inputs[missing.name];if(mi&&mi.focus)mi.focus();else if(mi&&mi.node)(mi.node.querySelector('input,select,textarea')||{focus(){}}).focus();return;}
    submitBtn.disabled=true;submitBtn.textContent='Saving…';
    try{await onSubmit(collected);closeModal();}
    catch(err){errorBox.textContent=err.message||'Something went wrong.';errorBox.style.display='block';submitBtn.disabled=false;submitBtn.textContent=submitLabel;}
  }},...rows,errorBox,
    el('div',{class:'modal-actions'},
      el('button',{class:'btn btn-ghost',type:'button',onclick:closeModal},'Cancel'),submitBtn));
  openShell(title,form,{wide});
  reflow();
  const firstField=fields.find(f=>f.type!=='section');
  const first=firstField&&inputs[firstField.name];
  if(first)setTimeout(()=>{if(first.focus)first.focus();else if(first.node){const inp=first.node.querySelector('input,select,textarea');if(inp)inp.focus();}},50);
}

/* ---- Investor typeahead (search-as-you-type) ---------------------------- */
// Returns a controller with .node (to place in a form) and .value (investor id
// as a string, or '' if nothing chosen). Used wherever you pick an investor.
function investorPicker(investors,selectedId){
  const byId=new Map(investors.map(i=>[i.id,i]));
  let chosen=selectedId!=null&&byId.has(Number(selectedId))?Number(selectedId):'';
  const input=el('input',{type:'text',class:'ac-input',placeholder:'Type a name to search…',autocomplete:'off'});
  const menu=el('div',{class:'ac-menu',style:'display:none'});
  const node=el('div',{class:'ac-wrap'},input,menu);
  if(chosen!=='')input.value=investorDisplayName(byId.get(chosen));
  function hide(){menu.style.display='none';active=-1;}
  let active=-1,shown=[];
  function render(items){shown=items.slice(0,12);clear(menu);
    if(!shown.length){menu.appendChild(el('div',{class:'ac-empty'},'No match — add them from the Investors tab.'));menu.style.display='block';return;}
    shown.forEach((i,idx)=>menu.appendChild(el('div',{class:'ac-item'+(idx===active?' active':''),
      onmousedown:e=>{e.preventDefault();pick(i);}},
      el('span',{class:'ac-name'},investorListName(i)),el('span',{class:'ac-meta'},i.entity_type||''))));
    menu.style.display='block';}
  function pick(i){chosen=i.id;input.value=investorDisplayName(i);hide();}
  function filter(){const q=input.value.trim().toLowerCase();
    if(!q)return investors.slice().sort((a,b)=>investorSortKey(a).localeCompare(investorSortKey(b)));
    return investors.filter(i=>investorDisplayName(i).toLowerCase().includes(q)||investorListName(i).toLowerCase().includes(q)||String(i.tax_id||'').includes(q))
      .sort((a,b)=>investorSortKey(a).localeCompare(investorSortKey(b)));}
  input.addEventListener('input',()=>{chosen='';active=-1;render(filter());});
  input.addEventListener('focus',()=>render(filter()));
  input.addEventListener('blur',()=>setTimeout(hide,160));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();if(menu.style.display==='none')render(filter());active=Math.min(active+1,shown.length-1);render(shown);}
    else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0);render(shown);}
    else if(e.key==='Enter'){if(menu.style.display!=='none'&&shown[active]){e.preventDefault();pick(shown[active]);}}
    else if(e.key==='Escape'){hide();}});
  return {node,get value(){return chosen===''?'':String(chosen);}};
}

   STORE — in-memory data + persistence to file/localStorage
   ========================================================================== */
const LS_KEY='muniment:data';
// Data saved under earlier names, newest first. Migrated on load; nothing is lost in the rename.
const LS_KEYS_OLD=['capitalvault:data','offeringbook:data'];
const THEME_KEY='muniment:theme';
const COLLECTIONS=['offerings','investors','subscriptions','escrow','tasks','reconciliations','closings','certificates'];
const EMPTY=()=>({meta:{version:1,app:'Muniment'},
  seq:{offerings:0,investors:0,subscriptions:0,escrow:0,tasks:0,reconciliations:0,closings:0,certificates:0},
  offerings:[],investors:[],subscriptions:[],escrow:[],tasks:[],reconciliations:[],closings:[],certificates:[]});
let db=EMPTY();
let fileHandle=null;
let fileName=null;

function normalize(obj){
  const base=EMPTY();
  const out={...base,...obj,meta:{...base.meta,...(obj.meta||{})},seq:{...base.seq,...(obj.seq||{})}};
  for(const k of COLLECTIONS)
    if(!Array.isArray(out[k]))out[k]=[];
  // keep seq counters ahead of any existing ids
  for(const k of COLLECTIONS){
    const maxId=out[k].reduce((m,r)=>Math.max(m,r.id||0),0);
    out.seq[k]=Math.max(out.seq[k]||0,maxId);
  }
  return out;
}
function parseDB(text){
  const obj=JSON.parse(text);
  if(typeof obj!=='object'||obj===null)throw new Error('Not a valid Muniment data file');
  return normalize(obj);
}
function nextId(kind){db.seq[kind]=(db.seq[kind]||0)+1;return db.seq[kind];}

/* Persistence */
let saveTimer=null;
function serialize(){return JSON.stringify(db,null,2);}
async function persist(){
  try{localStorage.setItem(LS_KEY,serialize());}catch{}
  if(fileHandle){
    setSaveState('saving');
    clearTimeout(saveTimer);
    // small debounce to coalesce rapid edits, then write
    await new Promise(res=>{saveTimer=setTimeout(res,250);});
    try{
      const w=await fileHandle.createWritable();
      await w.write(new Blob([serialize()],{type:'application/json'}));
      await w.close();
      setSaveState('saved');
    }catch(e){setSaveState('error');toast('Could not save to your data file: '+e.message,'error');}
  }else{
    setSaveState('local');
  }
}

/* IndexedDB (just to remember the chosen file between sessions) */
// Internal IndexedDB name kept unchanged across the rename so a previously

function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('offeringbook',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){try{const d=await idbOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}catch{}}
async function idbGet(k){try{const d=await idbOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readonly');const rq=t.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}catch{return null;}}

/* ---- Computed summaries ------------------------------------------------- */
const SIGN={deposit:1,release:-1,refund:-1,fee:-1};
function escrowSummary(offeringId){
  const rows=db.escrow.filter(e=>e.offering_id===offeringId);
  const by={deposit:0,release:0,refund:0,fee:0},cl={deposit:0,release:0,refund:0,fee:0};
  for(const r of rows){if(r.txn_type in by){by[r.txn_type]+=r.amount_cents;if(r.cleared)cl[r.txn_type]+=r.amount_cents;}}
  const book=by.deposit*SIGN.deposit+by.release*SIGN.release+by.refund*SIGN.refund+by.fee*SIGN.fee;
  const cleared=cl.deposit*SIGN.deposit+cl.release*SIGN.release+cl.refund*SIGN.refund+cl.fee*SIGN.fee;
  return{deposits:by.deposit,releases:by.release,refunds:by.refund,fees:by.fee,clearedDeposits:cl.deposit,
    bookBalance:book,clearedBalance:cleared,pendingBalance:book-cleared};
}
function subscriptionSummary(offeringId){
  const subs=db.subscriptions.filter(s=>s.offering_id===offeringId);
  const committed=subs.reduce((a,s)=>a+(s.amount_committed_cents||0),0);
  const signed=subs.filter(s=>['Sub signed','Funded','Closed'].includes(s.status)).reduce((a,s)=>a+(s.amount_committed_cents||0),0);
  return{investorCount:subs.length,committed,signedCommitted:signed};
}
function daysUntil(dateStr,today=new Date()){
  if(!dateStr)return null;const t=new Date(dateStr+'T00:00:00');if(isNaN(t))return null;
  const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  return Math.round((t-t0)/86400000);
}
function offeringSummary(o){
  const escrow=escrowSummary(o.id),subs=subscriptionSummary(o.id);
  const targetMin=o.target_min_cents||0;
  const minRaiseMet=targetMin>0&&escrow.clearedDeposits>=targetMin;
  const minRaisePct=targetMin>0?Math.min(100,Math.round((escrow.clearedDeposits/targetMin)*100)):null;
  const tasks=db.tasks.filter(t=>t.offering_id===o.id);
  const closings=db.closings.filter(c=>c.offering_id===o.id);
  const passCosts=db.subscriptions.filter(s=>s.offering_id===o.id).reduce((a,s)=>a+(s.costs_cents||0),0);
  return{escrow,subscriptions:subs,minRaiseMet,minRaisePct,daysToFinalClose:daysUntil(o.final_close_date),
    tasksTotal:tasks.length,tasksDone:tasks.filter(t=>t.done).length,passThroughCosts:passCosts,
    closingsCount:closings.length,totalReleased:closings.reduce((a,c)=>a+(c.amount_released_cents||0),0)};
}

/* ---- Certificate computation (% interest, accrued return) --------------- */
// Whole days from a 'YYYY-MM-DD' date to today (never negative). Used for accrual.
function daysSince(dateStr){
  if(!dateStr)return null;const t=new Date(dateStr+'T00:00:00');if(isNaN(t))return null;
  const now=new Date();const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.max(0,Math.round((t0-t)/86400000));
}
// The default class that cash investors go into (first non-sponsor class).
function defaultInvestedClass(o){const cls=(o&&Array.isArray(o.classes)?o.classes:[]).filter(c=>!c.sponsor);return cls.length?cls[0].name:null;}
// Enrich an offering's certificates with computed % of class, total % ownership
// and accrued return to date. Manual per-certificate values always override.
function computeCertificates(offeringId){
  const o=db.offerings.find(x=>x.id===offeringId);
  const classes=(o&&Array.isArray(o.classes))?o.classes:[];
  const classByName=new Map(classes.map(c=>[c.name,c]));
  const raw=db.certificates.filter(c=>c.offering_id===offeringId).map(c=>{
    const i=db.investors.find(x=>x.id===c.investor_id);
    return{...c,holder_name:i?investorDisplayName(i):(c.holder_name||null)};});
  const classCapital={},classCount={};let totalCapital=0;
  for(const c of raw){const k=c.class_name||'Unclassified';
    classCapital[k]=(classCapital[k]||0)+(c.capital_cents||0);classCount[k]=(classCount[k]||0)+1;totalCapital+=(c.capital_cents||0);}
  const anyClassTotals=classes.some(c=>c.total_percent!=null);
  const enriched=raw.map(c=>{
    const k=c.class_name||'Unclassified';const def=classByName.get(c.class_name);
    const capInClass=classCapital[k]||0;
    // Investor's % share WITHIN its class: pro-rata by capital, else even split
    // (sponsor/non-cash class), else a manual override.
    let pctClass=c.pct_of_class;
    if(pctClass==null){
      if(capInClass>0&&c.capital_cents!=null)pctClass=(c.capital_cents/capInClass)*100;
      else if(classCount[k]>0)pctClass=100/classCount[k];
      else pctClass=null;}
    // Total % ownership of the whole company.
    let totalPct=c.percent_interest; // explicit override wins
    if(totalPct==null){
      if(def&&def.total_percent!=null&&pctClass!=null)totalPct=pctClass*def.total_percent/100;
      else if(anyClassTotals&&pctClass!=null)totalPct=pctClass;
      else if(totalCapital>0&&c.capital_cents!=null)totalPct=(c.capital_cents/totalCapital)*100;
      else totalPct=pctClass;}
    // Accrued return to date: capital × rate × days / 365, from the closing date.
    let accrued=c.accrued_cents;
    if(accrued==null){const rate=c.pref_return_rate,start=c.accrual_start||c.issue_date||c.funded_date;
      if(rate!=null&&c.capital_cents!=null&&start){const days=daysSince(start);
        if(days!=null)accrued=Math.round(c.capital_cents*(rate/100)*(days/365));}}
    return{...c,pct_of_class_calc:pctClass,total_pct_calc:totalPct,accrued_calc:accrued,
      class_total_percent:def?def.total_percent:null,class_sponsor:def?!!def.sponsor:false};});
  const classOrder=new Map(classes.map((c,idx)=>[c.name,idx]));
  enriched.sort((a,b)=>{
    const ao=classOrder.has(a.class_name)?classOrder.get(a.class_name):999;
    const bo=classOrder.has(b.class_name)?classOrder.get(b.class_name):999;
    if(ao!==bo)return ao-bo;
    const ac=a.class_name||'~',bc=b.class_name||'~';if(ac!==bc)return ac.localeCompare(bc);
    const asi=a.sort_index??1e9,bsi=b.sort_index??1e9;if(asi!==bsi)return asi-bsi;
    return String(a.cert_number||'').localeCompare(String(b.cert_number||''),undefined,{numeric:true});});
  return{offering:o,classes,certificates:enriched,classCapital,classCount,totalCapital,
    hasClassTotals:anyClassTotals,classNames:[...new Set(raw.map(c=>c.class_name).filter(Boolean))]};
}
// Create certificates for the subscriptions included in a closing. Numbers are
// assigned in funding-date order, continuing from the highest existing number.
function generateCertificatesForClosing(offeringId,closing,subIds){
  const o=db.offerings.find(x=>x.id===offeringId);if(!o)return 0;
  const existing=db.certificates.filter(c=>c.offering_id===offeringId);
  let maxNum=existing.reduce((m,c)=>{const n=parseInt(String(c.cert_number||'').replace(/\D/g,''),10);return isFinite(n)?Math.max(m,n):m;},0);
  let maxSort=existing.reduce((m,c)=>Math.max(m,c.sort_index||0),0);
  const subs=subIds.map(id=>db.subscriptions.find(s=>s.id===id&&s.offering_id===offeringId))
    .filter(Boolean).filter(s=>s.investor_id).filter(s=>!existing.some(c=>c.subscription_id===s.id));
  subs.sort((a,b)=>{const fa=a.funded_date||closing.closing_date||'',fb=b.funded_date||closing.closing_date||'';
    if(fa!==fb)return fa.localeCompare(fb);
    const ia=db.investors.find(x=>x.id===a.investor_id),ib=db.investors.find(x=>x.id===b.investor_id);
    return investorSortKey(ia||{}).localeCompare(investorSortKey(ib||{}));});
  let made=0;
  for(const s of subs){
    const tr=(o.tranches||[]).find(t=>t.id===s.tranche_id);
    const className=(tr&&tr.class_name)||defaultInvestedClass(o)||o.security_type||'Units';
    const rate=(tr&&tr.default_return_rate!=null)?tr.default_return_rate:(o.default_return_rate!=null?o.default_return_rate:null);
    maxNum++;maxSort++;made++;
    db.certificates.push({id:nextId('certificates'),offering_id:offeringId,subscription_id:s.id,closing_id:closing.id,
      investor_id:s.investor_id,holder_name:null,class_name:className,capital_cents:s.amount_committed_cents||0,
      pct_of_class:null,percent_interest:null,pref_return_rate:rate,accrued_cents:null,
      funded_date:s.funded_date||closing.closing_date||null,accrual_start:closing.closing_date||null,
      issue_date:closing.closing_date||null,cert_number:String(maxNum),sort_index:maxSort,no_capital:0,created_at:nowISO()});}
  return made;
}

function offeringFromBody(b){
  const row={

    launch_date:str(b.launch_date),first_close_date:str(b.first_close_date),final_close_date:str(b.final_close_date),
    form_d_filed_date:str(b.form_d_filed_date),escrow_agent:str(b.escrow_agent),escrow_bank:str(b.escrow_bank),
    escrow_account_number:str(b.escrow_account_number),notes:str(b.notes),
    default_return_rate:numOr(b.default_return_rate),
    no_max:b.no_max?1:0,fractional_allowed:b.fractional_allowed?1:0,no_deadline:b.no_deadline?1:0,
    pass_through_costs:b.pass_through_costs?1:0,costs_label:str(b.costs_label)};
  if(row.no_max)row.target_max_cents=null;        // uncapped raise — ignore any amount
  if(row.no_deadline)row.final_close_date=null;   // open-ended — ignore any date

}
// Display helpers for the optional/"none" states.
function maxRaiseDisplay(o){return o.no_max?'No maximum (uncapped)':(o.target_max_cents!=null?money(o.target_max_cents):'—');}
function minInvestDisplay(o){
  if(o.min_investment_cents!=null)return money(o.min_investment_cents)+(o.fractional_allowed?' · fractional allowed':'');
  return o.fractional_allowed?'Fractional allowed':'—';}
function closeDeadlineDisplay(o){return o.no_deadline?'Open-ended (no deadline)':fmtDate(o.final_close_date);}
function investorFromBody(b){
  const entity_type=str(b.entity_type)||'Individual';
  const person=isPersonType(entity_type);
  const first=str(b.first_name),middle=str(b.middle_name),last=str(b.last_name);
  // Canonical display name: built from name parts for individuals, entity name otherwise.
  let name=str(b.name);
  if(person)name=[first,middle,last].filter(Boolean).join(' ')||name;
  return{
    name,entity_type,
    first_name:person?first:null,middle_name:person?middle:null,last_name:person?last:null,
    tax_id:str(b.tax_id),
    contact_name:str(b.contact_name),email:str(b.email),
    phone:str(b.phone),address:str(b.address),accredited_status:str(b.accredited_status)||'Unknown',
    accredited_verified_date:str(b.accredited_verified_date),notes:str(b.notes)};}
function subFromBody(b){return{
  investor_id:numOr(b.investor_id),amount_committed_cents:dollarsToCents(b.amount_committed),units:numOr(b.units),
  costs_cents:dollarsToCents(b.costs),tranche_id:numOr(b.tranche_id),funded_date:str(b.funded_date),
  status:str(b.status)||'Prospect',sub_sent_date:str(b.sub_sent_date),sub_signed_date:str(b.sub_signed_date),notes:str(b.notes)};}
function escrowFromBody(b){const type=str(b.txn_type)||'deposit';const valid=['deposit','release','refund','fee'];
  return{investor_id:numOr(b.investor_id),txn_type:valid.includes(type)?type:'deposit',
    amount_cents:Math.abs(dollarsToCents(b.amount)||0),txn_date:str(b.txn_date),method:str(b.method),
    reference:str(b.reference),cleared:b.cleared?1:0,notes:str(b.notes)};}

const api={
  async dashboard(){
    const os=db.offerings;const byStatus={};let inEscrow=0,committed=0,minMet=0,active=0;const upcoming=[];
    for(const o of os){const s=offeringSummary(o);byStatus[o.status]=(byStatus[o.status]||0)+1;
      inEscrow+=s.escrow.clearedBalance;committed+=s.subscriptions.committed;if(s.minRaiseMet)minMet++;
      if(!['Closed','Terminated'].includes(o.status))active++;
      const d=daysUntil(o.final_close_date);
      if(d!==null&&d>=0&&!['Closed','Terminated'].includes(o.status))
        upcoming.push({id:o.id,name:o.name,final_close_date:o.final_close_date,days:d,minRaiseMet:s.minRaiseMet});}
    upcoming.sort((a,b)=>a.days-b.days);
    return{offeringCount:os.length,activeCount:active,investorCount:db.investors.length,totalInEscrow:inEscrow,
      totalCommitted:committed,minRaiseMetCount:minMet,byStatus,upcomingClosings:upcoming.slice(0,8)};
  },

  // Tranches — sub-series within an offering that may carry their own terms.

  async listInvestors(){return db.investors.slice().sort((a,b)=>investorSortKey(a).localeCompare(investorSortKey(b)))

  async getInvestor(id){id=Number(id);const inv=db.investors.find(x=>x.id===id);if(!inv)throw new Error('Investor not found');

      .sort((a,b)=>a.offering_name.localeCompare(b.offering_name));

  async createInvestor(b){const row=investorFromBody(b);if(!row.name)throw new Error(isPersonType(row.entity_type)?'A last name is required':'Investor / entity name is required');
    const inv={id:nextId('investors'),...row,created_at:nowISO(),updated_at:nowISO()};db.investors.push(inv);await persist();return inv;},
  async updateInvestor(id,b){id=Number(id);const inv=db.investors.find(x=>x.id===id);if(!inv)throw new Error('Investor not found');
    const row=investorFromBody(b);if(!row.name)throw new Error(isPersonType(row.entity_type)?'A last name is required':'Investor / entity name is required');Object.assign(inv,row,{updated_at:nowISO()});await persist();return inv;},
  async deleteInvestor(id){id=Number(id);const n=db.subscriptions.filter(s=>s.investor_id===id).length;
    if(n>0)throw new Error(`This investor is on ${n} offering subscription(s). Remove those first.`);
    db.investors=db.investors.filter(x=>x.id!==id);db.escrow.forEach(e=>{if(e.investor_id===id)e.investor_id=null;});await persist();return{ok:true};},

  async listSubscriptions(offeringId){offeringId=Number(offeringId);
    return db.subscriptions.filter(s=>s.offering_id===offeringId).map(s=>{const i=db.investors.find(x=>x.id===s.investor_id);
      return{...s,investor_name:i?investorDisplayName(i):null,investor_sort:i?investorSortKey(i):'',
        entity_type:i?i.entity_type:null,email:i?i.email:null,phone:i?i.phone:null,accredited_status:i?i.accredited_status:null};})
      .sort((a,b)=>(a.investor_sort||'').localeCompare(b.investor_sort||''));},
  async createSubscription(offeringId,b){offeringId=Number(offeringId);const row=subFromBody(b);
    if(!row.investor_id)throw new Error('Investor is required');if(!db.investors.find(x=>x.id===row.investor_id))throw new Error('Investor not found');
    const s={id:nextId('subscriptions'),offering_id:offeringId,...row,created_at:nowISO(),updated_at:nowISO()};db.subscriptions.push(s);await persist();return s;},
  async updateSubscription(id,b){id=Number(id);const s=db.subscriptions.find(x=>x.id===id);if(!s)throw new Error('Subscription not found');
    const row=subFromBody(b);if(!row.investor_id)throw new Error('Investor is required');Object.assign(s,row,{updated_at:nowISO()});await persist();return s;},
  async deleteSubscription(id){id=Number(id);db.subscriptions=db.subscriptions.filter(x=>x.id!==id);await persist();return{ok:true};},

  async listEscrow(offeringId){offeringId=Number(offeringId);
    const transactions=db.escrow.filter(e=>e.offering_id===offeringId).map(e=>{const i=db.investors.find(x=>x.id===e.investor_id);
      return{...e,investor_name:i?i.name:null};})
      .sort((a,b)=>(b.txn_date||b.created_at||'').localeCompare(a.txn_date||a.created_at||'')||b.id-a.id);
    return{transactions,summary:escrowSummary(offeringId)};},
  async createEscrow(offeringId,b){offeringId=Number(offeringId);const row=escrowFromBody(b);
    if(!row.amount_cents)throw new Error('Amount must be greater than zero');
    const e={id:nextId('escrow'),offering_id:offeringId,...row,created_at:nowISO()};db.escrow.push(e);await persist();return e;},
  async updateEscrow(id,b){id=Number(id);const e=db.escrow.find(x=>x.id===id);if(!e)throw new Error('Transaction not found');
    const row=escrowFromBody(b);if(!row.amount_cents)throw new Error('Amount must be greater than zero');Object.assign(e,row);await persist();return e;},
  async deleteEscrow(id){id=Number(id);db.escrow=db.escrow.filter(x=>x.id!==id);await persist();return{ok:true};},

  async listTasks(offeringId){offeringId=Number(offeringId);return db.tasks.filter(t=>t.offering_id===offeringId).sort((a,b)=>a.sort_order-b.sort_order||a.id-b.id);},
  async createTask(offeringId,b){offeringId=Number(offeringId);const label=str(b.label);if(!label)throw new Error('Task label is required');
    const order=db.tasks.filter(t=>t.offering_id===offeringId).reduce((m,t)=>Math.max(m,t.sort_order),-1)+1;
    const t={id:nextId('tasks'),offering_id:offeringId,label,done:0,due_date:str(b.due_date),sort_order:order,created_at:nowISO()};db.tasks.push(t);await persist();return t;},
  async updateTask(id,b){id=Number(id);const t=db.tasks.find(x=>x.id===id);if(!t)throw new Error('Task not found');
    if('label'in b&&str(b.label))t.label=str(b.label);if('done'in b)t.done=b.done?1:0;if('due_date'in b)t.due_date=str(b.due_date);
    if('sort_order'in b)t.sort_order=numOr(b.sort_order,t.sort_order);await persist();return t;},
  async deleteTask(id){id=Number(id);db.tasks=db.tasks.filter(x=>x.id!==id);await persist();return{ok:true};},

  async listReconciliations(offeringId){offeringId=Number(offeringId);const summary=escrowSummary(offeringId);
    const reconciliations=db.reconciliations.filter(r=>r.offering_id===offeringId)
      .sort((a,b)=>(b.statement_date||b.created_at||'').localeCompare(a.statement_date||a.created_at||'')||b.id-a.id)
      .map(r=>({...r,difference_cents:r.statement_balance_cents-summary.clearedBalance}));
    return{reconciliations,summary};},
  async createReconciliation(offeringId,b){offeringId=Number(offeringId);const bal=dollarsToCents(b.statement_balance);
    if(bal===null)throw new Error('Statement balance is required');

    db.reconciliations.push(r);await persist();return r;},
  async deleteReconciliation(id){id=Number(id);db.reconciliations=db.reconciliations.filter(x=>x.id!==id);await persist();return{ok:true};},

  // Closings / tranches. A closing records a release of escrow to the issuer and
  // marks the included investors' subscriptions closed.
  async listClosings(offeringId){offeringId=Number(offeringId);
    const closings=db.closings.filter(c=>c.offering_id===offeringId)
      .sort((a,b)=>(b.closing_date||b.created_at||'').localeCompare(a.closing_date||a.created_at||'')||b.id-a.id)
      .map(c=>{
        const subs=db.subscriptions.filter(s=>s.closing_id===c.id).map(s=>{const i=db.investors.find(x=>x.id===s.investor_id);
          return{...s,investor_name:i?investorDisplayName(i):'(deleted investor)'};});
        return{...c,investors:subs,investor_count:subs.length};
      });
    return{closings,totalReleased:closings.reduce((a,c)=>a+(c.amount_released_cents||0),0)};},
  async createClosing(offeringId,b){offeringId=Number(offeringId);
    if(!db.offerings.find(x=>x.id===offeringId))throw new Error('Offering not found');
    const amount=Math.abs(dollarsToCents(b.amount_released)||0);
    const fees=Math.abs(dollarsToCents(b.fees)||0);
    if(!amount&&!fees)throw new Error('Enter an amount released to the issuer.');
    const subIds=(Array.isArray(b.investor_sub_ids)?b.investor_sub_ids:[]).map(Number);
    const count=db.closings.filter(c=>c.offering_id===offeringId).length;
    const label=str(b.label)||`Closing ${count+1}`;
    const date=str(b.closing_date);
    const closing={id:nextId('closings'),offering_id:offeringId,label,closing_date:date,
      amount_released_cents:amount,fees_cents:fees,notes:str(b.notes),created_at:nowISO()};
    db.closings.push(closing);
    // Record the escrow movements so the ledger and balances stay correct.
    if(amount>0)db.escrow.push({id:nextId('escrow'),offering_id:offeringId,investor_id:null,txn_type:'release',
      amount_cents:amount,txn_date:date,method:null,reference:label,cleared:1,notes:`Release to issuer — ${label}`,
      created_at:nowISO(),closing_id:closing.id});
    if(fees>0)db.escrow.push({id:nextId('escrow'),offering_id:offeringId,investor_id:null,txn_type:'fee',
      amount_cents:fees,txn_date:date,method:null,reference:label,cleared:1,notes:`Closing costs — ${label}`,
      created_at:nowISO(),closing_id:closing.id});
    // Link and (optionally) close the included subscriptions.
    const markClosed=b.mark_closed!==false;
    for(const sid of subIds){const s=db.subscriptions.find(x=>x.id===sid&&x.offering_id===offeringId);
      if(s){s.closing_id=closing.id;if(markClosed)s.status='Closed';if(!s.funded_date)s.funded_date=date;s.updated_at=nowISO();}}
    // Auto-issue certificates for the included investors (feature: certificates on closing).
    let certsIssued=0;
    if(b.issue_certs!==false)certsIssued=generateCertificatesForClosing(offeringId,closing,subIds);
    closing.certs_issued=certsIssued;
    await persist();return{...closing,certsIssued};},
  async deleteClosing(id){id=Number(id);const c=db.closings.find(x=>x.id===id);if(!c)throw new Error('Closing not found');
    // Reverse: remove its escrow entries, auto-issued certificates, and un-close its subscriptions.
    db.escrow=db.escrow.filter(e=>e.closing_id!==id);
    db.certificates=db.certificates.filter(cert=>cert.closing_id!==id);
    db.subscriptions.forEach(s=>{if(s.closing_id===id){s.closing_id=null;if(s.status==='Closed')s.status='Funded';s.updated_at=nowISO();}});
    db.closings=db.closings.filter(x=>x.id!==id);await persist();return{ok:true};},

  // Certificate roster — units/interests issued to holders, possibly across

      totalAccrued:r.certificates.reduce((a,c)=>a+(c.accrued_calc||0),0),
      totalPercent:r.certificates.reduce((a,c)=>a+(Number(c.total_pct_calc)||0),0)};},
  async createCertificate(offeringId,b){offeringId=Number(offeringId);
    if(!db.offerings.find(x=>x.id===offeringId))throw new Error('Offering not found');
    const row=certFromBody(b);if(!row.cert_number)throw new Error('Certificate # is required');
    const c={id:nextId('certificates'),offering_id:offeringId,...row,created_at:nowISO()};db.certificates.push(c);await persist();return c;},
  async updateCertificate(id,b){id=Number(id);const c=db.certificates.find(x=>x.id===id);if(!c)throw new Error('Certificate not found');
    const row=certFromBody(b);if(!row.cert_number)throw new Error('Certificate # is required');Object.assign(c,row);await persist();return c;},
  async deleteCertificate(id){id=Number(id);db.certificates=db.certificates.filter(x=>x.id!==id);await persist();return{ok:true};},
  // Re-assign every certificate number for an offering by funding-date order.
  async renumberCertificates(offeringId){offeringId=Number(offeringId);
    const certs=db.certificates.filter(c=>c.offering_id===offeringId);
    certs.sort((a,b)=>{const fa=a.funded_date||a.issue_date||'',fb=b.funded_date||b.issue_date||'';
      if(fa!==fb)return fa.localeCompare(fb);return (a.sort_index||0)-(b.sort_index||0)||a.id-b.id;});
    certs.forEach((c,idx)=>{c.cert_number=String(idx+1);c.sort_index=idx+1;});
    await persist();return{ok:true};},
};
function certFromBody(b){return{
  cert_number:str(b.cert_number),investor_id:numOr(b.investor_id),holder_name:str(b.holder_name),

  // pct_of_class: optional manual override of the holder's share WITHIN its class.

  // percent_interest: optional manual override of TOTAL % ownership (else computed).
  percent_interest:numOr(b.percent_interest),
  pref_return_rate:numOr(b.pref_return_rate),

  accrued_cents:dollarsToCents(b.accrued),
  funded_date:str(b.funded_date),accrual_start:str(b.accrual_start),
  sort_index:numOr(b.sort_index),no_capital:b.no_capital?1:0,

const viewEl=document.getElementById('view');
const routes=[
  [/^\/?(?:\?.*)?$/,()=>renderDashboard(),'dashboard'],
  [/^\/offerings\/(\d+)(?:\?.*)?$/,m=>renderOffering(m[1]),'offerings'],
  [/^\/offerings(?:\?.*)?$/,()=>renderOfferings(),'offerings'],
  [/^\/investors\/(\d+)(?:\?.*)?$/,m=>renderInvestor(m[1]),'investors'],
  [/^\/investors(?:\?.*)?$/,()=>renderInvestors(),'investors'],
];
async function router(){
  const hash=location.hash.replace(/^#/,'')||'/';
  const match=routes.find(([re])=>re.test(hash));
  const navKey=match?match[2]:'dashboard';
  document.querySelectorAll('.nav a').forEach(a=>a.classList.toggle('active',a.dataset.nav===navKey));
  clear(viewEl);viewEl.appendChild(el('div',{class:'loading'},'Loading…'));
  try{
    // match[0] is the regex, match[1] the handler, match[2] the nav key.
    const node=match?await match[1](hash.match(match[0])):notFound();
    clear(viewEl);viewEl.appendChild(node);viewEl.scrollTop=0;
  }catch(err){clear(viewEl);viewEl.appendChild(el('div',{class:'error-state'},el('h2',{},'Something went wrong'),el('p',{},err.message)));}
}
function notFound(){return el('div',{class:'error-state'},el('h2',{},'Page not found'),el('a',{class:'btn btn-primary',onclick:()=>location.hash='#/'},'Back to dashboard'));}
function navigate(path){if(location.hash==='#'+path)router();else location.hash=path;}
function refresh(){router();}
window.addEventListener('hashchange',router);

/* ============================================================================
   THEME — light is the default; the choice is remembered per browser.
   ========================================================================== */
const SUN='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm0-9.5a.7.7 0 0 1 .7.7v1a.7.7 0 0 1-1.4 0v-1a.7.7 0 0 1 .7-.7Zm0 11.6a.7.7 0 0 1 .7.7v1a.7.7 0 0 1-1.4 0v-1a.7.7 0 0 1 .7-.7ZM1.5 8a.7.7 0 0 1 .7-.7h1a.7.7 0 0 1 0 1.4h-1A.7.7 0 0 1 1.5 8Zm11.3 0a.7.7 0 0 1 .7-.7h1a.7.7 0 0 1 0 1.4h-1a.7.7 0 0 1-.7-.7ZM3.3 3.3a.7.7 0 0 1 1 0l.7.7a.7.7 0 1 1-1 1l-.7-.7a.7.7 0 0 1 0-1Zm7.7 7.7a.7.7 0 0 1 1 0l.7.7a.7.7 0 0 1-1 1l-.7-.7a.7.7 0 0 1 0-1Zm1.7-7.7a.7.7 0 0 1 0 1l-.7.7a.7.7 0 1 1-1-1l.7-.7a.7.7 0 0 1 1 0ZM5 11a.7.7 0 0 1 0 1l-.7.7a.7.7 0 0 1-1-1l.7-.7a.7.7 0 0 1 1 0Z"/></svg>';
const MOON='<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.4 9.6A5.8 5.8 0 0 1 6.4 2.6a.6.6 0 0 0-.83-.7A6.9 6.9 0 1 0 14.1 10.4a.6.6 0 0 0-.7-.83Z"/></svg>';
function applyTheme(t){
  const theme=t==='dark'?'dark':'light';
  document.documentElement.setAttribute('data-theme',theme);
  try{localStorage.setItem(THEME_KEY,theme);}catch{}
  const b=document.getElementById('theme-toggle');
  if(b){
    b.innerHTML=(theme==='dark'?MOON:SUN)+'<span>'+(theme==='dark'?'Dark':'Light')+'</span>';
    b.setAttribute('aria-pressed',theme==='dark'?'true':'false');
    b.title=theme==='dark'?'Switch to light':'Switch to dark';
  }
}
function initTheme(){
  let t='light';
  try{t=localStorage.getItem(THEME_KEY)||'light';}catch{}
  applyTheme(t);
  const b=document.getElementById('theme-toggle');
  if(b)b.addEventListener('click',()=>applyTheme(
    document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'));
}

/* ============================================================================
   BOOT
   ========================================================================== */
async function boot(){
  initTheme();
  // Load the browser mirror, falling back to data saved under any previous app name.
  let raw=localStorage.getItem(LS_KEY);
  if(!raw){for(const k of LS_KEYS_OLD){const old=localStorage.getItem(k);if(old){raw=old;break;}}}
  if(raw){try{db=parseDB(raw);}catch{db=EMPTY();}}
  // Try to remember a previously connected file (needs a click to re-grant).
  if(FSA){try{const h=await idbGet('fileHandle');if(h)pendingHandle=h;}catch{}}
  renderFileStatus();
  const addBtn=document.getElementById('global-add');if(addBtn)addBtn.addEventListener('click',openQuickAdd);
  router();
}
boot();
</script>
