/* ---- Modal + forms ------------------------------------------------------ */
let escHandler=null;
let modalOpener=null;   // where focus returns when the dialog closes
function closeModal(){
  const root=document.getElementById('modal-root');clear(root);root.classList.remove('open');
  if(escHandler){document.removeEventListener('keydown',escHandler);escHandler=null;}
  document.body.style.overflow='';
  if(modalOpener&&modalOpener.isConnected)modalOpener.focus();
  modalOpener=null;
}
function openShell(title,contentNode,{wide=false}={}){
  const root=document.getElementById('modal-root');clear(root);
  modalOpener=document.activeElement;
  const titleId='modal-title-'+Math.random().toString(36).slice(2,8);
  const dialog=el('div',{class:`modal ${wide?'modal-wide':''}`,role:'dialog','aria-modal':'true','aria-labelledby':titleId},
    el('div',{class:'modal-head'},el('h2',{id:titleId},title),el('button',{class:'modal-close',type:'button','aria-label':'Close',onclick:closeModal},'@icon:close')),
    contentNode);
  root.appendChild(el('div',{class:'modal-backdrop',onclick:e=>{if(e.target===e.currentTarget)closeModal();}},dialog));
  root.classList.add('open');
  // The page behind the dialog neither scrolls nor takes focus.
  document.body.style.overflow='hidden';
  escHandler=e=>{
    if(e.key==='Escape'){closeModal();return;}
    if(e.key!=='Tab')return;
    const focusables=dialog.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])');
    if(!focusables.length)return;
    const first=focusables[0],last=focusables[focusables.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  };
  document.addEventListener('keydown',escHandler);
  return dialog;
}
function confirmDialog(message,{danger=false,confirmLabel='Confirm'}={}){
  return new Promise(resolve=>{
    const body=el('div',{class:'modal-body'},
      el('p',{class:'confirm-text'},message),
      el('div',{class:'modal-actions'},
        el('button',{class:'btn btn-ghost',onclick:()=>{closeModal();resolve(false);}},'Cancel'),
        el('button',{class:`btn ${danger?'btn-danger':'btn-primary'}`,onclick:()=>{closeModal();resolve(true);}},confirmLabel)));
    openShell(danger?'Please confirm':'Confirm',body);
  });
}
// Fields support: type text/textarea/select/checkbox/money/number/date/email/tel,
// plus type:'custom' (f.build(value) → {node, get value}) for widgets like the
// investor typeahead, an optional f.showIf(values)→bool to hide fields, an
// f.onChange(values,api) hook, and f.section headers to group fields.
function formModal({title,fields,values={},submitLabel='Save',onSubmit,wide=false}){
  const inputs={};   // name → element or custom controller ({node, value})
  const rowEls={};   // name → the .form-row wrapper (for showIf)
  const errorBox=el('div',{class:'form-error',style:'display:none'});
  const rows=[];
  for(const f of fields){
    if(f.type==='section'){rows.push(el('div',{class:'form-section-head'},f.label));continue;}
    let input,rowEl;const common={id:`f_${f.name}`,name:f.name,placeholder:f.placeholder||''};
    if(f.type==='hidden'){
      input=el('input',{type:'hidden',id:`f_${f.name}`,name:f.name,value:values[f.name]??''});
      inputs[f.name]=input;rowEls[f.name]=input;rows.push(input);continue;
    }
    if(f.type==='custom'){
      const ctrl=f.build(values[f.name]);inputs[f.name]=ctrl;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{},f.label,f.required?el('span',{class:'req'},' *'):null),
        ctrl.node,f.help?el('div',{class:'field-help'},f.help):null);
    }else if(f.type==='checkbox'){
      input=el('input',{id:`f_${f.name}`,name:f.name,type:'checkbox',checked:!!values[f.name]});
      inputs[f.name]=input;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{class:'form-check'},input,el('span',{},f.label),
          f.help?el('span',{class:'field-help',style:'margin-left:6px'},f.help):null));
    }else{
      if(f.type==='textarea')input=el('textarea',{...common,rows:f.rows||3},values[f.name]??'');
      else if(f.type==='select')input=el('select',common,...(f.options||[]).map(o=>{
        const val=typeof o==='object'?o.value:o,label=typeof o==='object'?o.label:o;
        return el('option',{value:val,selected:String(values[f.name]??'')===String(val)},label);
      }));
      else{
        const type=f.type==='money'?'text':(f.type||'text');
        input=el('input',{...common,type,value:values[f.name]??'',min:f.min,step:f.step,
          inputmode:f.type==='money'||f.type==='number'?'decimal':undefined,
          autocomplete:f.autocomplete||undefined});
        if(f.type==='money')input.classList.add('money-input');
        if(f.mono)input.classList.add('mono');
        if(f.datalist){const dlid=`dl_${f.name}`;input.setAttribute('list',dlid);
          input.__dl=el('datalist',{id:dlid},...f.datalist.map(v=>el('option',{value:v})));}
      }
      inputs[f.name]=input;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{for:`f_${f.name}`},f.label,f.required?el('span',{class:'req'},' *'):null),
        f.type==='money'?el('div',{class:'money-wrap'},el('span',{class:'money-prefix'},'$'),input):input,
        input.__dl||null,
        f.help?el('div',{class:'field-help'},f.help):null);
    }
    rowEls[f.name]=rowEl;rows.push(rowEl);
  }
  function readVal(f){const inp=inputs[f.name];if(!inp)return null;
    if(f.type==='checkbox')return inp.checked;
    let v=inp.value;if(typeof v==='string')v=v.trim();return v===''?null:v;}
  function currentValues(){const v={};for(const f of fields){if(f.type==='section')continue;v[f.name]=readVal(f);}return v;}
  function visible(f){return !f.showIf||f.showIf(currentValues());}
  // `changed` is the name of the field the user just touched, or undefined on
  // the first pass. A derived field uses it to tell "the amount moved, so
  // recompute" from "I am being redrawn, leave the user's answer alone".
  function reflow(changed){
    for(const f of fields){if(f.type==='section'||f.type==='hidden'||!rowEls[f.name])continue;
      if(f.showIf)rowEls[f.name].style.display=f.showIf(currentValues())?'':'none';}
    for(const f of fields){if(f.onChange)f.onChange(currentValues(),{setValue,getValue,changed});}}
  function getValue(name){const f=fields.find(x=>x.name===name);return f?readVal(f):null;}
  function setValue(name,val){const inp=inputs[name];if(!inp)return;
    const f=fields.find(x=>x.name===name);
    if(f&&f.type==='checkbox')inp.checked=!!val;else if('value'in inp)try{inp.value=val==null?'':val;}catch{}}
  for(const f of fields){const inp=inputs[f.name];if(!inp||f.type==='hidden')continue;
    const fire=()=>reflow(f.name);
    // A custom control announces itself by dispatching 'change' on its node,
    // which is how the typeahead tells the form a contact has been chosen.
    if(f.type==='custom'){if(inp.node)inp.node.addEventListener('change',fire);continue;}
    const node=inp;
    node.addEventListener('change',fire);
    if(node.tagName==='INPUT'||node.tagName==='TEXTAREA')node.addEventListener('input',fire);}
  const submitBtn=el('button',{class:'btn btn-primary',type:'submit'},submitLabel);
  const form=el('form',{class:'modal-body form-grid',onsubmit:async e=>{
    e.preventDefault();errorBox.style.display='none';
    const collected={};
    for(const f of fields){if(f.type==='section')continue;collected[f.name]=readVal(f);}
    const missing=fields.find(f=>f.required&&visible(f)&&!collected[f.name]);
    if(missing){errorBox.textContent=`${missing.label} is required.`;errorBox.style.display='block';
      const mi=inputs[missing.name];if(mi&&mi.focus)mi.focus();else if(mi&&mi.node)(mi.node.querySelector('input,select,textarea')||{focus(){}}).focus();return;}
    submitBtn.disabled=true;submitBtn.textContent='Saving…';
    try{await onSubmit(collected);closeModal();}
    catch(err){errorBox.textContent=err.message||'Something went wrong.';errorBox.style.display='block';submitBtn.disabled=false;submitBtn.textContent=submitLabel;}
  }},...rows,errorBox,
    el('div',{class:'modal-actions'},
      el('button',{class:'btn btn-ghost',type:'button',onclick:closeModal},'Cancel'),submitBtn));
  openShell(title,form,{wide});
  reflow();
  const firstField=fields.find(f=>f.type!=='section');
  const first=firstField&&inputs[firstField.name];
  if(first)setTimeout(()=>{if(first.focus)first.focus();else if(first.node){const inp=first.node.querySelector('input,select,textarea');if(inp)inp.focus();}},50);
}

/* ---- Investor typeahead (search-as-you-type) ---------------------------- */
// Returns a controller with .node (to place in a form) and .value (investor id
// as a string, or '' if nothing chosen). Used wherever you pick an investor.
function investorPicker(investors,selectedId,opts={}){
  // opts.allowCreate — offer to create the contact from whatever was typed.
  // opts.preferred   — ids to float to the top (this offering's subscribers).
  // opts.onPick      — called with the chosen investor.
  const byId=new Map(investors.map(i=>[i.id,i]));
  const preferred=new Set((opts.preferred||[]).map(Number));
  let chosen=selectedId!=null&&byId.has(Number(selectedId))?Number(selectedId):'';
  const input=el('input',{type:'text',class:'ac-input',placeholder:'Type a name to search…',autocomplete:'off'});
  const menu=el('div',{class:'ac-menu',style:'display:none'});
  const node=el('div',{class:'ac-wrap'},input,menu);
  if(chosen!=='')input.value=investorDisplayName(byId.get(chosen));
  function hide(){menu.style.display='none';active=-1;}
  let active=-1,shown=[];
  function createRow(){
    const typed=input.value.trim();
    if(!opts.allowCreate||!typed)return null;
    if(investors.some(i=>investorDisplayName(i).toLowerCase()===typed.toLowerCase()))return null;
    return el('div',{class:'ac-item ac-create',onmousedown:async e=>{e.preventDefault();await createFrom(typed);}},
      el('span',{class:'ac-name'},'@icon:plus','Add “'+truncate(typed,40)+'”'),
      el('span',{class:'ac-meta'},guessEntityType(typed)));}
  async function createFrom(typed){
    const entity_type=guessEntityType(typed);
    const body=isPersonType(entity_type)?{entity_type,...splitPersonName(typed)}:{entity_type,name:typed};
    try{
      const created=await api.createInvestor(body);
      investors.push(created);byId.set(created.id,created);
      pick(created);
      toast(`${investorDisplayName(created)} added to the contact book — details can follow.`,'success');
      opts.onPick&&opts.onPick(created);
    }catch(err){toast(err.message,'error');}}
  function render(items){shown=items.slice(0,12);clear(menu);
    const create=createRow();
    if(!shown.length&&!create){menu.appendChild(el('div',{class:'ac-empty'},'No match. Type a full name to add them.'));menu.style.display='block';return;}
    shown.forEach((i,idx)=>menu.appendChild(el('div',{class:'ac-item'+(idx===active?' active':''),
      onmousedown:e=>{e.preventDefault();pick(i);}},
      el('span',{class:'ac-name'},investorListName(i)),
      el('span',{class:'ac-meta'},preferred.has(i.id)?'On this offering':(i.entity_type||'')))));
    if(create)menu.appendChild(create);
    menu.style.display='block';}
  function pick(i){chosen=i.id;input.value=investorDisplayName(i);hide();
    opts.onPick&&opts.onPick(i);
    // Tell whatever form holds this control that its value moved.
    node.dispatchEvent(new Event('change',{bubbles:true}));}
  // Subscribers on this offering sort first: they are who a deposit or a
  // certificate almost always belongs to.
  const order=(a,b)=>(preferred.has(b.id)-preferred.has(a.id))||investorSortKey(a).localeCompare(investorSortKey(b));
  function filter(){const q=input.value.trim().toLowerCase();
    if(!q)return investors.slice().sort(order);
    return investors.filter(i=>investorDisplayName(i).toLowerCase().includes(q)||investorListName(i).toLowerCase().includes(q)||String(i.email||'').toLowerCase().includes(q)||String(i.tax_id||'').includes(q))
      .sort(order);}
  input.addEventListener('input',()=>{const had=chosen;chosen='';active=-1;render(filter());
    if(had!=='')node.dispatchEvent(new Event('change',{bubbles:true}));});
  input.addEventListener('focus',()=>render(filter()));
  input.addEventListener('blur',()=>setTimeout(hide,160));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();if(menu.style.display==='none')render(filter());active=Math.min(active+1,shown.length-1);render(shown);}
    else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0);render(shown);}
    else if(e.key==='Enter'){
      if(menu.style.display==='none')return;
      if(shown[active]){e.preventDefault();pick(shown[active]);}
      // Nothing highlighted but a creatable name typed: Enter creates it, so
      // the keyboard can do what the mouse can.
      else if(opts.allowCreate&&input.value.trim()&&!shown.length){e.preventDefault();createFrom(input.value.trim());}
    }
    else if(e.key==='Escape'){hide();}});
  return {node,get value(){return chosen===''?'':String(chosen);}};
}

   ========================================================================== */
const LS_KEY='muniment:data';
// Data saved under earlier names, newest first. Migrated on load; nothing is lost in the rename.
const LS_KEYS_OLD=['capitalvault:data','offeringbook:data'];
const THEME_KEY='muniment:theme';
const COLLECTIONS=['offerings','investors','subscriptions','escrow','tasks','reconciliations','closings','certificates','parties','activity'];
const EMPTY=()=>({meta:{version:2,app:'Muniment'},
  seq:{offerings:0,investors:0,subscriptions:0,escrow:0,tasks:0,reconciliations:0,closings:0,certificates:0,parties:0,activity:0},
  offerings:[],investors:[],subscriptions:[],escrow:[],tasks:[],reconciliations:[],closings:[],certificates:[],
  // parties: issuers, escrow agents and counsel, entered once and picked thereafter.
  parties:[],
  // activity: what the record proposed and you accepted, so an auto-filled
  // figure can always be traced back to the fact it came from.
  activity:[],
  // settings: the firm's own constants — see SETTINGS_DEFAULTS.
  settings:{},
  // dismissed: suggestion keys waved off, with when. Keyed on the fact, so a
  // dismissal sticks until the underlying figures change.
  dismissed:{}});
let db=EMPTY();
let fileHandle=null;
let fileName=null;
// Set when the stored data could not be read. Nothing is written while it is
// true, so an unreadable document is never replaced by an empty one. Any
// deliberate act that replaces the document — opening a file, creating one,
// importing, or starting fresh — is the decision it was waiting for, and
// clears it through adoptDocument().
let readOnly=false;
// Call whenever the user has knowingly chosen what the document should be.
function adoptDocument(next){
  if(next)db=next;
  if(readOnly){readOnly=false;toast('Saving has resumed.','success');}
}

function normalize(obj){
  const base=EMPTY();
  const out={...base,...obj,meta:{...base.meta,...(obj.meta||{})},seq:{...base.seq,...(obj.seq||{})},
    // Merged rather than replaced, exactly as meta and seq are, so a file
    // written by an earlier version gains the keys without losing its own.
    settings:{...base.settings,...(obj.settings||{})},
    dismissed:{...base.dismissed,...(obj.dismissed||{})}};
  // The document is Muniment's once it has been adopted; nothing validates
  // against these fields, they simply say who wrote the file last.
  out.meta.app='Muniment';out.meta.version=Math.max(2,Number(out.meta.version)||0);
  for(const k of COLLECTIONS)
    out[k]=Array.isArray(out[k])?out[k].filter(r=>r&&typeof r==='object'):[];

  for(const k of COLLECTIONS){
    const maxId=out[k].reduce((m,r)=>Math.max(m,Number(r.id)||0),0);

}
function parseDB(text){

}
function nextId(kind){db.seq[kind]=(db.seq[kind]||0)+1;return db.seq[kind];}

/* Persistence */
let saveTimer=null;
let batch=null;            // the pending write everyone currently waiting shares
let batchOpened=0;         // when it opened, so a busy stretch still gets written
let writing=Promise.resolve(); // one file write at a time, never interleaved
let quotaWarned=false;
const SAVE_DEBOUNCE=250,SAVE_MAX_WAIT=1500;
function serialize(){return JSON.stringify(db,null,2);}

// Coalesce rapid edits into a single write, but resolve every caller only once
// a write that contains their change has completed.
function scheduleWrite(){
  if(!batch){let done;const promise=new Promise(r=>{done=r;});batch={promise,done};batchOpened=Date.now();}
  const waited=Date.now()-batchOpened;

  saveTimer=setTimeout(flushWrite,Math.max(0,Math.min(SAVE_DEBOUNCE,SAVE_MAX_WAIT-waited)));
  return batch.promise;
}
async function flushWrite(){
  const mine=batch;batch=null;
  if(!mine)return;
  writing=writing.then(async()=>{
    if(!fileHandle){setSaveState('local');return;}
    try{
      const w=await fileHandle.createWritable();
      await w.write(new Blob([serialize()],{type:'application/json'}));
      await w.close();
      setSaveState('saved');
    }catch(e){setSaveState('error');toast('Could not save to your data file: '+e.message,'error');}
  });
  await writing;
  mine.done();
}
// A debounced write that never happens is a lost edit. When the page is being
// hidden or unloaded, write now rather than on the timer.
function flushOnExit(){
  if(!batch||readOnly)return;
  clearTimeout(saveTimer);
  flushWrite();
}
addEventListener('pagehide',flushOnExit);
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushOnExit();});

async function persist(){
  if(readOnly){toast('Saving is held: the data already in this browser could not be read. Open your data file, or import a backup, to resume.','error');return;}
  try{localStorage.setItem(LS_KEY,serialize());quotaWarned=false;}
  catch(e){
    // Swallowing this used to leave the dot claiming "Saved in this browser"
    // long after the browser had stopped accepting the write.
    if(!quotaWarned){quotaWarned=true;setSaveState('error');
      toast('This browser will not hold any more data. Connect a data file, or save a copy now.','error');}
  }
  if(!fileHandle){setSaveState('local');return;}
  setSaveState('saving');
  await scheduleWrite();
}

/* IndexedDB (just to remember the chosen file between sessions) */
// Internal IndexedDB name kept unchanged across the rename so a previously
// connected data file still reconnects with one click after the rebrand.
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('offeringbook',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){try{const d=await idbOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}catch{}}
async function idbGet(k){try{const d=await idbOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readonly');const rq=t.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}catch{return null;}}

const FSA='showSaveFilePicker'in window;
// On iOS and iPadOS every browser is WebKit, so the File System Access API is

const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function verifyPermission(handle,rw){
  const opts={mode:rw?'readwrite':'read'};

  if((await handle.requestPermission(opts))==='granted')return true;
  return false;
}
async function newDataFile(){

    const h=await window.showSaveFilePicker({suggestedName:'muniment-data.json',
      types:[{description:'Muniment data',accept:{'application/json':['.json']}}]});

    toast('Data file created — your changes now save here.','success');
  }catch(e){if(e.name!=='AbortError')toast('Could not create file: '+e.message,'error');}
}
async function openDataFile(){
  try{
    const[h]=await window.showOpenFilePicker({types:[{description:'Muniment data',accept:{'application/json':['.json']}}]});
    if(!(await verifyPermission(h,true)))throw new Error('Permission to the file was denied.');
    const text=await(await h.getFile()).text();
    const parsed=parseDB(text);
    if(hasData(db)){
      const ok=await confirmDialog('Opening this file will replace the data currently loaded in this browser. Your other data file (if any) is not affected. Continue?',{danger:true,confirmLabel:'Open file'});
      if(!ok)return;
    }
    adoptDocument(parsed);fileHandle=h;fileName=h.name;await persist();await idbSet('fileHandle',h);renderFileStatus();refresh();

}
async function reopenFromHandle(h){
  try{
    if(!(await verifyPermission(h,true))){toast('Permission to the file was denied.','error');return;}
    const text=await(await h.getFile()).text();
    const parsed=parseDB(text);
    // The browser mirror can legitimately be ahead of the file: a change made
    // in the last moments before the tab closed reaches localStorage
    // immediately but the file only after the write settles. Replacing
    // silently would throw that work away, so say which is which and let the
    // user choose.
    if(hasData(db)&&!sameDocument(db,parsed)){
      const mine=countRecords(db),theirs=countRecords(parsed);
      const ok=await confirmDialog(
        `The file holds ${theirs} record${theirs===1?'':'s'}; this browser holds ${mine}. Reconnecting replaces what is in the browser with what is in the file. Continue?`,
        {danger:mine>theirs,confirmLabel:'Use the file'});
      if(!ok)return;
    }
    adoptDocument(parsed);fileHandle=h;fileName=h.name;await persist();renderFileStatus();refresh();
    toast('Reconnected to '+h.name,'success');
  }catch(e){toast('Could not reopen file: '+e.message+' — it may have moved.','error');}
}
function disconnectFile(){fileHandle=null;fileName=null;idbSet('fileHandle',null);renderFileStatus();toast('Disconnected. Changes are still kept in this browser.','info');}
function stamp(){return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);}
function downloadCopy(){

// Everything a user could lose, not just the two headline collections: a firm
// that has set up its settings and party directory but not yet opened an
// offering still has plenty to lose.
function countRecords(d){

    +Object.keys(d.settings||{}).length;

// Two documents that would be identical on disk need no replace warning.
function sameDocument(a,b){try{return JSON.stringify(a)===JSON.stringify(b);}catch{return false;}}

function truncate(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}

/* ---- Computed summaries ------------------------------------------------- */
const SIGN={deposit:1,release:-1,refund:-1,fee:-1};
// Every amount is coerced: one null amount_cents used to turn every balance
// on every screen into $NaN, which reads as a broken app rather than a bad row.
function escrowSummary(offeringId){
  const rows=db.escrow.filter(e=>e.offering_id===offeringId);
  const by={deposit:0,release:0,refund:0,fee:0},cl={deposit:0,release:0,refund:0,fee:0};
  // hasOwnProperty rather than `in`: `in` walks the prototype, so a row typed
  // 'constructor' or 'toString' would have been accepted and added.
  for(const r of rows){if(Object.prototype.hasOwnProperty.call(by,r.txn_type)){const amt=Number(r.amount_cents)||0;
    by[r.txn_type]+=amt;if(r.cleared)cl[r.txn_type]+=amt;}}
  const book=by.deposit*SIGN.deposit+by.release*SIGN.release+by.refund*SIGN.refund+by.fee*SIGN.fee;
  const cleared=cl.deposit*SIGN.deposit+cl.release*SIGN.release+cl.refund*SIGN.refund+cl.fee*SIGN.fee;
  return{deposits:by.deposit,releases:by.release,refunds:by.refund,fees:by.fee,clearedDeposits:cl.deposit,
    // Subscriber money actually held: cleared deposits less cleared refunds.
    // This, not the gross deposit figure, is what the minimum raise is tested
    // against — a deposit that cleared and was then refunded is not raised.
    clearedNetDeposits:cl.deposit-cl.refund,clearedRefunds:cl.refund,
    bookBalance:book,clearedBalance:cleared,pendingBalance:book-cleared};
}
function subscriptionSummary(offeringId){
  const all=db.subscriptions.filter(s=>s.offering_id===offeringId);
  // A withdrawn subscription is not committed capital. It stays on the record
  // and out of every total.
  const subs=all.filter(s=>s.status!=='Withdrawn');
  const committed=subs.reduce((a,s)=>a+(s.amount_committed_cents||0),0);
  // Scored off the effective status, so a label left behind by its own dates
  // cannot understate the signed figure on a document handed to a client.
  const signed=subs.filter(s=>['Sub signed','Funded','Closed'].includes(effectiveSubStatus(s)))
    .reduce((a,s)=>a+(s.amount_committed_cents||0),0);
  return{investorCount:subs.length,committed,signedCommitted:signed,
    withdrawnCount:all.length-subs.length,
    withdrawn:all.filter(s=>s.status==='Withdrawn').reduce((a,s)=>a+(s.amount_committed_cents||0),0)};
}
// Whole days between two calendar dates. Both ends are normalised to local
// midnight first: measuring from the current instant made the answer drift
// through the day and flip a day early either side of a DST boundary.
// Accepts a bare date or a full ISO timestamp — appending 'T00:00:00' to
// something that already carried a time produced an invalid date, and the row
// then disappeared from the dashboard rather than reporting itself.
function dayOf(dateStr){if(!dateStr)return null;const d=new Date(String(dateStr).slice(0,10)+'T00:00:00');return isNaN(d)?null:d;}
function daysUntil(dateStr,today=new Date()){
  const t=dayOf(dateStr);if(!t)return null;
  const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  return Math.round((t-t0)/86400000);
}
function offeringSummary(o){
  const escrow=escrowSummary(o.id),subs=subscriptionSummary(o.id);
  const targetMin=o.target_min_cents||0;
  const raised=escrow.clearedNetDeposits;
  const minRaiseMet=targetMin>0&&raised>=targetMin;
  // Floored, not rounded: 99.6% must not read as 100% next to a badge saying
  // the minimum has not been met.
  const minRaisePct=targetMin>0?Math.min(100,Math.floor((raised/targetMin)*100)):null;
  const tasks=db.tasks.filter(t=>t.offering_id===o.id);
  const closings=db.closings.filter(c=>c.offering_id===o.id);
  const passCosts=db.subscriptions.filter(s=>s.offering_id===o.id).reduce((a,s)=>a+(s.costs_cents||0),0);
  return{escrow,subscriptions:subs,minRaiseMet,minRaisePct,daysToFinalClose:daysUntil(o.final_close_date),
    tasksTotal:tasks.length,tasksDone:tasks.filter(t=>t.done).length,passThroughCosts:passCosts,
    closingsCount:closings.length,totalReleased:closings.reduce((a,c)=>a+(c.amount_released_cents||0),0)};
}

/* ---- Certificate computation (% interest, accrued return) --------------- */
// Whole days from a 'YYYY-MM-DD' date to today (never negative). Used for accrual.
function daysSince(dateStr){
  const t=dayOf(dateStr);if(!t)return null;
  const now=new Date();const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  return Math.max(0,Math.round((t0-t)/86400000));
}
// The default class that cash investors go into (first non-sponsor class).
function defaultInvestedClass(o){const cls=(o&&Array.isArray(o.classes)?o.classes:[]).filter(c=>!c.sponsor);return cls.length?cls[0].name:null;}
// Enrich an offering's certificates with computed % of class, total % ownership
// and accrued return to date. Manual per-certificate values always override.
function computeCertificates(offeringId){
  const o=db.offerings.find(x=>x.id===offeringId);
  const classes=(o&&Array.isArray(o.classes))?o.classes:[];
  const classByName=new Map(classes.map(c=>[c.name,c]));
  const raw=db.certificates.filter(c=>c.offering_id===offeringId).map(c=>{
    const i=db.investors.find(x=>x.id===c.investor_id);
    return{...c,holder_name:i?investorDisplayName(i):(c.holder_name||null)};});
  const classCapital={},classCount={};let totalCapital=0;
  for(const c of raw){const k=c.class_name||'Unclassified';
    classCapital[k]=(classCapital[k]||0)+(Number(c.capital_cents)||0);
    classCount[k]=(classCount[k]||0)+1;totalCapital+=(Number(c.capital_cents)||0);}
  const anyClassTotals=classes.some(c=>c.total_percent!=null);
  // What the declared classes take, and therefore what is left for the rest.
  const declaredPct=classes.reduce((a,c)=>a+(c.total_percent!=null?Number(c.total_percent)||0:0),0);
  const remainderPct=Math.max(0,100-declaredPct);
  // Capital sitting in classes that declared no share of the company.
  const undeclaredNames=new Set(Object.keys(classCapital).filter(k=>{
    const def=classByName.get(k);return !def||def.total_percent==null;}));
  const undeclaredCapital=[...undeclaredNames].reduce((a,k)=>a+(classCapital[k]||0),0);
  const enriched=raw.map(c=>{
    const k=c.class_name||'Unclassified';const def=classByName.get(c.class_name);
    const capInClass=classCapital[k]||0;
    // Investor's % share WITHIN its class: pro-rata by capital, else even split
    // (sponsor/non-cash class), else a manual override.
    let pctClass=c.pct_of_class;
    if(pctClass==null){
      // Where a class holds capital, shares are strictly pro-rata to it — a
      // no-capital certificate takes 0% of that class rather than an equal
      // share on top, which used to push the class past 100%.
      if(capInClass>0)pctClass=c.capital_cents!=null?(c.capital_cents/capInClass)*100:0;
      // A class with no capital at all — a pure sponsor class — divides evenly.
      else if(classCount[k]>0)pctClass=100/classCount[k];
      else pctClass=null;}
    // Total % ownership of the whole company.
    let totalPct=c.percent_interest; // explicit override wins
    if(totalPct==null){
      if(def&&def.total_percent!=null&&pctClass!=null)totalPct=pctClass*def.total_percent/100;
      // A class with no declared share takes a slice of whatever the declared
      // classes leave — never its within-class share reported as a share of
      // the whole company.
      else if(anyClassTotals&&pctClass!=null)
        totalPct=undeclaredCapital>0&&c.capital_cents!=null
          ? (c.capital_cents/undeclaredCapital)*remainderPct
          // No capital anywhere in the undeclared classes: split the
          // remainder evenly between them, then within by pctClass — one
          // class taking the whole remainder per certificate over-allocates.
          : pctClass*(remainderPct/Math.max(1,undeclaredNames.size))/100;
      else if(totalCapital>0&&c.capital_cents!=null)totalPct=(c.capital_cents/totalCapital)*100;
      else totalPct=pctClass;}
    // Accrued return to date: capital × rate × days / 365, from the closing date.
    let accrued=c.accrued_cents;
    if(accrued==null){const rate=c.pref_return_rate,start=c.accrual_start||c.issue_date||c.funded_date;
      if(rate!=null&&c.capital_cents!=null&&start){const days=daysSince(start);
        if(days!=null)accrued=Math.round(c.capital_cents*(rate/100)*(days/365));}}
    return{...c,pct_of_class_calc:pctClass,total_pct_calc:totalPct,accrued_calc:accrued,
      class_total_percent:def?def.total_percent:null,class_sponsor:def?!!def.sponsor:false};});
  const classOrder=new Map(classes.map((c,idx)=>[c.name,idx]));
  enriched.sort((a,b)=>{
    const ao=classOrder.has(a.class_name)?classOrder.get(a.class_name):999;
    const bo=classOrder.has(b.class_name)?classOrder.get(b.class_name):999;
    if(ao!==bo)return ao-bo;
    const ac=a.class_name||'~',bc=b.class_name||'~';if(ac!==bc)return ac.localeCompare(bc);
    const asi=a.sort_index??1e9,bsi=b.sort_index??1e9;if(asi!==bsi)return asi-bsi;
    return String(a.cert_number||'').localeCompare(String(b.cert_number||''),undefined,{numeric:true});});
  return{offering:o,classes,certificates:enriched,classCapital,classCount,totalCapital,
    hasClassTotals:anyClassTotals,classNames:[...new Set(raw.map(c=>c.class_name).filter(Boolean))]};
}
// Create certificates for the subscriptions included in a closing. Numbers are
// assigned in funding-date order, continuing from the highest existing number.
function generateCertificatesForClosing(offeringId,closing,subIds){
  const o=db.offerings.find(x=>x.id===offeringId);if(!o)return 0;
  const existing=db.certificates.filter(c=>c.offering_id===offeringId);
  let maxNum=existing.reduce((m,c)=>{const n=parseInt(String(c.cert_number||'').replace(/\D/g,''),10);return isFinite(n)?Math.max(m,n):m;},0);
  let maxSort=existing.reduce((m,c)=>Math.max(m,c.sort_index||0),0);
  const subs=subIds.map(id=>db.subscriptions.find(s=>s.id===id&&s.offering_id===offeringId))
    .filter(Boolean).filter(s=>s.investor_id).filter(s=>!existing.some(c=>c.subscription_id===s.id));
  subs.sort((a,b)=>{const fa=a.funded_date||closing.closing_date||'',fb=b.funded_date||closing.closing_date||'';
    if(fa!==fb)return fa.localeCompare(fb);
    const ia=db.investors.find(x=>x.id===a.investor_id),ib=db.investors.find(x=>x.id===b.investor_id);
    return investorSortKey(ia||{}).localeCompare(investorSortKey(ib||{}));});
  let made=0;
  for(const s of subs){
    const tr=(o.tranches||[]).find(t=>t.id===s.tranche_id);
    const className=(tr&&tr.class_name)||defaultInvestedClass(o)||o.security_type||'Units';
    const rate=(tr&&tr.default_return_rate!=null)?tr.default_return_rate:(o.default_return_rate!=null?o.default_return_rate:null);
    maxNum++;maxSort++;made++;
    db.certificates.push({id:nextId('certificates'),offering_id:offeringId,subscription_id:s.id,closing_id:closing.id,
      investor_id:s.investor_id,holder_name:null,class_name:className,capital_cents:s.amount_committed_cents||0,
      pct_of_class:null,percent_interest:null,pref_return_rate:rate,accrued_cents:null,
      funded_date:s.funded_date||closing.closing_date||null,accrual_start:closing.closing_date||null,
      issue_date:closing.closing_date||null,cert_number:String(maxNum),sort_index:maxSort,no_capital:0,created_at:nowISO()});}
  return made;
}

/* ---- The inheritance cascade --------------------------------------------- */
// A value is entered at the broadest level it is true of, and read from the
// nearest level that has one. Nothing is copied down at write time — the chain
// is resolved at read time, so correcting the offering corrects every
// subscription that never overrode it.
//
// scope: {certificate?, subscription?, tranche?, offering?, party?}
const INHERIT={
  security_type:[['tranche','security_type'],['offering','security_type'],['settings','default_security_type']],
  exemption:[['offering','exemption'],['settings','default_exemption']],
  price_per_unit_cents:[['tranche','price_per_unit_cents'],['offering','price_per_unit_cents']],
  min_investment_cents:[['tranche','min_investment_cents'],['offering','min_investment_cents'],['settings','default_min_investment_cents']],
  return_rate:[['certificate','pref_return_rate'],['tranche','default_return_rate'],['offering','default_return_rate'],['settings','default_return_rate']],
  class_name:[['certificate','class_name'],['tranche','class_name'],['offeringFn',o=>defaultInvestedClass(o)]],
  costs_label:[['offering','costs_label'],['settings','default_costs_label']],
  escrow_agent:[['offering','escrow_agent'],['partyFn',p=>p&&p.name]],
  escrow_bank:[['offering','escrow_bank'],['partyFn',p=>p&&p.bank_name]],
  escrow_account_number:[['offering','escrow_account_number'],['partyFn',p=>p&&p.account_number]]
};
// Returns {value, from} — `from` names the level so a form can say where a
// value came from without the user having to ask.
function resolveField(scope,field){
  const chain=INHERIT[field];
  if(!chain)return{value:null,from:null};
  const cfg=settings();
  for(const[level,key]of chain){
    let v=null,src=level;
    if(level==='settings'){v=cfg[key]??null;src='the firm defaults';}
    else if(level==='offeringFn'){v=scope.offering?key(scope.offering):null;src='this offering';}
    else if(level==='partyFn'){v=key(scope.party||null);src=scope.party?scope.party.name:'the escrow agent on file';}
    else{const obj=scope[level];v=obj?(obj[key]??null):null;
      src=level==='tranche'?'this tranche':level==='offering'?'this offering':level==='certificate'?'this certificate':level;}
    if(v!==null&&v!==undefined&&v!=='')return{value:v,from:src};
  }
  return{value:null,from:null};
}
// Convenience: the value only.
function inherited(scope,field){return resolveField(scope,field).value;}
// Build a scope from a subscription or certificate without the caller having to.
function scopeFor({offering,tranche,subscription,certificate}={}){
  const o=offering||(subscription?db.offerings.find(x=>x.id===subscription.offering_id):null)
    ||(certificate?db.offerings.find(x=>x.id===certificate.offering_id):null)||null;
  let t=tranche||null;
  if(!t&&subscription&&subscription.tranche_id&&o)t=(o.tranches||[]).find(x=>x.id===subscription.tranche_id)||null;
  const party=o&&o.escrow_party_id?partyById(o.escrow_party_id):null;
  return{offering:o,tranche:t,subscription:subscription||null,certificate:certificate||null,party};
}

/* ============================================================================
   DERIVATIONS — facts the record already proves, computed rather than retyped.
   ========================================================================== */
// Deposits an investor has actually made on an offering.
function investorEscrow(offeringId,investorId,subscriptionId){
  offeringId=Number(offeringId);investorId=Number(investorId);
  let rows=db.escrow.filter(e=>e.offering_id===offeringId&&e.investor_id===investorId);
  // When the ledger links rows to subscriptions and a subscription is asked
  // for, answer for that subscription alone — an investor in two tranches has
  // two funding dates, not one.
  if(subscriptionId!=null&&rows.some(e=>e.subscription_id!=null))
    rows=rows.filter(e=>e.subscription_id==null||e.subscription_id===Number(subscriptionId));
  const dep=rows.filter(e=>e.txn_type==='deposit');
  const cleared=dep.filter(e=>e.cleared);
  const ref=rows.filter(e=>e.txn_type==='refund');
  const sum=xs=>xs.reduce((a,e)=>a+(Number(e.amount_cents)||0),0);
  const clearedDeposits=sum(cleared),clearedRefunds=sum(ref.filter(e=>e.cleared));
  return{
    deposits:sum(dep),
    clearedDeposits,
    refunds:sum(ref),
    clearedRefunds,
    // What of this subscriber's money is actually held: refunded funds are
    // not raised, not releasable, and not funding.
    clearedNet:clearedDeposits-clearedRefunds,
    rows:dep,
    // The earliest cleared deposit is the date the money was good.
    fundedDate:cleared.map(e=>e.txn_date).filter(Boolean).sort()[0]||null
  };
}
// What a subscriber owes: the investment, plus pass-through costs where the
// offering charges them.
function subscriptionDue(sub,offering){
  const o=offering||db.offerings.find(x=>x.id===sub.offering_id)||{};
  return(sub.amount_committed_cents||0)+(o.pass_through_costs?(sub.costs_cents||0):0);
}
// Status is a label over four facts. A human only ever chooses 'Withdrawn'.
function derivedSubStatus(s){
  if(!s)return'Prospect';
  if(s.status==='Withdrawn')return'Withdrawn';
  if(s.closing_id)return'Closed';
  if(s.funded_date)return'Funded';
  if(s.sub_signed_date)return'Sub signed';
  if(s.sub_sent_date)return'Sub sent';
  return'Prospect';
}
const SUB_STATUS_RANK={Prospect:0,'Sub sent':1,'Sub signed':2,Funded:3,Closed:4,Withdrawn:5};
// Never let a stale label understate a figure: score off whichever is further on.
function effectiveSubStatus(s){
  const d=derivedSubStatus(s),stored=s&&s.status||'Prospect';
  if(stored==='Withdrawn'||d==='Withdrawn')return'Withdrawn';
  return(SUB_STATUS_RANK[d]??0)>=(SUB_STATUS_RANK[stored]??0)?d:stored;
}
// Units follow from the amount and the price, unless someone overrode them.
function derivedUnits(sub,scope){
  const price=inherited(scope,'price_per_unit_cents');
  if(!price||!sub.amount_committed_cents)return null;
  const raw=sub.amount_committed_cents/price;
  const frac=scope.offering&&scope.offering.fractional_allowed;
  if(frac)return +raw.toFixed(6);
  // Whole units only: when the amount does not divide by the price there is
  // no unit count to assert, and rounding one up would state an allotment the
  // subscription does not support.
  return Math.abs(raw-Math.round(raw))<1e-6?Math.round(raw):null;
}

/* ---- What the record already knows, for prefilling forms ---------------- */
// The subscription an investor holds on an offering, if any.
function subscriptionFor(offeringId,investorId){offeringId=Number(offeringId);investorId=Number(investorId);
  return db.subscriptions.find(s=>s.offering_id===offeringId&&s.investor_id===investorId)||null;}
// Still to come in: what was subscribed for, less what has been deposited.
function outstanding(sub,offering){
  if(!sub)return null;
  const due=subscriptionDue(sub,offering);
  const e=investorEscrow(sub.offering_id,sub.investor_id,sub.id);
  return Math.max(0,due-(e.deposits-e.refunds));}
// The next certificate number for an offering, following whatever numbering is
// already in use rather than inventing one.
// Follows plain sequential numbering only. A roster numbered "A-12" or
// "2026-001" is deliberately left alone rather than having its prefix stripped
// and its next number computed as 2026002.
function nextCertNumber(offeringId){offeringId=Number(offeringId);
  const nums=db.certificates.filter(c=>c.offering_id===offeringId)
    .map(c=>String(c.cert_number??'').trim())
    .filter(s=>/^\d+$/.test(s)).map(Number);
  return String((nums.length?Math.max(...nums):0)+1);}
// The method used on the last deposit for this offering — almost always the
// same wire instructions as the one before.
function lastEscrowMethod(offeringId){offeringId=Number(offeringId);
  // Deposits only: subscribers tend to wire the same way each time, and an
  // escrow agent's ACH fee says nothing about how the next investor will pay.
  const rows=db.escrow.filter(e=>e.offering_id===offeringId&&e.method&&e.txn_type==='deposit');
  return rows.length?rows[rows.length-1].method:null;}
// Date fields open on today unless the firm has turned that off.
function defaultDate(){return settings().date_defaults?todayISO():'';}
// Entity names announce themselves. A guess the user can correct beats a form.
const ENTITY_WORDS=/\b(llc|l\.l\.c|inc|incorporated|corp|corporation|company|co|ltd|limited|lp|l\.p|llp|plc|fund|partners|holdings|trust|foundation|association|ira)\b/i;
function guessEntityType(name){

  if(/\btrust\b/i.test(s))return'Trust';
  if(/\bira\b|\broth\b|\bsep\b/i.test(s))return'IRA / Retirement';

const api={

  // Tranches — sub-series within an offering that may carry their own terms.

    // Monotonic per offering. Reusing max+1 after a delete would have
    // re-attached the deleted tranche's subscriptions to the new one.
    else{o.tranche_seq=Math.max(Number(o.tranche_seq)||0,o.tranches.reduce((m,t)=>Math.max(m,Number(t.id)||0),0))+1;
      o.tranches.push({id:o.tranche_seq,...row});}
    o.updated_at=nowISO();await persist();return o;},
  async deleteTranche(offeringId,trancheId){offeringId=Number(offeringId);trancheId=Number(trancheId);
    const o=db.offerings.find(x=>x.id===offeringId);if(!o)throw new Error('Offering not found');
    o.tranches=(o.tranches||[]).filter(t=>t.id!==trancheId);
    db.subscriptions.forEach(s=>{if(s.offering_id===offeringId&&s.tranche_id===trancheId)s.tranche_id=null;});
    o.updated_at=nowISO();await persist();return o;},

  // Ownership classes — optional fixed split of the whole company by class
  // (e.g. Common = 20%, Class A = 80%). A "sponsor" class is taken for holding
  // the offering rather than for cash (feature: carried/promote interest).
  async saveClasses(offeringId,classes){offeringId=Number(offeringId);
    const o=db.offerings.find(x=>x.id===offeringId);if(!o)throw new Error('Offering not found');
    o.classes=(classes||[]).map((c,idx)=>({id:c.id||idx+1,name:str(c.name)||`Class ${idx+1}`,
      total_percent:numOr(c.total_percent),sponsor:c.sponsor?1:0})).filter(c=>c.name);
    o.updated_at=nowISO();await persist();return o;},

  async listInvestors(){return db.investors.slice().sort((a,b)=>investorSortKey(a).localeCompare(investorSortKey(b)))
    .map(i=>({...i,offering_count:db.subscriptions.filter(s=>s.investor_id===i.id).length}));},
  async getInvestor(id){id=Number(id);const inv=db.investors.find(x=>x.id===id);if(!inv)throw new Error('Investor not found');
    const subscriptions=db.subscriptions.filter(s=>s.investor_id===id).map(s=>{
      const o=db.offerings.find(x=>x.id===s.offering_id);return{...s,offering_name:o?o.name:'(deleted)'};})
      .sort((a,b)=>a.offering_name.localeCompare(b.offering_name));
    return{...inv,subscriptions};},
  async createInvestor(b){const row=investorFromBody(b);if(!row.name)throw new Error(isPersonType(row.entity_type)?'A last name is required':'Investor / entity name is required');
    const inv={id:nextId('investors'),...row,created_at:nowISO(),updated_at:nowISO()};db.investors.push(inv);await persist();return inv;},
  async updateInvestor(id,b){id=Number(id);const inv=db.investors.find(x=>x.id===id);if(!inv)throw new Error('Investor not found');
    const row=investorFromBody(b);if(!row.name)throw new Error(isPersonType(row.entity_type)?'A last name is required':'Investor / entity name is required');Object.assign(inv,row,{updated_at:nowISO()});await persist();return inv;},
  async deleteInvestor(id){id=Number(id);
    const certs=db.certificates.filter(c=>c.investor_id===id).length;
    if(certs)throw new Error(`This holder appears on ${certs} certificate${certs===1?'':'s'}. Remove ${certs===1?'it':'them'} first.`);
    const n=db.subscriptions.filter(s=>s.investor_id===id).length;
    if(n>0)throw new Error(`This investor is on ${n} offering subscription(s). Remove those first.`);
    db.investors=db.investors.filter(x=>x.id!==id);db.escrow.forEach(e=>{if(e.investor_id===id)e.investor_id=null;});await persist();return{ok:true};},

  async listSubscriptions(offeringId){offeringId=Number(offeringId);
    return db.subscriptions.filter(s=>s.offering_id===offeringId).map(s=>{const i=db.investors.find(x=>x.id===s.investor_id);
      return{...s,investor_name:i?investorDisplayName(i):null,investor_sort:i?investorSortKey(i):'',
        entity_type:i?i.entity_type:null,email:i?i.email:null,phone:i?i.phone:null,accredited_status:i?i.accredited_status:null};})
      .sort((a,b)=>(a.investor_sort||'').localeCompare(b.investor_sort||''));},
  async createSubscription(offeringId,b){offeringId=Number(offeringId);const row=subFromBody(b);
    if(!row.investor_id)throw new Error('Investor is required');if(!db.investors.find(x=>x.id===row.investor_id))throw new Error('Investor not found');
    const s={id:nextId('subscriptions'),offering_id:offeringId,...row,created_at:nowISO(),updated_at:nowISO()};db.subscriptions.push(s);await persist();return s;},
  async updateSubscription(id,b){id=Number(id);const s=db.subscriptions.find(x=>x.id===id);if(!s)throw new Error('Subscription not found');
    const row=subFromBody(b);if(!row.investor_id)throw new Error('Investor is required');Object.assign(s,row,{updated_at:nowISO()});await persist();return s;},
  async deleteSubscription(id){id=Number(id);
    const s=db.subscriptions.find(x=>x.id===id);
    if(s){
      // Escrow entries booked against this subscription lose their link but
      // stay in the ledger: the money did move, and a ledger that quietly
      // loses a row will not reconcile.
      db.escrow.forEach(e=>{if(e.subscription_id===id)e.subscription_id=null;});
      db.certificates.forEach(c=>{if(c.subscription_id===id)c.subscription_id=null;});
    }
    db.subscriptions=db.subscriptions.filter(x=>x.id!==id);await persist();return{ok:true};},

  async listEscrow(offeringId){offeringId=Number(offeringId);
    const transactions=db.escrow.filter(e=>e.offering_id===offeringId).map(e=>{const i=db.investors.find(x=>x.id===e.investor_id);
      return{...e,investor_name:i?investorDisplayName(i):null};})
      .sort((a,b)=>(b.txn_date||b.created_at||'').localeCompare(a.txn_date||a.created_at||'')||b.id-a.id);
    return{transactions,summary:escrowSummary(offeringId)};},
  async createEscrow(offeringId,b){offeringId=Number(offeringId);const row=escrowFromBody(b);
    if(!row.amount_cents)throw new Error('Amount must be greater than zero');
    const e={id:nextId('escrow'),offering_id:offeringId,...row,created_at:nowISO()};db.escrow.push(e);await persist();return e;},
  async updateEscrow(id,b){id=Number(id);const e=db.escrow.find(x=>x.id===id);if(!e)throw new Error('Transaction not found');
    const row=escrowFromBody(b);if(!row.amount_cents)throw new Error('Amount must be greater than zero');Object.assign(e,row);await persist();return e;},
  async deleteEscrow(id){id=Number(id);db.escrow=db.escrow.filter(x=>x.id!==id);await persist();return{ok:true};},

  async listTasks(offeringId){offeringId=Number(offeringId);return db.tasks.filter(t=>t.offering_id===offeringId).sort((a,b)=>a.sort_order-b.sort_order||a.id-b.id);},
  async createTask(offeringId,b){offeringId=Number(offeringId);const label=str(b.label);if(!label)throw new Error('Task label is required');
    const order=db.tasks.filter(t=>t.offering_id===offeringId).reduce((m,t)=>Math.max(m,t.sort_order),-1)+1;
    const t={id:nextId('tasks'),offering_id:offeringId,label,done:0,due_date:str(b.due_date),sort_order:order,created_at:nowISO()};db.tasks.push(t);await persist();return t;},
  async updateTask(id,b){id=Number(id);const t=db.tasks.find(x=>x.id===id);if(!t)throw new Error('Task not found');
    if('label'in b&&str(b.label))t.label=str(b.label);if('done'in b)t.done=b.done?1:0;
    if('done_date'in b)t.done_date=str(b.done_date);if('due_date'in b)t.due_date=str(b.due_date);
    if('sort_order'in b)t.sort_order=numOr(b.sort_order,t.sort_order);await persist();return t;},
  async deleteTask(id){id=Number(id);db.tasks=db.tasks.filter(x=>x.id!==id);await persist();return{ok:true};},

  // A reconciliation is a snapshot, not a live comparison. What the app's
  // cleared balance was at the moment it was struck is stored on the record;
  // recomputing it later would let a reconciliation that agreed in July show a
  // variance in August because a deposit cleared in between. Records written
  // before this was stored fall back to the live figure, which is what they
  // have always shown.
  async listReconciliations(offeringId){offeringId=Number(offeringId);const summary=escrowSummary(offeringId);
    const reconciliations=db.reconciliations.filter(r=>r.offering_id===offeringId)
      .sort((a,b)=>(b.statement_date||b.created_at||'').localeCompare(a.statement_date||a.created_at||'')||b.id-a.id)
      .map(r=>{const app=r.app_cleared_cents!=null?r.app_cleared_cents:summary.clearedBalance;
        return{...r,app_cleared_cents:app,difference_cents:r.statement_balance_cents-app,
          historical:r.app_cleared_cents!=null};});
    return{reconciliations,summary};},
  async createReconciliation(offeringId,b){offeringId=Number(offeringId);const bal=dollarsToCents(b.statement_balance);
    if(bal===null)throw new Error('Statement balance is required');
    const app=escrowSummary(offeringId).clearedBalance;
    const r={id:nextId('reconciliations'),offering_id:offeringId,statement_date:str(b.statement_date),
      statement_balance_cents:bal,app_cleared_cents:app,difference_cents:bal-app,
      notes:str(b.notes),created_at:nowISO()};
    db.reconciliations.push(r);await persist();return r;},
  async deleteReconciliation(id){id=Number(id);db.reconciliations=db.reconciliations.filter(x=>x.id!==id);await persist();return{ok:true};},

  // Closings / tranches. A closing records a release of escrow to the issuer and
  // marks the included investors' subscriptions closed.
  async listClosings(offeringId){offeringId=Number(offeringId);
    const closings=db.closings.filter(c=>c.offering_id===offeringId)
      .sort((a,b)=>(b.closing_date||b.created_at||'').localeCompare(a.closing_date||a.created_at||'')||b.id-a.id)
      .map(c=>{
        const subs=db.subscriptions.filter(s=>s.closing_id===c.id).map(s=>{const i=db.investors.find(x=>x.id===s.investor_id);
          return{...s,investor_name:i?investorDisplayName(i):'(deleted investor)'};});
        return{...c,investors:subs,investor_count:subs.length};
      });
    return{closings,totalReleased:closings.reduce((a,c)=>a+(c.amount_released_cents||0),0)};},
  async createClosing(offeringId,b){offeringId=Number(offeringId);
    if(!db.offerings.find(x=>x.id===offeringId))throw new Error('Offering not found');
    const amount=Math.abs(dollarsToCents(b.amount_released)||0);
    const fees=Math.abs(dollarsToCents(b.fees)||0);
    if(!amount&&!fees)throw new Error('Enter an amount released to the issuer.');
    const subIds=(Array.isArray(b.investor_sub_ids)?b.investor_sub_ids:[]).map(Number);
    const count=db.closings.filter(c=>c.offering_id===offeringId).length;
    const label=str(b.label)||`Closing ${count+1}`;
    // A closing recorded without a date is a closing held today: leaving it
    // null stopped certificates accruing and broke their numbering order.
    const date=str(b.closing_date)||todayISO();
    const closing={id:nextId('closings'),offering_id:offeringId,label,closing_date:date,
      amount_released_cents:amount,fees_cents:fees,notes:str(b.notes),created_at:nowISO()};
    db.closings.push(closing);
    // Record the escrow movements so the ledger and balances stay correct.
    if(amount>0)db.escrow.push({id:nextId('escrow'),offering_id:offeringId,investor_id:null,txn_type:'release',
      amount_cents:amount,txn_date:date,method:null,reference:label,cleared:1,notes:`Release to issuer — ${label}`,
      created_at:nowISO(),closing_id:closing.id});
    if(fees>0)db.escrow.push({id:nextId('escrow'),offering_id:offeringId,investor_id:null,txn_type:'fee',
      amount_cents:fees,txn_date:date,method:null,reference:label,cleared:1,notes:`Closing costs — ${label}`,
      created_at:nowISO(),closing_id:closing.id});
    // Link and (optionally) close the included subscriptions.
    const markClosed=b.mark_closed!==false;
    for(const sid of subIds){const s=db.subscriptions.find(x=>x.id===sid&&x.offering_id===offeringId);
      if(s){s.closing_id=closing.id;if(markClosed)s.status='Closed';
      // Remember that the closing supplied this date, so undoing the closing
      // can take it back rather than leaving a subscriber on record as funded
      // on a day nothing arrived.
      if(!s.funded_date){s.funded_date=date;s.funded_date_from_closing=closing.id;}
      s.updated_at=nowISO();}}
    // Auto-issue certificates for the included investors (feature: certificates on closing).
    let certsIssued=0;
    if(b.issue_certs!==false)certsIssued=generateCertificatesForClosing(offeringId,closing,subIds);
    closing.certs_issued=certsIssued;
    await persist();return{...closing,certsIssued};},
  async deleteClosing(id){id=Number(id);const c=db.closings.find(x=>x.id===id);if(!c)throw new Error('Closing not found');
    // Reverse: remove its escrow entries, auto-issued certificates, and un-close its subscriptions.
    db.escrow=db.escrow.filter(e=>e.closing_id!==id);
    db.certificates=db.certificates.filter(cert=>cert.closing_id!==id);
    db.subscriptions.forEach(s=>{if(s.closing_id===id){
      s.closing_id=null;
      // Give back the funding date the closing invented…
      if(s.funded_date_from_closing===id){s.funded_date=null;delete s.funded_date_from_closing;}
      // …and fall back to what the subscription's own dates say, rather than
      // promoting a prospect who never paid to Funded.
      if(s.status==='Closed')s.status=derivedSubStatus({...s,closing_id:null});
      s.updated_at=nowISO();}});
    db.closings=db.closings.filter(x=>x.id!==id);await persist();return{ok:true};},

  // Certificate roster — units/interests issued to holders, possibly across
  // multiple classes/series, with % interest and accrued preferred return.
  async listCertificates(offeringId){offeringId=Number(offeringId);
    const r=computeCertificates(offeringId);
    return{certificates:r.certificates,classNames:r.classNames,classes:r.classes,classCapital:r.classCapital,
      hasClassTotals:r.hasClassTotals,
      totalCapital:r.totalCapital,
      totalAccrued:r.certificates.reduce((a,c)=>a+(c.accrued_calc||0),0),
      totalPercent:r.certificates.reduce((a,c)=>a+(Number(c.total_pct_calc)||0),0)};},
  async createCertificate(offeringId,b){offeringId=Number(offeringId);
    if(!db.offerings.find(x=>x.id===offeringId))throw new Error('Offering not found');
    const row=certFromBody(b);if(!row.cert_number)throw new Error('Certificate # is required');
    const c={id:nextId('certificates'),offering_id:offeringId,...row,created_at:nowISO()};db.certificates.push(c);await persist();return c;},
  async updateCertificate(id,b){id=Number(id);const c=db.certificates.find(x=>x.id===id);if(!c)throw new Error('Certificate not found');
    // Only overwrite what the form actually carried. A form that has no field
    // for holder_name must not be able to erase it — which is exactly what a
    // wholesale Object.assign did to every sponsor certificate.
    const row=certFromBody(b,c);if(!row.cert_number)throw new Error('Certificate # is required');
    Object.assign(c,row,{updated_at:nowISO()});await persist();return c;},
  async deleteCertificate(id){id=Number(id);db.certificates=db.certificates.filter(x=>x.id!==id);await persist();return{ok:true};},
  // Re-assign every certificate number for an offering by funding-date order.
  async renumberCertificates(offeringId){offeringId=Number(offeringId);
    const certs=db.certificates.filter(c=>c.offering_id===offeringId);
    certs.sort((a,b)=>{const fa=a.funded_date||a.issue_date||'',fb=b.funded_date||b.issue_date||'';
      if(fa!==fb)return fa.localeCompare(fb);return (a.sort_index||0)-(b.sort_index||0)||a.id-b.id;});
    certs.forEach((c,idx)=>{c.cert_number=String(idx+1);c.sort_index=idx+1;});
    await persist();return{ok:true};},

  /* ---- Firm settings ---------------------------------------------------- */
  async getSettings(){return settings();},
  async saveSettings(b){
    const cur=settings();
    const row={
      firm_name:str(b.firm_name),firm_address:str(b.firm_address),firm_contact:str(b.firm_contact),
      report_footer:str(b.report_footer)||DEFAULT_REPORT_FOOTER,
      default_exemption:str(b.default_exemption),default_security_type:str(b.default_security_type),
      default_return_rate:numOr(b.default_return_rate),
      default_costs_label:str(b.default_costs_label),
      default_min_investment_cents:dollarsToCents(b.default_min_investment),
      default_escrow_party_id:numOr(b.default_escrow_party_id),

      mask_account_numbers:b.mask_account_numbers?1:0,
      date_defaults:b.date_defaults?1:0,
