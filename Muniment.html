/* ---- Register ------------------------------------------------------------
   columns: {key,label,num,primary,hide,cls,render(row)}
     num      right-aligned tabular figures
     primary  the record's name — the card headline on a phone, unlabelled
     hide     carried on a wide screen, dropped from the phone card
   Every cell carries its column name in data-label, which is what the card
   layout shows in place of the header row. */
/* Sorting. A column that says how to compare itself becomes clickable; the
   rest stay as they are, because some columns have no order worth having
   (a row of buttons) and some carry an order the record itself decided
   (certificates run in funding-date sequence, and re-sorting the roster
   should not look like renumbering it).

   Three states, in this cycle: the record's own order, then ascending, then
   descending, then back. The way out is always the order the file is in. */
function sortValue(c,r,i){
  const v=c.sort?c.sort(r,i):null;
  if(v===null||v===undefined)return null;
  return v;
}
function compareBy(c,dir){
  return(a,b)=>{
    const av=sortValue(c,a.row,a.i),bv=sortValue(c,b.row,b.i);
    // Blanks sink, whichever way the column is pointing: "—" is not a small
    // number, it is the absence of one.
    if(av===null&&bv===null)return a.i-b.i;
    if(av===null)return 1;
    if(bv===null)return -1;
    const n=typeof av==='number'&&typeof bv==='number'
      ? av-bv
      : String(av).localeCompare(String(bv),undefined,{numeric:true,sensitivity:'base'});
    return (n||a.i-b.i)*dir;
  };
}
function dataTable(columns,rows,{foot,rowAttrs,caption,className=''}={}){
  const cols=columns.filter(Boolean);
  const cell=(c,r,i)=>el('td',{
    class:[c.num?'num':'',c.primary?'rec-primary':'',c.hide?'rec-hide':'',c.cls||''].filter(Boolean).join(' '),
    dataset:{label:c.label||''}},...[].concat(c.render(r,i)));
  const indexed=rows.map((row,i)=>({row,i}));
  const tbody=el('tbody',{});
  // null → the record's own order.
  let sortCol=null,sortDir=1;
  function fill(){
    clear(tbody);
    const ordered=sortCol?indexed.slice().sort(compareBy(sortCol,sortDir)):indexed;
    for(const{row,i}of ordered)
      tbody.appendChild(el('tr',rowAttrs?rowAttrs(row,i):{},...cols.map(c=>cell(c,row,i))));
  }
  const heads=cols.map(c=>{
    const th=el('th',{scope:'col',
      class:[c.num?'num':'',c.hide?'rec-hide':'',c.sort?'sortable':''].filter(Boolean).join(' ')});
    if(!c.sort){th.textContent=c.label||'';return th;}
    const arrow=el('span',{class:'sort-arrow','aria-hidden':'true'});
    const btn=el('button',{class:'sort-btn',type:'button',
      onclick:()=>{

/* ---- Modal + forms ------------------------------------------------------ */
let escHandler=null;
let modalOpener=null;   // where focus returns when the dialog closes
function closeModal(){
  const root=document.getElementById('modal-root');clear(root);root.classList.remove('open');
  if(escHandler){document.removeEventListener('keydown',escHandler);escHandler=null;}
  document.body.style.overflow='';
  if(modalOpener&&modalOpener.isConnected)modalOpener.focus();
  modalOpener=null;
}
function openShell(title,contentNode,{wide=false}={}){
  const root=document.getElementById('modal-root');clear(root);
  modalOpener=document.activeElement;
  const titleId='modal-title-'+Math.random().toString(36).slice(2,8);
  const dialog=el('div',{class:`modal ${wide?'modal-wide':''}`,role:'dialog','aria-modal':'true','aria-labelledby':titleId},
    el('div',{class:'modal-head'},el('h2',{id:titleId},title),el('button',{class:'modal-close',type:'button','aria-label':'Close',onclick:closeModal},'@icon:close')),
    contentNode);
  root.appendChild(el('div',{class:'modal-backdrop',onclick:e=>{if(e.target===e.currentTarget)closeModal();}},dialog));
  root.classList.add('open');
  // The page behind the dialog neither scrolls nor takes focus.
  document.body.style.overflow='hidden';
  escHandler=e=>{
    if(e.key==='Escape'){closeModal();return;}
    if(e.key!=='Tab')return;
    const focusables=dialog.querySelectorAll('a[href],button:not([disabled]),input:not([type=hidden]),select,textarea,[tabindex]:not([tabindex="-1"])');
    if(!focusables.length)return;
    const first=focusables[0],last=focusables[focusables.length-1];
    if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}
    else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}
  };
  document.addEventListener('keydown',escHandler);
  return dialog;
}
function confirmDialog(message,{danger=false,confirmLabel='Confirm'}={}){
  return new Promise(resolve=>{
    const body=el('div',{class:'modal-body'},
      el('p',{class:'confirm-text'},message),
      el('div',{class:'modal-actions'},
        el('button',{class:'btn btn-ghost',onclick:()=>{closeModal();resolve(false);}},'Cancel'),
        el('button',{class:`btn ${danger?'btn-danger':'btn-primary'}`,onclick:()=>{closeModal();resolve(true);}},confirmLabel)));
    openShell(danger?'Please confirm':'Confirm',body);
  });
}
// Fields support: type text/textarea/select/checkbox/money/number/date/email/tel,
// plus type:'custom' (f.build(value) → {node, get value}) for widgets like the
// investor typeahead, an optional f.showIf(values)→bool to hide fields, an
// f.onChange(values,api) hook, and f.section headers to group fields.
function formModal({title,fields,values={},submitLabel='Save',onSubmit,wide=false}){
  const inputs={};   // name → element or custom controller ({node, value})
  const rowEls={};   // name → the .form-row wrapper (for showIf)
  const errorBox=el('div',{class:'form-error',style:'display:none'});
  const rows=[];
  for(const f of fields){
    if(f.type==='section'){rows.push(el('div',{class:'form-section-head'},f.label));continue;}
    let input,rowEl;const common={id:`f_${f.name}`,name:f.name,placeholder:f.placeholder||''};
    if(f.type==='hidden'){
      input=el('input',{type:'hidden',id:`f_${f.name}`,name:f.name,value:values[f.name]??''});
      inputs[f.name]=input;rowEls[f.name]=input;rows.push(input);continue;
    }
    if(f.type==='custom'){
      const ctrl=f.build(values[f.name]);inputs[f.name]=ctrl;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{},f.label,f.required?el('span',{class:'req'},' *'):null),
        ctrl.node,f.help?el('div',{class:'field-help'},f.help):null);
    }else if(f.type==='checkbox'){
      input=el('input',{id:`f_${f.name}`,name:f.name,type:'checkbox',checked:!!values[f.name]});
      inputs[f.name]=input;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{class:'form-check'},input,el('span',{},f.label),
          f.help?el('span',{class:'field-help',style:'margin-left:6px'},f.help):null));
    }else{
      if(f.type==='textarea')input=el('textarea',{...common,rows:f.rows||3},values[f.name]??'');
      else if(f.type==='select')input=el('select',common,...(f.options||[]).map(o=>{
        const val=typeof o==='object'?o.value:o,label=typeof o==='object'?o.label:o;
        return el('option',{value:val,selected:String(values[f.name]??'')===String(val)},label);
      }));
      else{
        const type=f.type==='money'?'text':(f.type||'text');
        input=el('input',{...common,type,value:values[f.name]??'',min:f.min,step:f.step,
          inputmode:f.type==='money'||f.type==='number'?'decimal':undefined,
          autocomplete:f.autocomplete||undefined});
        if(f.type==='money')input.classList.add('money-input');
        if(f.mono)input.classList.add('mono');
        if(f.datalist){const dlid=`dl_${f.name}`;input.setAttribute('list',dlid);
          input.__dl=el('datalist',{id:dlid},...f.datalist.map(v=>el('option',{value:v})));}
      }
      inputs[f.name]=input;
      rowEl=el('div',{class:`form-row ${f.half?'half':''}`},
        el('label',{for:`f_${f.name}`},f.label,f.required?el('span',{class:'req'},' *'):null),
        f.type==='money'?el('div',{class:'money-wrap'},el('span',{class:'money-prefix'},'$'),input):input,
        input.__dl||null,
        f.help?el('div',{class:'field-help'},f.help):null);
    }
    rowEls[f.name]=rowEl;rows.push(rowEl);
  }
  function readVal(f){const inp=inputs[f.name];if(!inp)return null;
    if(f.type==='checkbox')return inp.checked;
    let v=inp.value;if(typeof v==='string')v=v.trim();return v===''?null:v;}
  function currentValues(){const v={};for(const f of fields){if(f.type==='section')continue;v[f.name]=readVal(f);}return v;}
  function visible(f){return !f.showIf||f.showIf(currentValues());}
  // `changed` is the name of the field the user just touched, or undefined on
  // the first pass. A derived field uses it to tell "the amount moved, so
  // recompute" from "I am being redrawn, leave the user's answer alone".
  function reflow(changed){
    for(const f of fields){if(f.type==='section'||f.type==='hidden'||!rowEls[f.name])continue;
      if(f.showIf)rowEls[f.name].style.display=f.showIf(currentValues())?'':'none';}
    for(const f of fields){if(f.onChange)f.onChange(currentValues(),{setValue,getValue,changed});}}
  function getValue(name){const f=fields.find(x=>x.name===name);return f?readVal(f):null;}
  function setValue(name,val){const inp=inputs[name];if(!inp)return;
    const f=fields.find(x=>x.name===name);
    if(f&&f.type==='checkbox')inp.checked=!!val;else if('value'in inp)try{inp.value=val==null?'':val;}catch{}}
  for(const f of fields){const inp=inputs[f.name];if(!inp||f.type==='hidden')continue;
    const fire=()=>reflow(f.name);
    // A custom control announces itself by dispatching 'change' on its node,
    // which is how the typeahead tells the form a contact has been chosen.
    if(f.type==='custom'){if(inp.node)inp.node.addEventListener('change',fire);continue;}
    const node=inp;
    node.addEventListener('change',fire);
    if(node.tagName==='INPUT'||node.tagName==='TEXTAREA')node.addEventListener('input',fire);}
  const submitBtn=el('button',{class:'btn btn-primary',type:'submit'},submitLabel);
  const form=el('form',{class:'modal-body form-grid',onsubmit:async e=>{
    e.preventDefault();errorBox.style.display='none';
    const collected={};
    for(const f of fields){if(f.type==='section')continue;collected[f.name]=readVal(f);}
    const missing=fields.find(f=>f.required&&visible(f)&&!collected[f.name]);
    if(missing){errorBox.textContent=`${missing.label} is required.`;errorBox.style.display='block';
      const mi=inputs[missing.name];if(mi&&mi.focus)mi.focus();else if(mi&&mi.node)(mi.node.querySelector('input,select,textarea')||{focus(){}}).focus();return;}
    submitBtn.disabled=true;submitBtn.textContent='Saving…';
    try{await onSubmit(collected);closeModal();}
    catch(err){errorBox.textContent=err.message||'Something went wrong.';errorBox.style.display='block';submitBtn.disabled=false;submitBtn.textContent=submitLabel;}
  }},...rows,errorBox,
    el('div',{class:'modal-actions'},
      el('button',{class:'btn btn-ghost',type:'button',onclick:closeModal},'Cancel'),submitBtn));
  openShell(title,form,{wide});
  reflow();
  const firstField=fields.find(f=>f.type!=='section');
  const first=firstField&&inputs[firstField.name];
  if(first)setTimeout(()=>{if(first.focus)first.focus();else if(first.node){const inp=first.node.querySelector('input,select,textarea');if(inp)inp.focus();}},50);
}

/* ---- Investor typeahead (search-as-you-type) ---------------------------- */
// Returns a controller with .node (to place in a form) and .value (investor id
// as a string, or '' if nothing chosen). Used wherever you pick an investor.
function investorPicker(investors,selectedId,opts={}){
  // opts.allowCreate — offer to create the contact from whatever was typed.
  // opts.preferred   — ids to float to the top (this offering's subscribers).
  // opts.onPick      — called with the chosen investor.
  const byId=new Map(investors.map(i=>[i.id,i]));
  const preferred=new Set((opts.preferred||[]).map(Number));
  let chosen=selectedId!=null&&byId.has(Number(selectedId))?Number(selectedId):'';
  const input=el('input',{type:'text',class:'ac-input',placeholder:'Type a name to search…',autocomplete:'off'});
  const menu=el('div',{class:'ac-menu',style:'display:none'});
  const node=el('div',{class:'ac-wrap'},input,menu);
  if(chosen!=='')input.value=investorDisplayName(byId.get(chosen));
  function hide(){menu.style.display='none';active=-1;}
  let active=-1,shown=[];
  function createRow(){
    const typed=input.value.trim();
    if(!opts.allowCreate||!typed)return null;
    if(investors.some(i=>investorDisplayName(i).toLowerCase()===typed.toLowerCase()))return null;
    return el('div',{class:'ac-item ac-create',onmousedown:async e=>{e.preventDefault();await createFrom(typed);}},
      el('span',{class:'ac-name'},'@icon:plus','Add “'+truncate(typed,40)+'”'),
      el('span',{class:'ac-meta'},guessEntityType(typed)));}
  async function createFrom(typed){
    const entity_type=guessEntityType(typed);
    const body=isPersonType(entity_type)?{entity_type,...splitPersonName(typed)}:{entity_type,name:typed};
    try{
      const created=await api.createInvestor(body);
      investors.push(created);byId.set(created.id,created);
      pick(created);
      toast(`${investorDisplayName(created)} added to the contact book — details can follow.`,'success');
      opts.onPick&&opts.onPick(created);
    }catch(err){toast(err.message,'error');}}
  function render(items){shown=items.slice(0,12);clear(menu);
    const create=createRow();
    if(!shown.length&&!create){menu.appendChild(el('div',{class:'ac-empty'},'No match. Type a full name to add them.'));menu.style.display='block';return;}
    shown.forEach((i,idx)=>menu.appendChild(el('div',{class:'ac-item'+(idx===active?' active':''),
      onmousedown:e=>{e.preventDefault();pick(i);}},
      el('span',{class:'ac-name'},investorListName(i)),
      el('span',{class:'ac-meta'},preferred.has(i.id)?'On this offering':(i.entity_type||'')))));
    if(create)menu.appendChild(create);
    menu.style.display='block';}
  function pick(i){chosen=i.id;input.value=investorDisplayName(i);hide();
    opts.onPick&&opts.onPick(i);
    // Tell whatever form holds this control that its value moved.
    node.dispatchEvent(new Event('change',{bubbles:true}));}
  // Subscribers on this offering sort first: they are who a deposit or a
  // certificate almost always belongs to.
  const order=(a,b)=>(preferred.has(b.id)-preferred.has(a.id))||investorSortKey(a).localeCompare(investorSortKey(b));
  function filter(){const q=input.value.trim().toLowerCase();
    if(!q)return investors.slice().sort(order);
    return investors.filter(i=>investorDisplayName(i).toLowerCase().includes(q)||investorListName(i).toLowerCase().includes(q)||String(i.email||'').toLowerCase().includes(q)||String(i.tax_id||'').includes(q))
      .sort(order);}
  input.addEventListener('input',()=>{const had=chosen;chosen='';active=-1;render(filter());
    if(had!=='')node.dispatchEvent(new Event('change',{bubbles:true}));});
  input.addEventListener('focus',()=>render(filter()));
  input.addEventListener('blur',()=>setTimeout(hide,160));
  input.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'){e.preventDefault();if(menu.style.display==='none')render(filter());active=Math.min(active+1,shown.length-1);render(shown);}
    else if(e.key==='ArrowUp'){e.preventDefault();active=Math.max(active-1,0);render(shown);}
    else if(e.key==='Enter'){
      if(menu.style.display==='none')return;
      if(shown[active]){e.preventDefault();pick(shown[active]);}
      // Nothing highlighted but a creatable name typed: Enter creates it, so
      // the keyboard can do what the mouse can.
      else if(opts.allowCreate&&input.value.trim()&&!shown.length){e.preventDefault();createFrom(input.value.trim());}
    }
    else if(e.key==='Escape'){hide();}});
  return {node,get value(){return chosen===''?'':String(chosen);}};
}

   ========================================================================== */
const LS_KEY='muniment:data';
// Data saved under earlier names, newest first. Migrated on load; nothing is lost in the rename.
const LS_KEYS_OLD=['capitalvault:data','offeringbook:data'];
const THEME_KEY='muniment:theme';
// The document's shape. Bumping this runs the migrations below on load.
const SCHEMA_VERSION=3;
const COLLECTIONS=['offerings','investors','subscriptions','escrow','tasks','reconciliations','closings','certificates','parties','activity',
  // Added in v3.
  'distributions','transfers','capital_calls','state_filings'];
const EMPTY=()=>({meta:{version:SCHEMA_VERSION,app:'Muniment',rev:0},
  seq:{offerings:0,investors:0,subscriptions:0,escrow:0,tasks:0,reconciliations:0,closings:0,certificates:0,parties:0,activity:0,
    distributions:0,transfers:0,capital_calls:0,state_filings:0},
  offerings:[],investors:[],subscriptions:[],escrow:[],tasks:[],reconciliations:[],closings:[],certificates:[],
  // parties: issuers, escrow agents and counsel, entered once and picked thereafter.
  parties:[],
  // activity: everything that has changed the record — what the app proposed
  // and you accepted, and every edit and deletion made by hand. A figure in a
  // securities file should be traceable to when it arrived and what put it there.
  activity:[],
  // distributions: money paid out to holders after a closing, and what each
  // holder's share of it retired.
  distributions:[],
  // transfers: the chain of title. A certificate is cancelled and a successor
  // issued; neither row is ever silently rewritten.
  transfers:[],
  // capital_calls: dated obligations against a commitment, for offerings that
  // fund in stages rather than in one payment.
  capital_calls:[],
  // state_filings: blue sky / state notice filings, one row per state.
  state_filings:[],
  // settings: the firm's own constants — see SETTINGS_DEFAULTS.
  settings:{},
  // dismissed: suggestion keys waved off, with when. Keyed on the fact, so a
  // dismissal sticks until the underlying figures change.
  dismissed:{}});
let db=EMPTY();
let fileHandle=null;
let fileName=null;
// Set when the stored data could not be read. Nothing is written while it is
// true, so an unreadable document is never replaced by an empty one. Any
// deliberate act that replaces the document — opening a file, creating one,
// importing, or starting fresh — is the decision it was waiting for, and
// clears it through adoptDocument().
let readOnly=false;
// Call whenever the user has knowingly chosen what the document should be.
function adoptDocument(next){
  if(next)db=next;
  if(readOnly){readOnly=false;toast('Saving has resumed.','success');}
}

/* ---- Migrations ----------------------------------------------------------
   Adding a key needs no migration: normalize merges defaults in. These are
   for the other kind of change — where an existing record would otherwise be
   read under a rule it was not written under. Each entry states the version it
   produces, and they run in order for any document below it.

   The rule they exist to keep: a figure that was true before an upgrade is
   still true after it. A migration writes down what the old code assumed
   implicitly, so a new default cannot silently restate an old certificate. */
const MIGRATIONS=[
  {to:3,apply(d){
    // Accrual was simple interest on a 365-day year, everywhere, with no way
    // to say otherwise. Write that down on every certificate that already
    // exists so offering-level conventions only ever govern new ones.
    for(const c of d.certificates)if(c.accrual_convention==null)c.accrual_convention='simple/365';
    // Certificate numbering ran off two different rules (one accepted plain
    // integers only, the other stripped non-digits). Infer the format each
    // offering was actually using and record it, so both paths agree from here.
    for(const o of d.offerings){
      if(o.cert_number_format!=null)continue;
      const nums=d.certificates.filter(c=>c.offering_id===o.id)
        .map(c=>String(c.cert_number??'').trim()).filter(Boolean);
      const parsed=nums.map(s=>s.match(/^(.*?)(\d+)$/)).filter(Boolean);
      if(!parsed.length){o.cert_number_format=null;continue;}
      // The commonest prefix wins; the widest zero-padding is kept, since
      // narrowing it would renumber certificates already issued.
      const tally=new Map();
      for(const m of parsed)tally.set(m[1],(tally.get(m[1])||0)+1);
      const prefix=[...tally.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0]))[0][0];
      const pad=parsed.filter(m=>m[1]===prefix)
        .reduce((w,m)=>Math.max(w,/^0\d/.test(m[2])?m[2].length:1),1);
      o.cert_number_format={prefix,pad};
    }
  }}
];
function migrate(d){
  const from=Number(d.meta&&d.meta.version)||0;
  for(const m of MIGRATIONS)if(from<m.to)m.apply(d);
  d.meta.version=SCHEMA_VERSION;
  return d;
}

function normalize(obj){
  const base=EMPTY();
  const out={...base,...obj,meta:{...base.meta,...(obj.meta||{})},seq:{...base.seq,...(obj.seq||{})},
    // Merged rather than replaced, exactly as meta and seq are, so a file
    // written by an earlier version gains the keys without losing its own.
    settings:{...base.settings,...(obj.settings||{})},
    dismissed:{...base.dismissed,...(obj.dismissed||{})}};
  // The document is Muniment's once it has been adopted; nothing validates
  // against these fields, they simply say who wrote the file last.
  out.meta.app='Muniment';
  for(const k of COLLECTIONS)
    out[k]=Array.isArray(out[k])?out[k].filter(r=>r&&typeof r==='object'):[];
  // Run before the seq pass, so a migration that adds rows still gets counters
  // ahead of the ids it created.
  migrate(out);
  // keep seq counters ahead of any existing ids
  for(const k of COLLECTIONS){
    const maxId=out[k].reduce((m,r)=>Math.max(m,Number(r.id)||0),0);
    out.seq[k]=Math.max(Number(out.seq[k])||0,maxId);
  }
  out.meta.rev=Number(out.meta.rev)||0;
  return out;
}
function parseDB(text){
  const obj=JSON.parse(text);
  if(typeof obj!=='object'||obj===null)throw new Error('Not a valid Muniment data file');
  if(isEnvelope(obj))throw new Error('This file is protected by a passphrase. Open it from the file buttons so it can be unlocked.');
  return normalize(obj);
}
function nextId(kind){db.seq[kind]=(db.seq[kind]||0)+1;return db.seq[kind];}

/* ============================================================================
   PASSPHRASE PROTECTION

   A subscription file holds unmasked Social Security and taxpayer numbers
   beside escrow account numbers. Masking them in lists is a courtesy to
   whoever is looking over your shoulder; it does nothing for the file itself,
   which until now was readable by anyone who could open it — in a sync folder,
   on a stolen laptop, in a backup.

   Sealed with AES-GCM under a key derived from a passphrase by PBKDF2. The key
   is derived once and held for the session: deriving it costs most of a second
   by design, and a write happens on every keystroke that lands.

   The passphrase is not stored, recorded, hinted at or recoverable. That is
   the property that makes this worth having, and the reason setting one asks
   twice and says so plainly.
   ========================================================================== */
const ENC_FORMAT='muniment-encrypted';
// OWASP's current floor for PBKDF2-HMAC-SHA256. Recorded in the envelope so a
// file sealed today still opens when the number is raised tomorrow.
const ENC_ITERATIONS=600000;
const ENC_AVAILABLE=!!(globalThis.crypto&&crypto.subtle);
function isEnvelope(o){return !!o&&typeof o==='object'&&o.format===ENC_FORMAT;}
function b64(bytes){let s='';const b=new Uint8Array(bytes);
  for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return btoa(s);}
function unb64(s){const bin=atob(String(s||''));const out=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)out[i]=bin.charCodeAt(i);return out;}

// The derived key and the salt it was derived with. Session-only: closing the
// tab forgets them, which is the point.
let cryptoKey=null;
let cryptoSalt=null;
let cryptoIterations=ENC_ITERATIONS;
function isProtected(){return !!cryptoKey;}

async function deriveKey(passphrase,salt,iterations){
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(passphrase),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations,hash:'SHA-256'},material,
    {name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function seal(plaintext){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},cryptoKey,new TextEncoder().encode(plaintext));
  return JSON.stringify({
    format:ENC_FORMAT,v:1,app:'Muniment',
    // Written in the clear on purpose: this is what tells a future reader how
    // to open the file, and none of it weakens the key.
    note:'Encrypted with AES-GCM under a key derived from a passphrase by PBKDF2-HMAC-SHA256. Without the passphrase this file cannot be read.',
    kdf:{name:'PBKDF2',hash:'SHA-256',iterations:cryptoIterations,salt:b64(cryptoSalt)},
    iv:b64(iv),data:b64(new Uint8Array(ct))},null,2);
}
// Throws on a wrong passphrase — AES-GCM authenticates, so a wrong key fails
// rather than yielding plausible rubbish.
async function unseal(env,passphrase){
  const salt=unb64(env.kdf&&env.kdf.salt);
  const iterations=Number(env.kdf&&env.kdf.iterations)||ENC_ITERATIONS;
  const key=await deriveKey(passphrase,salt,iterations);
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(env.iv)},key,unb64(env.data));
  return{text:new TextDecoder().decode(plain),key,salt,iterations};
}

// What should actually be written — sealed when a passphrase is set, plain
// when it is not.
async function storageText(){
  const plain=serialize();
  if(!cryptoKey)return plain;
  try{return await seal(plain);}
  catch(e){
    // Never fall back to writing the plaintext: a user who set a passphrase
    // would have no way of knowing the file stopped being protected.
    setSaveState('error');
    toast('Could not encrypt this change, so nothing was written. Your data is unchanged on disk.','error');
    throw e;
  }
}

/* Asking for the passphrase. Returns the decrypted text, or throws if the
   person declines — in which case the caller must leave the document alone. */
function promptPassphrase(env,{title='Unlock this data',intro,confirmLabel='Unlock'}={}){
  return new Promise((resolve,reject)=>{
    const input=el('input',{type:'password',class:'inline-input grow',autocomplete:'current-password',
      'aria-label':'Passphrase',placeholder:'Passphrase'});
    const errorBox=el('div',{class:'form-error',style:'display:none'});
    const submit=el('button',{class:'btn btn-primary',type:'submit'},confirmLabel);
    const form=el('form',{class:'modal-body form-grid',onsubmit:async e=>{
      e.preventDefault();
      if(!input.value){errorBox.textContent='Enter the passphrase.';errorBox.style.display='';return;}
      submit.disabled=true;submit.textContent='Unlocking…';
      try{
        const out=await unseal(env,input.value);
        closeModal();resolve(out);
      }catch(err){
        errorBox.textContent='That passphrase does not open this file.';errorBox.style.display='';
        submit.disabled=false;submit.textContent=confirmLabel;input.select();
      }
    }},
      el('p',{class:'field-help'},intro||'This data is protected by a passphrase. It cannot be read without it, and there is no way to recover it.'),
      errorBox,
      el('div',{class:'form-row'},el('label',{for:'passphrase-input'},'Passphrase'),input),
      el('div',{class:'modal-actions'},
        el('button',{class:'btn btn-ghost',type:'button',onclick:()=>{closeModal();reject(new Error('cancelled'));}},'Cancel'),
        submit));
    input.id='passphrase-input';
    openShell(title,form);
    setTimeout(()=>input.focus(),40);
  });
}

// The sealed document found at boot, held until it is opened. While it is set,
// nothing is loaded and nothing is written — the same guard an unreadable
// document gets, for the same reason.
let lockedEnvelope=null;
async function unlockAtBoot(){
  if(!lockedEnvelope)return true;
  if(!ENC_AVAILABLE){
    setTimeout(()=>toast('This data is encrypted, and this browser does not offer the cryptography needed to open it. Nothing has been loaded and nothing will be written over it.','error'),400);
    return false;
  }
  try{
    const out=await promptPassphrase(lockedEnvelope,{
      intro:'The data held in this browser is protected by a passphrase. Nothing is loaded, and nothing will be saved over it, until it is entered.'});
    cryptoKey=out.key;cryptoSalt=out.salt;cryptoIterations=out.iterations;
    lockedEnvelope=null;
    adoptDocument(normalize(JSON.parse(out.text)));
    renderFileStatus();
    return true;
  }catch{return false;}
}
// The screen behind a document that has not been opened. It says what is
// there and offers the only thing that helps.
function lockedView(){
  return el('div',{class:'error-state'},
    el('h2',{},'This data is protected'),
    el('p',{},'The records held in this browser are encrypted. They cannot be read, and nothing will be written over them, until the passphrase is entered.'),
    el('div',{style:'display:flex;gap:8px;justify-content:center;flex-wrap:wrap'},
      el('button',{class:'btn btn-primary',onclick:async()=>{if(await unlockAtBoot())refresh();}},'Unlock…'),
      FSA?el('button',{class:'btn btn-ghost',onclick:openDataFile},'Open a different file…'):
        el('button',{class:'btn btn-ghost',onclick:importFile},'Import a different file…')));
}

// Reads a document that may be sealed, unlocking it if so. `what` names the
// source for the dialog, so "this browser" and "muniment-data.json" read
// differently to the person being asked.
async function readDocument(text,what){
  let obj;
  try{obj=JSON.parse(text);}catch{throw new Error('Not a valid Muniment data file.');}
  if(typeof obj!=='object'||obj===null)throw new Error('Not a valid Muniment data file.');
  if(!isEnvelope(obj))return normalize(obj);
  if(!ENC_AVAILABLE)throw new Error('This data is encrypted, and this browser does not offer the cryptography needed to open it.');
  const out=await promptPassphrase(obj,{
    intro:`${what||'This data'} is protected by a passphrase. It cannot be read without it, and there is no way to recover it.`});
  // Hold the key so every later write seals with the same salt.
  cryptoKey=out.key;cryptoSalt=out.salt;cryptoIterations=out.iterations;
  return normalize(JSON.parse(out.text));
}

/* Persistence */
let saveTimer=null;
let batch=null;            // the pending write everyone currently waiting shares
let batchOpened=0;         // when it opened, so a busy stretch still gets written
let writing=Promise.resolve(); // one file write at a time, never interleaved
let quotaWarned=false;
const SAVE_DEBOUNCE=250,SAVE_MAX_WAIT=1500;
function serialize(){return JSON.stringify(db,null,2);}
// The exact bytes the next file write should contain, prepared by persist().
// Sealing is asynchronous and a page being hidden is no time to start an
// encryption; the text is settled while there is still time to settle it.
let pendingText=null;

// Coalesce rapid edits into a single write, but resolve every caller only once
// a write that contains their change has completed.
function scheduleWrite(){
  if(!batch){let done;const promise=new Promise(r=>{done=r;});batch={promise,done};batchOpened=Date.now();}
  const waited=Date.now()-batchOpened;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(flushWrite,Math.max(0,Math.min(SAVE_DEBOUNCE,SAVE_MAX_WAIT-waited)));
  return batch.promise;
}
async function flushWrite(){
  const mine=batch;batch=null;
  if(!mine)return;
  writing=writing.then(async()=>{
    if(!fileHandle){setSaveState('local');return;}
    try{
      const w=await fileHandle.createWritable();
      await w.write(new Blob([pendingText??serialize()],{type:'application/json'}));
      await w.close();
      setSaveState('saved');
    }catch(e){setSaveState('error');toast('Could not save to your data file: '+e.message,'error');}
  });
  await writing;
  mine.done();
}
// A debounced write that never happens is a lost edit. When the page is being
// hidden or unloaded, write now rather than on the timer.
function flushOnExit(){
  if(!batch||readOnly)return;
  clearTimeout(saveTimer);
  flushWrite();
}
addEventListener('pagehide',flushOnExit);
addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')flushOnExit();});

/* ---- Two tabs, one document ---------------------------------------------
   Each tab holds the whole document in memory and writes it entire, so the
   later write wins and the other tab's work goes without a word. It cannot be
   merged safely — these are ledgers, not text — but it can be *noticed*: every
   write stamps a revision and a beacon, and a tab whose revision has been
   overtaken says so and stops writing until the person decides. */
const BEACON_KEY='muniment:beacon';
const TAB_ID=Math.random().toString(36).slice(2,10);
// Set when another tab has written since we last did. Nothing is saved while
// it holds, exactly as an unreadable document holds saving.
let staleTab=false;
let staleWarned=false;
function writeBeacon(){
  try{localStorage.setItem(BEACON_KEY,JSON.stringify({tab:TAB_ID,rev:db.meta.rev,at:Date.now()}));}catch{}
}
function onBeacon(){
  let b=null;
  try{b=JSON.parse(localStorage.getItem(BEACON_KEY)||'null');}catch{}
  if(!b||b.tab===TAB_ID)return;
  if((Number(b.rev)||0)<(Number(db.meta.rev)||0))return;   // we are still ahead
  staleTab=true;setSaveState('error');
  if(staleWarned)return;
  staleWarned=true;
  toast('Another tab has this data file open and has saved over what is here. Nothing more will be saved from this tab.','error',
    {label:'Load what the other tab saved',run:async()=>{
      const raw=localStorage.getItem(LS_KEY);
      if(!raw){toast('Nothing to load.','error');return;}
      try{db=parseDB(raw);staleTab=false;staleWarned=false;setSaveState('local');refresh();
        toast('Loaded. Saving has resumed.','success');}
      catch(e){toast('Could not read what the other tab saved: '+e.message,'error');}}});
}
addEventListener('storage',e=>{if(e.key===BEACON_KEY)onBeacon();});

/* ---- Generations ---------------------------------------------------------
   One copy of the file is one copy: a bad edit reaches it on the next write
   and there is nothing behind it. A short ring of previous states is kept
   beside the file handle in IndexedDB, so the state before a mistake can be
   read back. It is not a backup — it lives in the same browser — but it does
   answer the failure this app can actually cause. */
const GEN_KEEP=12;
const GEN_MIN_GAP=90000;   // at most one generation every 90 seconds
let lastGenAt=0;
async function keepGeneration(text){
  const now=Date.now();
  if(now-lastGenAt<GEN_MIN_GAP)return;
  lastGenAt=now;
  try{
    const index=(await idbGet('generations'))||[];
    const stamp=new Date(now).toISOString();
    await idbSet('gen:'+stamp,text);
    index.push({at:stamp,bytes:text.length,records:countRecords(db)});
    while(index.length>GEN_KEEP){const old=index.shift();await idbDel('gen:'+old.at);}
    await idbSet('generations',index);
  }catch{}
}

async function persist(){
  if(readOnly){toast('Saving is held: the data already in this browser could not be read. Open your data file, or import a backup, to resume.','error');return;}
  if(staleTab){toast('Saving is held: another tab has saved over this data. Load what it saved, or close this tab.','error');return;}
  db.meta.rev=(Number(db.meta.rev)||0)+1;
  // Sealed here, once, rather than inside the debounced write: this is the
  // last point at which failing to encrypt can still stop the write.
  let text;
  try{text=await storageText();}
  catch{db.meta.rev=(Number(db.meta.rev)||0)-1;return;}
  pendingText=text;
  try{localStorage.setItem(LS_KEY,text);quotaWarned=false;writeBeacon();}
  catch(e){
    // Swallowing this used to leave the dot claiming "Saved in this browser"
    // long after the browser had stopped accepting the write.
    if(!quotaWarned){quotaWarned=true;setSaveState('error');
      toast('This browser will not hold any more data. Connect a data file, or save a copy now.','error');}
  }
  keepGeneration(text);
  if(!fileHandle){setSaveState('local');return;}
  setSaveState('saving');
  await scheduleWrite();
}

/* IndexedDB (just to remember the chosen file between sessions) */
// Internal IndexedDB name kept unchanged across the rename so a previously
// connected data file still reconnects with one click after the rebrand.
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('offeringbook',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){try{const d=await idbOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}catch{}}
async function idbGet(k){try{const d=await idbOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readonly');const rq=t.objectStore('kv').get(k);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);});}catch{return null;}}
async function idbDel(k){try{const d=await idbOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}catch{}}

const FSA='showSaveFilePicker'in window;
// On iOS and iPadOS every browser is WebKit, so the File System Access API is
// not a different-browser away — the honest advice there is different.
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
async function verifyPermission(handle,rw){
  const opts={mode:rw?'readwrite':'read'};
  if((await handle.queryPermission(opts))==='granted')return true;
  if((await handle.requestPermission(opts))==='granted')return true;
  return false;
}
async function newDataFile(){
  try{
    const h=await window.showSaveFilePicker({suggestedName:'muniment-data.json',
      types:[{description:'Muniment data',accept:{'application/json':['.json']}}]});
    fileHandle=h;fileName=h.name;adoptDocument(null);await persist();await idbSet('fileHandle',h);renderFileStatus();
    toast('Data file created — your changes now save here.','success');
  }catch(e){if(e.name!=='AbortError')toast('Could not create file: '+e.message,'error');}
}
async function openDataFile(){
  try{
    const[h]=await window.showOpenFilePicker({types:[{description:'Muniment data',accept:{'application/json':['.json']}}]});
    if(!(await verifyPermission(h,true)))throw new Error('Permission to the file was denied.');
    const text=await(await h.getFile()).text();
    // Sealed files are unlocked here rather than rejected; the key is held for
    // the session so every later write seals with the same salt.
    const parsed=await readDocument(text,h.name);
    if(hasData(db)){
      const ok=await confirmDialog('Opening this file will replace the data currently loaded in this browser. Your other data file (if any) is not affected. Continue?',{danger:true,confirmLabel:'Open file'});
      if(!ok)return;
    }
    adoptDocument(parsed);fileHandle=h;fileName=h.name;await persist();await idbSet('fileHandle',h);renderFileStatus();refresh();
    toast('Data file opened.','success');
  }catch(e){if(e.name!=='AbortError')toast('Could not open file: '+e.message,'error');}
}
async function reopenFromHandle(h){
  try{
    if(!(await verifyPermission(h,true))){toast('Permission to the file was denied.','error');return;}
    const text=await(await h.getFile()).text();
    const parsed=await readDocument(text,h.name);
    // The browser mirror can legitimately be ahead of the file: a change made
    // in the last moments before the tab closed reaches localStorage
    // immediately but the file only after the write settles. Replacing
    // silently would throw that work away, so say which is which and let the
    // user choose.
    if(hasData(db)&&!sameDocument(db,parsed)){
      const mine=countRecords(db),theirs=countRecords(parsed);
      const ok=await confirmDialog(
        `The file holds ${theirs} record${theirs===1?'':'s'}; this browser holds ${mine}. Reconnecting replaces what is in the browser with what is in the file. Continue?`,
        {danger:mine>theirs,confirmLabel:'Use the file'});
      if(!ok)return;
    }
    adoptDocument(parsed);fileHandle=h;fileName=h.name;await persist();renderFileStatus();refresh();
    toast('Reconnected to '+h.name,'success');
  }catch(e){toast('Could not reopen file: '+e.message+' — it may have moved.','error');}
}
function disconnectFile(){fileHandle=null;fileName=null;idbSet('fileHandle',null);renderFileStatus();toast('Disconnected. Changes are still kept in this browser.','info');}
function stamp(){return new Date().toISOString().replace(/[:.]/g,'-').slice(0,19);}
async function downloadCopy(){
  // A copy of a protected file is protected too, or the protection was
  // theatre: the copy is the one most likely to end up somewhere else.
  let text;
  try{text=await storageText();}catch{return;}
  const blob=new Blob([text],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=el('a',{href:url,download:`muniment-backup-${stamp()}.json`});document.body.appendChild(a);a.click();a.remove();
  URL.revokeObjectURL(url);
  // Remembered so the app can say how long it has been since the last one.
  db.settings={...db.settings,last_copy_at:nowISO()};
  persist();
  toast('Backup copy downloaded.','success');
}
function importFile(){
  const inp=el('input',{type:'file',accept:'.json,application/json'});
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
    try{const parsed=await readDocument(await f.text(),f.name);
      if(hasData(db)&&!(await confirmDialog('Importing will replace the data currently loaded. Continue?',{danger:true,confirmLabel:'Import'})))return;
      adoptDocument(parsed);await persist();renderFileStatus();refresh();toast('Data imported.','success');
    }catch(e){toast('Import failed: '+e.message,'error');}};
  inp.click();
}
// Everything a user could lose, not just the two headline collections: a firm
// that has set up its settings and party directory but not yet opened an
// offering still has plenty to lose.
function countRecords(d){
  return COLLECTIONS.reduce((n,k)=>n+((d[k]&&d[k].length)||0),0)
    +Object.keys(d.settings||{}).length;
}
function hasData(d){return countRecords(d)>0;}
// Two documents that would be identical on disk need no replace warning.
function sameDocument(a,b){try{return JSON.stringify(a)===JSON.stringify(b);}catch{return false;}}

let pendingHandle=null;
function setSaveState(s){
  const dot=document.querySelector('#file-status .dot');const lbl=document.querySelector('#file-status .save-label');
  if(!dot||!lbl)return;
  dot.className='dot '+s;
  lbl.textContent={saving:'Saving…',saved:'Saved to file',error:'Save failed',local:'Saved in this browser'}[s]||'';
}
function renderFileStatus(){

  if(fileHandle){
    root.appendChild(el('div',{class:'file-line'},el('span',{class:'dot saved'}),el('span',{class:'file-name',title:fileName},fileName)));
    root.appendChild(el('div',{class:'file-sub save-label'},'Saved to file'));

      el('button',{class:'mini-btn',onclick:downloadCopy},'Save a copy'),

  }else if(pendingHandle){
    root.appendChild(el('div',{class:'file-line'},el('span',{class:'dot local'}),el('span',{class:'file-name'},'Not connected')));
    root.appendChild(el('div',{class:'file-sub'},'Changes are kept in this browser.'));
    root.appendChild(el('div',{class:'file-btns'},
      el('button',{class:'mini-btn',onclick:()=>reopenFromHandle(pendingHandle)},'Reconnect '+truncate(pendingHandle.name,16)),
      FSA?el('button',{class:'mini-btn',onclick:openDataFile},'Open…'):null));
  }else{
    root.appendChild(el('div',{class:'file-line'},el('span',{class:'dot local'}),el('span',{class:'file-name save-label'},'Saved in this browser')));
    if(FSA){

      root.appendChild(el('div',{class:'file-btns'},
        el('button',{class:'mini-btn',onclick:newDataFile},'New file…'),
        el('button',{class:'mini-btn',onclick:openDataFile},'Open file…'),
        el('button',{class:'mini-btn',onclick:downloadCopy},'Save a copy')));
    }else{
      root.appendChild(el('div',{class:'file-sub'},IOS
        ?'iPhones and iPads hold your records in the browser. Use “Save a copy” for backups — or open this file on a computer for autosave.'
        :'This browser can’t save to a chosen file. Use Save a copy / Import.'));
      root.appendChild(el('div',{class:'file-btns'},
        el('button',{class:'mini-btn',onclick:downloadCopy},'Save a copy'),

    }
  }
}
function truncate(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}

/* ---- Computed summaries ------------------------------------------------- */
const SIGN={deposit:1,release:-1,refund:-1,fee:-1};
// Every amount is coerced: one null amount_cents used to turn every balance
// on every screen into $NaN, which reads as a broken app rather than a bad row.
function escrowSummary(offeringId){
  const rows=db.escrow.filter(e=>e.offering_id===offeringId);
  const by={deposit:0,release:0,refund:0,fee:0},cl={deposit:0,release:0,refund:0,fee:0};
  // hasOwnProperty rather than `in`: `in` walks the prototype, so a row typed
  // 'constructor' or 'toString' would have been accepted and added.
  for(const r of rows){if(Object.prototype.hasOwnProperty.call(by,r.txn_type)){const amt=Number(r.amount_cents)||0;
    by[r.txn_type]+=amt;if(r.cleared)cl[r.txn_type]+=amt;}}
  const book=by.deposit*SIGN.deposit+by.release*SIGN.release+by.refund*SIGN.refund+by.fee*SIGN.fee;
  const cleared=cl.deposit*SIGN.deposit+cl.release*SIGN.release+cl.refund*SIGN.refund+cl.fee*SIGN.fee;
  return{deposits:by.deposit,releases:by.release,refunds:by.refund,fees:by.fee,clearedDeposits:cl.deposit,
    // Subscriber money actually held: cleared deposits less cleared refunds.
    // This, not the gross deposit figure, is what the minimum raise is tested
    // against — a deposit that cleared and was then refunded is not raised.
    clearedNetDeposits:cl.deposit-cl.refund,clearedRefunds:cl.refund,
    bookBalance:book,clearedBalance:cleared,pendingBalance:book-cleared};
}
function subscriptionSummary(offeringId){
  const all=db.subscriptions.filter(s=>s.offering_id===offeringId);
  // A withdrawn subscription is not committed capital. It stays on the record
  // and out of every total.
  const subs=all.filter(s=>s.status!=='Withdrawn');
  const committed=subs.reduce((a,s)=>a+(s.amount_committed_cents||0),0);
  // Scored off the effective status, so a label left behind by its own dates
  // cannot understate the signed figure on a document handed to a client.
  const signed=subs.filter(s=>['Sub signed','Funded','Closed'].includes(effectiveSubStatus(s)))
    .reduce((a,s)=>a+(s.amount_committed_cents||0),0);
  return{investorCount:subs.length,committed,signedCommitted:signed,
    withdrawnCount:all.length-subs.length,
    withdrawn:all.filter(s=>s.status==='Withdrawn').reduce((a,s)=>a+(s.amount_committed_cents||0),0)};
}
// Whole days between two calendar dates. Both ends are normalised to local
// midnight first: measuring from the current instant made the answer drift
// through the day and flip a day early either side of a DST boundary.
// Accepts a bare date or a full ISO timestamp — appending 'T00:00:00' to
// something that already carried a time produced an invalid date, and the row
// then disappeared from the dashboard rather than reporting itself.
function dayOf(dateStr){if(!dateStr)return null;const d=new Date(String(dateStr).slice(0,10)+'T00:00:00');return isNaN(d)?null:d;}
function daysUntil(dateStr,today=new Date()){
  const t=dayOf(dateStr);if(!t)return null;
  const t0=new Date(today.getFullYear(),today.getMonth(),today.getDate());
  return Math.round((t-t0)/86400000);
}
function offeringSummary(o){
  const escrow=escrowSummary(o.id),subs=subscriptionSummary(o.id);
  const targetMin=o.target_min_cents||0;
  const raised=escrow.clearedNetDeposits;
  const minRaiseMet=targetMin>0&&raised>=targetMin;
  // Floored, not rounded: 99.6% must not read as 100% next to a badge saying
  // the minimum has not been met.
  const minRaisePct=targetMin>0?Math.min(100,Math.floor((raised/targetMin)*100)):null;
  const tasks=db.tasks.filter(t=>t.offering_id===o.id);
  const closings=db.closings.filter(c=>c.offering_id===o.id);
  const passCosts=db.subscriptions.filter(s=>s.offering_id===o.id).reduce((a,s)=>a+(s.costs_cents||0),0);
  return{escrow,subscriptions:subs,minRaiseMet,minRaisePct,daysToFinalClose:daysUntil(o.final_close_date),
    tasksTotal:tasks.length,tasksDone:tasks.filter(t=>t.done).length,passThroughCosts:passCosts,
    closingsCount:closings.length,totalReleased:closings.reduce((a,c)=>a+(c.amount_released_cents||0),0)};
}

/* ---- Certificate computation (% interest, accrued return) ---------------
   Everything here takes an as-of date. It used to measure to today and only
   to today, which meant a figure that moved every morning — including on a
   report headed with an as-of date, where the two then disagreed. "Who owned
   what on 30 June, and what had accrued by then" is the question a closing
   binder, a redemption and a distribution all begin with. */
// Whole days between two 'YYYY-MM-DD' dates (never negative). Used for accrual.
function daysBetween(fromStr,toStr){
  const a=dayOf(fromStr),b=dayOf(toStr);if(!a||!b)return null;
  return Math.max(0,Math.round((b-a)/86400000));
}
// Whole days from a date to the as-of date, defaulting to today.
function daysSince(dateStr,asOf){return daysBetween(dateStr,asOf||todayISO());}

/* ---- Accrual conventions -------------------------------------------------
   The old arithmetic was simple interest on a 365-day year, everywhere, with
   no way to say otherwise — while real preferred returns are frequently
   compounded, and frequently computed 30/360. The convention belongs beside
   the rate it modifies rather than inside the formula, so it sits on the
   class, the tranche and the offering, and every certificate written before
   this carries 'simple/365' explicitly (see MIGRATIONS). */
const ACCRUAL_CONVENTIONS=[
  {value:'simple/365',label:'Simple interest, actual/365',basis:365,compound:0},
  {value:'simple/360',label:'Simple interest, 30/360',basis:360,compound:0,thirty360:true},
  {value:'annual/365',label:'Compounded annually, actual/365',basis:365,compound:1},
  {value:'quarterly/365',label:'Compounded quarterly, actual/365',basis:365,compound:4},
  {value:'monthly/365',label:'Compounded monthly, actual/365',basis:365,compound:12},
];
const ACCRUAL_BY_VALUE=new Map(ACCRUAL_CONVENTIONS.map(c=>[c.value,c]));
function accrualConvention(v){return ACCRUAL_BY_VALUE.get(v)||ACCRUAL_BY_VALUE.get('simple/365');}
// Days on a 30/360 basis: every month is 30 days and every year 360, which is
// what a note drafted that way means by "days".
function days30360(fromStr,toStr){
  const a=dayOf(fromStr),b=dayOf(toStr);if(!a||!b||b<a)return 0;
  let d1=a.getDate(),d2=b.getDate();
  if(d1>30)d1=30;
  if(d2>30&&d1>=30)d2=30;
  return Math.max(0,(b.getFullYear()-a.getFullYear())*360+(b.getMonth()-a.getMonth())*30+(d2-d1));
}
// What has accrued on `capital` at `rate` per cent per annum between two
// dates, under the named convention. Returns cents, or null if it cannot say.
function accrue(capitalCents,rate,startDate,asOf,conventionName){
  if(capitalCents==null||rate==null||!startDate)return null;
  const conv=accrualConvention(conventionName);
  const days=conv.thirty360?days30360(startDate,asOf||todayISO()):daysBetween(startDate,asOf||todayISO());
  if(days==null)return null;
  const years=days/conv.basis;
  const r=Number(rate)/100;
  if(!isFinite(r)||!isFinite(years))return null;
  if(!conv.compound)return Math.round(capitalCents*r*years);
  // Compounded n times a year, with the final part-period accrued simply —
  // interest is not credited for a period that has not ended.
  const n=conv.compound;
  const whole=Math.floor(years*n);
  const grown=capitalCents*Math.pow(1+r/n,whole);
  const rest=years-whole/n;
  return Math.round(grown*(1+r*rest)-capitalCents);
}
// The default class that cash investors go into (first non-sponsor class).
function defaultInvestedClass(o){const cls=(o&&Array.isArray(o.classes)?o.classes:[]).filter(c=>!c.sponsor);return cls.length?cls[0].name:null;}
// What has been paid against a certificate up to a date, split between
// preferred return and capital. Accrual that has been paid is not still owed,
// which is what made the old ever-growing figure misleading.
function distributedTo(certId,asOf){
  const cut=asOf||todayISO();
  let pref=0,capital=0;
  for(const d of db.distributions){
    if(d.pay_date&&d.pay_date>cut)continue;
    for(const a of(d.allocations||[])){
      if(a.certificate_id!==certId)continue;
      pref+=Number(a.pref_cents)||0;
      capital+=Number(a.capital_cents)||0;
    }
  }
  return{pref,capital};
}
// Enrich an offering's certificates with computed % of class, total % ownership
// and accrued return as at a date. Manual per-certificate values always override.
function computeCertificates(offeringId,asOf){
  asOf=asOf||todayISO();
  const o=db.offerings.find(x=>x.id===offeringId);
  const classes=(o&&Array.isArray(o.classes))?o.classes:[];
  const classByName=new Map(classes.map(c=>[c.name,c]));
  // A certificate cancelled by a transfer or a redemption is history, not a
  // holding: it stays in the file and out of the cap table. One cancelled on
  // or before the as-of date was still live before it, which is how a roster
  // dated last June shows last June's holders.
  const raw=db.certificates.filter(c=>c.offering_id===offeringId)
    .filter(c=>!c.cancelled_date||c.cancelled_date>asOf)
    // A successor is not a holding until the transfer that created it happened.
    .filter(c=>!c.issued_by_transfer_date||c.issued_by_transfer_date<=asOf)
    .map(c=>{
      const i=db.investors.find(x=>x.id===c.investor_id);
      return{...c,holder_name:i?investorDisplayName(i):(c.holder_name||null)};});
  const classCapital={},classCount={};let totalCapital=0;
  for(const c of raw){const k=c.class_name||'Unclassified';
    classCapital[k]=(classCapital[k]||0)+(Number(c.capital_cents)||0);
    classCount[k]=(classCount[k]||0)+1;totalCapital+=(Number(c.capital_cents)||0);}
  const anyClassTotals=classes.some(c=>c.total_percent!=null);
  // What the declared classes take, and therefore what is left for the rest.
  const declaredPct=classes.reduce((a,c)=>a+(c.total_percent!=null?Number(c.total_percent)||0:0),0);
  const remainderPct=Math.max(0,100-declaredPct);
  // Capital sitting in classes that declared no share of the company.
  const undeclaredNames=new Set(Object.keys(classCapital).filter(k=>{
    const def=classByName.get(k);return !def||def.total_percent==null;}));
  const undeclaredCapital=[...undeclaredNames].reduce((a,k)=>a+(classCapital[k]||0),0);
  const enriched=raw.map(c=>{
    const k=c.class_name||'Unclassified';const def=classByName.get(c.class_name);
    const capInClass=classCapital[k]||0;
    // Investor's % share WITHIN its class: pro-rata by capital, else even split
    // (sponsor/non-cash class), else a manual override.
    let pctClass=c.pct_of_class;
    if(pctClass==null){
      // Where a class holds capital, shares are strictly pro-rata to it — a
      // no-capital certificate takes 0% of that class rather than an equal
      // share on top, which used to push the class past 100%.
      if(capInClass>0)pctClass=c.capital_cents!=null?(c.capital_cents/capInClass)*100:0;
      // A class with no capital at all — a pure sponsor class — divides evenly.
      else if(classCount[k]>0)pctClass=100/classCount[k];
      else pctClass=null;}
    // Total % ownership of the whole company.
    let totalPct=c.percent_interest; // explicit override wins
    if(totalPct==null){
      if(def&&def.total_percent!=null&&pctClass!=null)totalPct=pctClass*def.total_percent/100;
      // A class with no declared share takes a slice of whatever the declared
      // classes leave — never its within-class share reported as a share of
      // the whole company.
      else if(anyClassTotals&&pctClass!=null)
        totalPct=undeclaredCapital>0&&c.capital_cents!=null
          ? (c.capital_cents/undeclaredCapital)*remainderPct
          // No capital anywhere in the undeclared classes: split the
          // remainder evenly between them, then within by pctClass — one
          // class taking the whole remainder per certificate over-allocates.
          : pctClass*(remainderPct/Math.max(1,undeclaredNames.size))/100;
      else if(totalCapital>0&&c.capital_cents!=null)totalPct=(c.capital_cents/totalCapital)*100;
      else totalPct=pctClass;}
    // Accrued return as at the as-of date, under the convention this
    // certificate was written under — never a convention chosen later.
    const convention=c.accrual_convention||(def&&def.accrual_convention)||o&&o.accrual_convention||settings().default_accrual_convention;
    let accrued=c.accrued_cents;
    if(accrued==null){
      const start=c.accrual_start||c.issue_date||c.funded_date;
      accrued=accrue(c.capital_cents,c.pref_return_rate,start,asOf,convention);
    }
    // What distributions have already retired, so the figure on the roster is
    // what is still owed rather than everything that ever accrued.
    const paid=distributedTo(c.id,asOf);
    return{...c,pct_of_class_calc:pctClass,total_pct_calc:totalPct,accrued_calc:accrued,
      accrual_convention_calc:convention,
      pref_paid_cents:paid.pref,capital_returned_cents:paid.capital,
      // Accrued, less what has been paid against it. Never below zero: an
      // over-payment is a return of capital, and is reported as one.
      accrued_outstanding:accrued==null?null:Math.max(0,accrued-paid.pref),
      class_total_percent:def?def.total_percent:null,class_sponsor:def?!!def.sponsor:false};});
  const classOrder=new Map(classes.map((c,idx)=>[c.name,idx]));
  enriched.sort((a,b)=>{
    const ao=classOrder.has(a.class_name)?classOrder.get(a.class_name):999;
    const bo=classOrder.has(b.class_name)?classOrder.get(b.class_name):999;
    if(ao!==bo)return ao-bo;
    const ac=a.class_name||'~',bc=b.class_name||'~';if(ac!==bc)return ac.localeCompare(bc);
    const asi=a.sort_index??1e9,bsi=b.sort_index??1e9;if(asi!==bsi)return asi-bsi;
    return String(a.cert_number||'').localeCompare(String(b.cert_number||''),undefined,{numeric:true});});
  // A cap table whose percentage column reads 99.9999% is taken by whoever is
  // holding it as an error in the document, not as the rounding artefact it
  // is. The displayed figures are settled here, by largest remainder, so the
  // column closes exactly on what it is a share of.
  settlePercentages(enriched,'total_pct_calc','total_pct_shown',
    anyClassTotals?Math.min(100,declaredPct+(undeclaredNames.size?remainderPct:0)):100);
  for(const name of new Set(enriched.map(c=>c.class_name||'Unclassified')))
    settlePercentages(enriched.filter(c=>(c.class_name||'Unclassified')===name),
      'pct_of_class_calc','pct_of_class_shown',100);
  return{offering:o,classes,certificates:enriched,classCapital,classCount,totalCapital,asOf,
    hasClassTotals:anyClassTotals,classNames:[...new Set(raw.map(c=>c.class_name).filter(Boolean))]};
}

/* ============================================================================
   AFTER THE CLOSING

   The app modelled the deal beautifully up to the moment the certificate was
   issued and then stopped, while the file itself runs for years past that
   point. Distributions, transfers, redemptions and staged funding all live
   here. Escrow is deliberately untouched by any of it: escrow is the account
   money sits in before a closing, and none of this happens before one.
   ========================================================================== */

/* Split `total` cents across weights, exactly. Largest remainder again, for
   the same reason as the percentage column: a distribution whose parts come
   to a cent less than the cheque is a distribution somebody has to explain. */
function allocateCents(total,weights){
  const sum=weights.reduce((a,w)=>a+(Number(w)||0),0);
  if(!(sum>0)||!total)return weights.map(()=>0);
  const exact=weights.map(w=>total*(Number(w)||0)/sum);
  const floors=exact.map(Math.floor);
  let short=total-floors.reduce((a,n)=>a+n,0);
  const order=exact.map((v,i)=>[v-floors[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  for(let k=0;k<order.length&&short>0;k++,short--)floors[order[k][1]]++;
  for(let k=order.length-1;k>=0&&short<0;k--,short++)floors[order[k][1]]--;
  return floors;
}

const DISTRIBUTION_BASES=[
  {value:'pref-first',label:'Preferred return first, then capital',
   help:'Pays what has accrued and is still owed, in proportion to it. Anything left over is returned as capital, pro rata by ownership.'},
  {value:'pro-rata',label:'Pro rata by ownership',
   help:'Split by total percentage interest, without regard to what has accrued.'},
  {value:'capital-return',label:'Return of capital',
   help:'Pro rata by the capital still outstanding on each certificate.'},
];

// What a distribution of `amountCents` would give each holder, under a basis.
// Returns rows the form can show and the user can override before anything is
// written — the same discipline as the suggestion strip.
function proposeDistribution(offeringId,amountCents,basis,asOf){
  const r=computeCertificates(offeringId,asOf);
  const live=r.certificates.filter(c=>!c.cancelled_date);
  const rows=live.map(c=>({
    certificate_id:c.id,investor_id:c.investor_id??null,
    holder:c.holder_name||'—',cert_number:c.cert_number,class_name:c.class_name,
    owed:c.accrued_outstanding||0,
    capitalLeft:Math.max(0,(c.capital_cents||0)-(c.capital_returned_cents||0)),
    ownership:Number(c.total_pct_shown)||0,
    pref_cents:0,capital_cents:0}));
  const amount=Math.max(0,Number(amountCents)||0);
  if(!amount||!rows.length)return{rows,basis,allocated:0,unallocated:amount};

  if(basis==='pro-rata'){
    allocateCents(amount,rows.map(r2=>r2.ownership)).forEach((v,i)=>{rows[i].capital_cents=v;});
  }else if(basis==='capital-return'){
    allocateCents(amount,rows.map(r2=>r2.capitalLeft)).forEach((v,i)=>{rows[i].capital_cents=v;});
  }else{
    // Preferred first. Where the money does not cover what is owed it is
    // split in proportion to what is owed — never rounded up to satisfy one
    // holder and leave another short.
    const owedTotal=rows.reduce((a,r2)=>a+r2.owed,0);
    const toPref=Math.min(amount,owedTotal);
    if(toPref>0)allocateCents(toPref,rows.map(r2=>r2.owed)).forEach((v,i)=>{rows[i].pref_cents=v;});
    const rest=amount-toPref;
    if(rest>0)allocateCents(rest,rows.map(r2=>r2.ownership)).forEach((v,i)=>{rows[i].capital_cents=v;});
  }
  const allocated=rows.reduce((a,r2)=>a+r2.pref_cents+r2.capital_cents,0);
  return{rows,basis,allocated,unallocated:amount-allocated};
}

/* ---- The chain of title --------------------------------------------------
   A certificate could be created or deleted and nothing else, so the cap
   table could only ever describe the original issuance and drifted out of
   date from the first secondary transfer onward. A transfer now cancels the
   certificate it came from and issues a successor that points back at it;
   deleting the transfer puts both back. Nothing is rewritten in place — a
   muniment of title that quietly changes hands is not evidence of anything. */
function certificateChain(certId){
  const out=[];
  let id=Number(certId);
  const guard=new Set();
  while(id&&!guard.has(id)){
    guard.add(id);
    const c=db.certificates.find(x=>x.id===id);
    if(!c)break;
    out.unshift(c);
    const t=db.transfers.find(x=>x.to_certificate_id===c.id);
    id=t?t.from_certificate_id:null;
  }
  return out;
}
const TRANSFER_KINDS=[
  {value:'transfer',label:'Transfer / assignment',help:'The holding passes to another holder. A successor certificate is issued.'},
  {value:'redemption',label:'Redemption',help:'The holding is bought back and leaves the cap table. No successor is issued.'},
];

/* ---- Staged funding ------------------------------------------------------
   For a fund that draws down over years, committed and funded are different
   numbers for most of the file's life. An offering says whether it funds in
   one payment or in calls; where it calls, what a subscriber owes today is
   what has been called of them, not what they promised in total. */
function callsFor(offeringId,subscriptionId,asOf){
  const cut=asOf||todayISO();
  let called=0;
  for(const c of db.capital_calls.filter(x=>x.offering_id===Number(offeringId))){
    if(c.call_date&&c.call_date>cut)continue;
    for(const a of(c.allocations||[]))
      if(a.subscription_id===Number(subscriptionId))called+=Number(a.amount_cents)||0;
  }
  return called;
}
// What a call of `percent` of each commitment would come to, per subscriber.
function proposeCall(offeringId,percent){
  offeringId=Number(offeringId);
  const pct=Math.max(0,Number(percent)||0);
  return db.subscriptions.filter(s=>s.offering_id===offeringId&&s.status!=='Withdrawn')
    .map(s=>{const inv=db.investors.find(i=>i.id===s.investor_id);
      const commitment=s.amount_committed_cents||0;
      const already=callsFor(offeringId,s.id);
      return{subscription_id:s.id,investor_id:s.investor_id,
        holder:inv?investorDisplayName(inv):'—',
        commitment,already,
        // Never call more than was committed, however the percentages add up.
        amount_cents:Math.max(0,Math.min(commitment-already,Math.round(commitment*pct/100)))};});
}

/* ---- Making a percentage column add up -----------------------------------
   Rounding each share independently leaves the column a basis point short or
   long. Largest remainder gives the odd units to the rows with the biggest
   fractional parts, so every displayed figure is within one unit of its exact
   share and the column totals exactly what it should.

   Rows carrying a manual override are left exactly as entered — someone typed
   that figure, and it is not this function's business to nudge it. */
const PCT_PLACES=4;
function settlePercentages(rows,fromKey,toKey,target){
  const unit=Math.pow(10,PCT_PLACES);             // work in ten-thousandths of a per cent
  const live=rows.filter(r=>r[fromKey]!=null&&isFinite(r[fromKey]));
  for(const r of rows)r[toKey]=r[fromKey];
  if(!live.length)return;
  const exact=live.reduce((a,r)=>a+Number(r[fromKey]),0);
  // Only settle a column that is already trying to be the target. A class
  // whose shares genuinely sum to 60% must not be inflated to 100%.
  if(Math.abs(exact-target)>0.5)return;
  const scaled=live.map(r=>Number(r[fromKey])*unit);
  const floors=scaled.map(Math.floor);
  let short=Math.round(target*unit)-floors.reduce((a,n)=>a+n,0);
  const order=scaled.map((v,i)=>[v-floors[i],i]).sort((a,b)=>b[0]-a[0]||a[1]-b[1]);
  for(let k=0;k<order.length&&short>0;k++,short--)floors[order[k][1]]++;
  // A column that came in long gives units back from the smallest remainders.
  for(let k=order.length-1;k>=0&&short<0;k--,short++)floors[order[k][1]]--;
  live.forEach((r,i)=>{r[toKey]=floors[i]/unit;});
}
// Create certificates for the subscriptions included in a closing. Numbers are
// assigned in funding-date order, continuing from the highest existing number.
function generateCertificatesForClosing(offeringId,closing,subIds){
  const o=db.offerings.find(x=>x.id===offeringId);if(!o)return 0;
  const existing=db.certificates.filter(c=>c.offering_id===offeringId);
  // One rule, read from the offering — the same one the manual form follows.
  let maxNum=highestCertNumber(offeringId);
  let maxSort=existing.reduce((m,c)=>Math.max(m,c.sort_index||0),0);
  const subs=subIds.map(id=>db.subscriptions.find(s=>s.id===id&&s.offering_id===offeringId))
    .filter(Boolean).filter(s=>s.investor_id).filter(s=>!existing.some(c=>c.subscription_id===s.id));
  subs.sort((a,b)=>{const fa=a.funded_date||closing.closing_date||'',fb=b.funded_date||closing.closing_date||'';
    if(fa!==fb)return fa.localeCompare(fb);
    const ia=db.investors.find(x=>x.id===a.investor_id),ib=db.investors.find(x=>x.id===b.investor_id);
    return investorSortKey(ia||{}).localeCompare(investorSortKey(ib||{}));});
  let made=0;
  for(const s of subs){
    const tr=(o.tranches||[]).find(t=>t.id===s.tranche_id);
    const className=(tr&&tr.class_name)||defaultInvestedClass(o)||o.security_type||'Units';
    const rate=(tr&&tr.default_return_rate!=null)?tr.default_return_rate:(o.default_return_rate!=null?o.default_return_rate:null);
    maxNum++;maxSort++;made++;
    db.certificates.push({id:nextId('certificates'),offering_id:offeringId,subscription_id:s.id,closing_id:closing.id,
      investor_id:s.investor_id,holder_name:null,class_name:className,capital_cents:s.amount_committed_cents||0,
      pct_of_class:null,percent_interest:null,pref_return_rate:rate,accrued_cents:null,
      funded_date:s.funded_date||closing.closing_date||null,accrual_start:closing.closing_date||null,
      issue_date:closing.closing_date||null,cert_number:formatCertNumber(o,maxNum),sort_index:maxSort,no_capital:0,
      // Written down at issue, so a convention chosen later never restates a
      // certificate that was computed under the old one.
      accrual_convention:(tr&&tr.accrual_convention)||o.accrual_convention||settings().default_accrual_convention,
      created_at:nowISO()});}
  return made;
}

   FIRM SETTINGS — the constants that are true of the practice, not of one deal.
   Entered once in Settings; every new offering starts from them.
   ========================================================================== */
const DEFAULT_REPORT_FOOTER='Not an offering document, not a filing, and not a substitute for the executed instruments. Figures are unaudited.';
const SETTINGS_DEFAULTS={

  report_footer:DEFAULT_REPORT_FOOTER,
  default_exemption:null,default_security_type:null,default_return_rate:null,
  default_costs_label:'Legal & professional fees',default_min_investment:null,
  default_escrow_party_id:null,
  checklist_template:null,          // null → DEFAULT_CHECKLIST
  automation:'propose',             // 'propose' | 'off'
  mask_account_numbers:1,

function settings(){return{...SETTINGS_DEFAULTS,...(db.settings||{})};}

/* ============================================================================
   THE EXEMPTION — what the record says about the ground the offering stands on.

   Everything here reads facts the app already stored and works out where they
   put the offering. None of it files anything, and none of it is advice; it
   answers questions the file can answer and says which fact each answer came
   from, so the suggestion strip can put them where they will be seen rather
   than leaving them to be remembered.
   ========================================================================== */

// The date of first sale, and which fact fixed it. Rule 503 runs the Form D
// deadline from here, and the app has known it all along: the earliest signed
// subscription, or the earliest deposit that actually cleared.
function firstSale(offeringId){
  offeringId=Number(offeringId);
  const subs=db.subscriptions.filter(s=>s.offering_id===offeringId&&s.status!=='Withdrawn');
  const signed=subs.map(s=>s.sub_signed_date).filter(Boolean).sort()[0]||null;
  const cleared=db.escrow.filter(e=>e.offering_id===offeringId&&e.txn_type==='deposit'&&e.cleared)
    .map(e=>e.txn_date).filter(Boolean).sort()[0]||null;
  if(!signed&&!cleared)return{date:null,from:null};
  if(signed&&(!cleared||signed<=cleared))return{date:signed,from:'the earliest signed subscription'};
  return{date:cleared,from:'the earliest cleared deposit'};
}
// Fifteen calendar days after the first sale, which is what Rule 503 gives.
const FORM_D_DAYS=15;
function addDays(dateStr,n){
  const d=dayOf(dateStr);if(!d)return null;
  const out=new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
  return `${out.getFullYear()}-${String(out.getMonth()+1).padStart(2,'0')}-${String(out.getDate()).padStart(2,'0')}`;
}
function addYears(dateStr,n){
  const d=dayOf(dateStr);if(!d)return null;
  const out=new Date(d.getFullYear()+n,d.getMonth(),d.getDate());
  return `${out.getFullYear()}-${String(out.getMonth()+1).padStart(2,'0')}-${String(out.getDate()).padStart(2,'0')}`;
}
// Where the offering stands on its Form D. Returns null where the exemption
// does not call for one.
function formDPosition(o){
  if(!o||!/^Reg D/.test(String(o.exemption||'')))return null;
  const sale=firstSale(o.id);
  const due=sale.date?addDays(sale.date,FORM_D_DAYS):null;
  const filed=o.form_d_filed_date||null;
  const live=!['Closed','Terminated'].includes(o.status);
  // The annual amendment falls on or before the anniversary of the last
  // filing, for as long as the offering continues.
  const amendmentDue=filed&&live?addYears(filed,1):null;
  return{
    firstSale:sale.date,from:sale.from,due,filed,
    daysLeft:due?daysUntil(due):null,
    // Filed late is a fact about the file, not a thing to fix now; it is
    // reported once and never nagged about.
    filedLate:!!(filed&&due&&filed>due),
    overdue:!!(due&&!filed&&daysUntil(due)<0),
    amendmentDue,
    amendmentDaysLeft:amendmentDue?daysUntil(amendmentDue):null};
}

// Purchasers on an offering, and what the record establishes about them.
function purchaserStanding(offeringId){
  offeringId=Number(offeringId);
  const subs=db.subscriptions.filter(s=>s.offering_id===offeringId&&s.status!=='Withdrawn');
  const rows=subs.map(s=>({sub:s,investor:db.investors.find(i=>i.id===s.investor_id)||null}));
  const statusOf=r=>(r.investor&&r.investor.accredited_status)||'Unknown';
  return{
    total:rows.length,
    rows,
    verified:rows.filter(r=>statusOf(r)==='Verified'),
    selfCertified:rows.filter(r=>statusOf(r)==='Self-certified'),
    // Established as not accredited. These are the ones the 506(b) ceiling counts.
    nonAccredited:rows.filter(r=>statusOf(r)==='Not accredited'),
    // Neither established nor denied. Not evidence of anything, which is the
    // problem with leaving them there.
    unestablished:rows.filter(r=>statusOf(r)==='Unknown')};
}
// Rule 506(b): no more than thirty-five non-accredited purchasers, and any at
// all bring the Rule 502(b) information-delivery obligation with them.
const RULE_506B_LIMIT=35;

// A verification whose evidence is old enough that a sale today should not
// rest on it. Returns days stale, or null where it does not arise.
function accreditationStaleness(investor,asOf){
  if(!investor||investor.accredited_status!=='Verified')return null;
  const at=investor.accredited_evidence_date||investor.accredited_verified_date;
  if(!at)return null;
  const days=daysBetween(at,asOf||todayISO());
  return days!=null&&days>ACCREDITATION_STALE_DAYS?days:null;
}

/* ---- Blue sky ------------------------------------------------------------
   The checklist compressed the whole of state practice into one line. It is
   one notice filing per state of residence, each with its own fee and its own
   clock — and the record already knows which states are in play, because it
   knows where the subscribers are. */
function stateFilings(offeringId){
  offeringId=Number(offeringId);
  return db.state_filings.filter(f=>f.offering_id===offeringId)
    .sort((a,b)=>String(a.state||'').localeCompare(String(b.state||'')));
}
// A two-letter state from the investor's own field, or read off the tail of
// the address when that is all there is — "…Ann Arbor, MI 48104". A guess is
// only ever offered as a suggestion; nothing is written from one.
function investorState(i){
  if(!i)return null;
  const own=str(i.state);
  if(own&&US_STATES.includes(own.toUpperCase()))return own.toUpperCase();
  const words=String(i.address||'').trim().toUpperCase()
    .replace(/\s+\d{5}(-\d{4})?$/,'')          // a trailing ZIP is not the state
    .split(/[,\s]+/).filter(Boolean);
  const last=words[words.length-1];
  return last&&US_STATES.includes(last)?last:null;
}
// Which states this offering has sold into, with who put each one in play.
function statesInPlay(offeringId){
  offeringId=Number(offeringId);
  const out=new Map();
  for(const s of db.subscriptions.filter(x=>x.offering_id===offeringId&&x.status!=='Withdrawn')){
    const inv=db.investors.find(i=>i.id===s.investor_id);
    const code=investorState(inv);
    if(!code)continue;
    if(!out.has(code))out.set(code,[]);
    out.get(code).push({investor:inv,sub:s});
  }
  return out;
}

/* ---- Party directory ----------------------------------------------------- */
// Issuers, escrow agents, banks and counsel are typed once and picked thereafter.
const PARTY_ROLES=['Issuer','Escrow agent','Counsel','Placement agent','Fund administrator','Other'];
const PARTY_ROLE_KIND={'Issuer':'info','Escrow agent':'success','Counsel':'default','Placement agent':'warn','Fund administrator':'muted','Other':'muted'};
function partiesByRole(role){return db.parties.filter(p=>p.role===role).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));}
function partyById(id){id=Number(id);return db.parties.find(p=>p.id===id)||null;}
function partyFromBody(b){return{
  role:str(b.role)||'Other',name:str(b.name),legal_name:str(b.legal_name),
